<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--head-end-->
<title>Flux Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: tool shell. Top bar · left rail (add, layers, pages) · canvas (design or sitemap) · right inspector (element, theme, history) · status bar.
   Volume is turned down everywhere except the one thing that matters: the canvas and the primary action. */
:root {
  --bg: #eef0ec;
  --panel: #fbfcfa;
  --sunk: #e6e9e3;
  --rule: #d6dbd2;
  --ink: #161a15;
  --muted: #5c6459;
  --accent: #2448d8;
  --accent-ink: #ffffff;
  --accent-soft: rgba(36, 72, 216, 0.10);
  --override: #b4520c;
  --ok: #1d7a4a;
  --warn: #a8640b;
  --danger: #b8382a;
  --comp: #7a3fd1;
  --font-ui: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111411; --panel: #171b17; --sunk: #0d100d; --rule: #283028; --ink: #e6ebe4; --muted: #949e91;
    --accent: #7b93ff; --accent-ink: #0b0f1f; --accent-soft: rgba(123, 147, 255, 0.14); --override: #f0904a; --ok: #4cc58a; --warn: #e4a54a; --danger: #f07563; --comp: #b590ff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111411; --panel: #171b17; --sunk: #0d100d; --rule: #283028; --ink: #e6ebe4; --muted: #949e91;
  --accent: #7b93ff; --accent-ink: #0b0f1f; --accent-soft: rgba(123, 147, 255, 0.14); --override: #f0904a; --ok: #4cc58a; --warn: #e4a54a; --danger: #f07563; --comp: #b590ff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 400 13px/1.4 var(--font-ui); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 13px; height: 13px; }

.shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100vh; }
/* top bar */
.bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--rule); -webkit-user-select: none; user-select: none; }
.logo { display: flex; align-items: center; gap: 7px; font: 700 14px/1 var(--font-ui); letter-spacing: -0.01em; margin-right: 4px; }
.logo svg { width: 20px; height: 20px; }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-right: 1px solid var(--rule); background: transparent; padding: 5px 9px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 5px 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--sunk); color: var(--ink); }
.btn.icon { padding: 5px 6px; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.pagebtn { max-width: 220px; }
.pagebtn span { overflow: hidden; text-overflow: ellipsis; }
.pagebtn small { color: var(--muted); font: 500 11px/1 var(--font-data); }
.score { font: 600 12px/1 var(--font-ui); }
.score b { font: 600 11.5px/1 var(--font-data); padding: 3px 6px; border-radius: 99px; color: var(--accent-ink); }
.score.good b { background: var(--ok); } .score.mid b { background: var(--warn); } .score.bad b { background: var(--danger); }
.bp-note { font: 500 11.5px/1 var(--font-ui); color: var(--override); display: inline-flex; align-items: center; gap: 4px; }

/* workspace */
.work { display: grid; grid-template-columns: 248px minmax(0, 1fr) 300px; min-height: 0; }
.live .work, .mapview .work { grid-template-columns: minmax(0, 1fr); }
.live .left, .live .right, .mapview .left, .mapview .right { display: none; }
@media (max-width: 1100px) { .work { grid-template-columns: 216px minmax(0, 1fr) 272px; } }
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } .left, .right { border: 0 !important; border-top: 1px solid var(--rule) !important; max-height: none !important; } .canvas-wrap { order: -1; } }
.left, .right { background: var(--panel); min-width: 0; overflow: auto; max-height: calc(100vh - 82px); }
.left { border-right: 1px solid var(--rule); -webkit-user-select: none; user-select: none; }
.right { border-left: 1px solid var(--rule); }
.addbar { padding: 10px 10px 8px; }
.addbar .btn { width: 100%; justify-content: center; padding: 8px; }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { border: 0; background: transparent; padding: 8px 4px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.list { list-style: none; margin: 0; padding: 6px; display: grid; }
.list li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; min-width: 0; color: var(--ink); }
.list li:hover { background: var(--sunk); }
.list li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.list li .ic { color: var(--muted); }
.list li[aria-selected="true"] .ic { color: var(--accent); }
.list li .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.list li .sub { color: var(--muted); font: 500 11px/1 var(--font-data); margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.list li .tag { font: 600 9.5px/1 var(--font-ui); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 4px; }
.list li.drop-before { border-top-color: var(--accent); }
.list li.drop-after { border-bottom-color: var(--accent); }
.list li.drop-inside { border-color: var(--accent); }
.list li .ov { width: 6px; height: 6px; border-radius: 50%; background: var(--override); flex: none; margin-left: auto; }
.list li .row-act { margin-left: auto; opacity: 0; }
.list li:hover .row-act, .list li[aria-selected="true"] .row-act { opacity: 1; }
.railfoot { display: flex; gap: 6px; padding: 4px 10px 12px; flex-wrap: wrap; }

/* canvas */
.canvas-wrap { min-width: 0; overflow: auto; position: relative; padding: 14px 16px 40px; max-height: calc(100vh - 82px); }
.shell:not(.live) .canvas-wrap { -webkit-user-select: none; user-select: none; }
.live .canvas-wrap { padding: 0; }
.stage { position: relative; margin: 0 auto; transform-origin: top left; }
.frame { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.08); border-radius: 6px; overflow: hidden; }
.live .frame { border-radius: 0; box-shadow: none; }
.devlabel { font: 500 11px/1 var(--font-data); color: var(--muted); margin: 0 auto 8px; display: flex; justify-content: space-between; gap: 8px; }
.live .devlabel { display: none; }
.ov-box { position: absolute; pointer-events: none; border: 1px solid var(--accent); z-index: 3; }
.ov-box.hover { border-style: dashed; opacity: .8; }
.ov-pad { position: absolute; pointer-events: none; background: repeating-linear-gradient(45deg, var(--accent-soft), var(--accent-soft) 4px, transparent 4px, transparent 8px); z-index: 2; }
.ov-tag { position: absolute; pointer-events: auto; z-index: 4; display: flex; align-items: stretch; background: var(--accent); color: var(--accent-ink); border-radius: 5px; font: 600 11px/1 var(--font-ui); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); transform-origin: left top; }
.ov-tag span { padding: 5px 7px; display: inline-flex; align-items: center; gap: 5px; }
.ov-tag button { border: 0; background: transparent; color: inherit; padding: 3px 5px; display: grid; place-items: center; border-left: 1px solid rgba(255,255,255,.25); }
.ov-tag button.grip { border-left: 0; border-right: 1px solid rgba(255,255,255,.25); cursor: grab; padding: 3px 6px; }
.ov-tag button.grip:active { cursor: grabbing; }
.live .ov-box, .live .ov-pad, .live .ov-tag { display: none; }
.drop-line { position: absolute; background: var(--accent); z-index: 6; pointer-events: none; border-radius: 3px; box-shadow: 0 0 0 1px var(--panel); }
.drop-zone { position: absolute; border: 2px dashed var(--accent); background: var(--accent-soft); z-index: 5; pointer-events: none; border-radius: 4px; }
.drag-ghost { position: absolute; z-index: 7; pointer-events: none; background: var(--ink); color: var(--bg); font: 600 11.5px/1 var(--font-ui); padding: 6px 9px; border-radius: 6px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.2); transform-origin: left top; }

/* sitemap */
.sitemap { position: relative; }
.smbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
.smbar h2 { margin: 0; font-size: 16px; }
.smbar .sum { color: var(--muted); }
.smlegend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
.smlegend i { display: inline-block; width: 18px; height: 2px; vertical-align: middle; margin-right: 5px; }
.smscroll { overflow: auto; padding-bottom: 20px; }
.smcanvas { position: relative; margin: 0 auto; }
.smcanvas > svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.smcard { position: absolute; width: 196px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 11px; display: grid; gap: 4px; cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.smcard:hover { border-color: var(--muted); }
.smcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.smcard.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.smcard .t { display: flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; }
.smcard .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.smcard code { font: 500 11px/1.2 var(--font-data); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.smcard .st { font-size: 11.5px; color: var(--muted); }
.smcard .chips { display: flex; gap: 4px; flex-wrap: wrap; min-height: 0; }
.chip { font: 600 10px/1 var(--font-ui); padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; }
.chip.warn { color: var(--warn); } .chip.bad { color: var(--danger); } .chip.info { color: var(--muted); }
.smcard .open { justify-self: start; margin-top: 2px; }

/* inspector */
.ins-head { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.elhead { display: flex; align-items: center; gap: 6px; }
.elhead .tyb { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--font-ui); padding: 4px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.elhead input { flex: 1; min-width: 60px; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 5px; font-weight: 600; }
.elhead input:hover, .elhead input:focus { border-color: var(--rule); background: var(--sunk); }
.acc { border-bottom: 1px solid var(--rule); }
.acc > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-weight: 600; -webkit-user-select: none; user-select: none; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary .ic { color: var(--muted); }
.acc > summary .cnt { font: 600 10.5px/1 var(--font-data); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 6px; }
.acc > summary .chev { margin-left: auto; transition: transform .15s; }
.acc[open] > summary .chev { transform: rotate(180deg); }
.acc > summary:hover { background: var(--sunk); }
.acc-body { padding: 2px 12px 12px; display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 14px; align-items: center; gap: 6px; min-height: 26px; }
.row > label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.set > label { color: var(--ink); font-weight: 600; }
.row .rst { width: 14px; height: 14px; border: 0; padding: 0; background: transparent; display: grid; place-items: center; }
.row .rst::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.row.set .rst::after { background: var(--accent); }
.row.set.bpset .rst::after { background: var(--override); }
.row.set .rst:hover::after { background: var(--danger); }
.row.ovr > label { color: var(--comp); }
.row.ovr .rst::after { background: var(--comp) !important; }
.list li.inst .nm, .list li.inst .ic { color: var(--comp); }
.list li.inst-in .nm { color: var(--muted); }
.compbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 auto 10px; padding: 7px 10px; border-radius: 8px; background: var(--comp); color: #fff; font-weight: 600; }
.compbar .spacer { flex: 1; }
.compbar .btn { background: #fff; color: var(--comp); border-color: #fff; }
.compnote { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--comp); background: color-mix(in srgb, var(--comp) 8%, transparent); }
.compnote p { margin: 0; font-size: 12px; }
.compnote .acts { display: flex; gap: 5px; flex-wrap: wrap; }
.libsec { padding: 8px 10px; display: grid; gap: 8px; }
.libsec h4 { margin: 4px 2px 0; font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.libtile { border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); overflow: hidden; cursor: grab; display: grid; }
.libtile:hover { border-color: var(--comp); }
.libtile .thumb { height: 96px; overflow: hidden; position: relative; background: var(--sunk); border-bottom: 1px solid var(--rule); pointer-events: none; }
.libtile .meta { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; min-width: 0; }
.libtile .meta .ic { color: var(--comp); }
.libtile .meta span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.libtile .meta small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.myrow { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 7px; }
.myrow span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.myrow small { color: var(--muted); }
.pop .field { display: grid; gap: 4px; margin-bottom: 8px; }
.pop .field input, .pop textarea { border: 1px solid var(--rule); border-radius: 7px; padding: 6px 8px; background: var(--panel); }
.pop textarea { width: 100%; min-height: 120px; font: 400 11px/1.4 var(--font-data); }
.pop .row2 { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.ctl-seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0; }
.ctl-seg button { flex: 1 1 auto; min-width: 0; border: 0; border-right: 1px solid var(--rule); background: var(--panel); padding: 4px 1px; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; justify-content: center; align-items: center; gap: 3px; }
.ctl-seg button:last-child { border-right: 0; }
.ctl-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.row.inh .ctl-seg button[aria-pressed="true"] { background: var(--sunk); color: var(--ink); }
select.ctl, input.ctl, textarea.ctl { width: 100%; min-width: 0; border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 4px 6px; }
textarea.ctl { resize: vertical; min-height: 54px; font-size: 12.5px; }
.row.inh select.ctl { color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--rule); padding: 0; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.row.inh .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--muted); }
.swatches button.none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%), var(--panel); }
.boxm { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; align-items: center; justify-items: center; padding: 6px; border: 1px dashed var(--rule); border-radius: 7px; background: var(--sunk); }
.boxm .mid { grid-column: 2; grid-row: 2; width: 100%; height: 24px; border-radius: 4px; background: var(--panel); border: 1px solid var(--rule); display: grid; place-items: center; font: 500 10px/1 var(--font-data); color: var(--muted); }
.boxm select { width: 100%; max-width: 76px; border: 1px solid var(--rule); background: var(--panel); border-radius: 5px; padding: 2px 3px; font: 500 11px/1.2 var(--font-data); }
.boxm select.set { border-color: var(--accent); color: var(--accent); }
.boxm select.bpset { border-color: var(--override); color: var(--override); }
.boxm .t { grid-column: 2; grid-row: 1; } .boxm .r { grid-column: 3; grid-row: 2; } .boxm .b { grid-column: 2; grid-row: 3; } .boxm .l { grid-column: 1; grid-row: 2; }
.anchor-wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.anchor { display: grid; grid-template-columns: repeat(3, 16px); gap: 3px; padding: 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sunk); }
.anchor button { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--rule); background: var(--panel); padding: 0; }
.anchor button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.rngc { display: grid; grid-template-columns: minmax(0, 1fr) 54px 10px; gap: 6px; align-items: center; }
.rngc .num { width: 100%; font: 500 11.5px/1 var(--font-data); padding: 4px 5px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); text-align: right; }
.rngc .pc { font: 500 11px/1 var(--font-data); color: var(--muted); }
.rngc input { width: 100%; accent-color: var(--accent); }
.livestat { margin: 0 0 8px; padding: 7px 9px 7px 24px; border-radius: 7px; background: var(--sunk); font-size: 12px; line-height: 1.4; position: relative; }
.livestat::before { content: ''; position: absolute; left: 10px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: #b45309; }
.livestat[data-state=live]::before { background: #15803d; }
.fields { display: grid; gap: 2px; margin: 8px 0; }
.fieldrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; text-align: left; color: var(--ink); cursor: pointer; }
.fieldrow:hover { border-color: var(--rule); background: var(--sunk); }
.fieldrow code { font: 600 11.5px/1.2 var(--font-data); color: var(--accent); }
.fieldrow span { font: 400 11.5px/1.2 var(--font-data); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.chips2 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.chips2 .hint { width: 100%; display: flex; gap: 4px; align-items: center; }
.chip2 { border: 1px solid var(--rule); background: var(--panel); border-radius: 999px; padding: 2px 8px; font: 500 11px/1.4 var(--font-data); color: var(--ink); cursor: pointer; }
.chip2:hover { border-color: var(--accent); }
details.adv { margin: 4px 0 6px; } details.adv summary { cursor: pointer; font-size: 12px; color: var(--muted); padding: 4px 0; }
.warnhint { color: var(--warn); }
.pwmeter { font-size: 12px; margin: 2px 0 8px; padding-left: 10px; border-left: 3px solid var(--rule); }
.pwmeter.weak, .pwmeter.none { border-color: var(--danger); color: var(--danger); } .pwmeter.ok { border-color: var(--warn); } .pwmeter.strong { border-color: #15803d; }
.serp { border: 1px solid var(--rule); border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); display: grid; gap: 3px; }
.serp cite { font: 400 12px/1.3 system-ui, sans-serif; color: #4d5156; font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.serp b { font: 400 17px/1.3 system-ui, sans-serif; color: #1a0dab; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.serp p { margin: 0; font: 400 13px/1.45 system-ui, sans-serif; color: #4d5156; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.seock li .ic { margin-top: 2px; } .seock li.ok .ic { color: #15803d; } .seock li.warn .ic { color: var(--warn); }
.seock li span small { display: block; color: var(--muted); }
.botrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
.botrow small { display: block; color: var(--muted); font-size: 11.5px; }
.botrow code { font: 600 11.5px/1.2 var(--font-data); }
.tile.live .ic { color: var(--accent); }
.rngc output { font: 500 11.5px/1 var(--font-data); text-align: right; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.hint b { color: var(--ink); }
.linkpick { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); }
.linkpick .go { display: flex; gap: 6px; align-items: center; }
.sect { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
.sect h3 { margin: 0; font: 600 11px/1 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.pal button { border: 1px solid var(--rule); background: var(--panel); border-radius: 7px; padding: 6px; text-align: left; display: grid; gap: 5px; }
.pal button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pal .chips { display: flex; height: 14px; border-radius: 3px; overflow: hidden; }
.pal .chips i { display: block; }
.pal span { font-weight: 600; font-size: 12px; }
.tokrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.tokrow input[type="color"] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--rule); border-radius: 5px; background: none; }
.tokrow code { font: 500 11px/1 var(--font-data); color: var(--muted); }
.tokrow small { color: var(--muted); }
.cpair { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-size: 12px; }
.cpair code { font: 500 11px/1 var(--font-data); }
.cpair .ok { color: var(--ok); font-weight: 700; } .cpair .bad { color: var(--danger); font-weight: 700; }
.fontpairs { display: grid; gap: 4px; }

.fontpairs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.fontpairs b { font-size: 17px; font-weight: 700; line-height: 1.1; }
.fontpairs small { color: var(--muted); }
.rng { display: grid; grid-template-columns: 82px minmax(0, 1fr) 46px; gap: 6px; align-items: center; }

.oplog li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }

.oplog li span:last-child { color: var(--muted); }

.pop { position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,.18); padding: 10px; max-height: min(78vh, 640px); overflow: auto; width: min(380px, calc(100vw - 16px)); }

.checks li b { display: block; font-size: 12.5px; }
.checks li p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.checks li .acts { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.ratio { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 5px; border: 1px solid var(--rule); }
.ratio i { display: block; height: 100%; }
.checkhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.checkhead p { margin: 0; color: var(--muted); font-size: 12px; }

.status { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 5px 14px; border-top: 1px solid var(--rule); background: var(--panel); font: 500 11px/1.3 var(--font-data); color: var(--muted); }
.status b { color: var(--ink); font-weight: 500; }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 600; z-index: 50; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }

.modal { position: fixed; inset: 0; background: rgba(10, 12, 10, .5); display: grid; place-items: center; padding: 16px; z-index: 60; }
.sheet { width: min(900px, 100%); max-height: calc(100% - 32px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }

.sheet .acts { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.sheet.ask { width: min(480px, 100%); grid-template-rows: auto; gap: 12px; }
.askhead { display: flex; gap: 10px; align-items: center; }
.askic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--comp) 14%, transparent); color: var(--comp); flex: none; }
.sheet.ask h2 { font-size: 16px; margin: 0; }
.sheet.ask p { margin: 0; color: var(--muted); line-height: 1.5; }
.askrem { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.sheet.ask .acts { justify-content: stretch; }
.sheet.ask .acts .btn { flex: 1 1 auto; justify-content: center; }
.btn.compbtn { background: var(--comp); border-color: var(--comp); color: #fff; }

/* =========================================================================

  ['y', 'Y', 'position', 'pct'],
  ['inset', 'Inset', 'position', 'space'],

const str = Object.fromEntries(SF.map((k) => [k, []]));

/* =========================================================================

  Grove: { bg: '#f7f9f3', surface: '#e9efdf', ink: '#1b2616', muted: '#56624e', brand: '#3b6b2a', 'on-brand': '#f4faef', accent: '#b4441e', line: '#d9e1cd', 'on-accent': '#ffffff' },
  Mono: { bg: '#ffffff', surface: '#f2f2f0', ink: '#111111', muted: '#5f5f5c', brand: '#111111', 'on-brand': '#ffffff', accent: '#e4572e', line: '#e3e3df', 'on-accent': '#111111' },

};
const TOKEN_ROLE = { bg: 'Neutral · 60', surface: 'Neutral · 60', ink: 'Neutral · text', muted: 'Neutral · text', line: 'Neutral', brand: 'Brand · 30', 'on-brand': 'Text on brand', accent: 'Accent · 10, for calls to action', 'on-accent': 'Text on accent' };
const FONT_PAIRS = [['Fraunces', 'Work Sans'], ['Bricolage Grotesque', 'Instrument Sans'], ['DM Serif Display', 'DM Sans'], ['Syne', 'Manrope'], ['Playfair Display', 'Source Sans 3'], ['Archivo Black', 'Archivo']];
const BODY_SAFE = new Set(['Work Sans', 'Instrument Sans', 'DM Sans', 'Manrope', 'Source Sans 3', 'Archivo']);
const FONT_AXES = { 'Fraunces': 'wght@400;600;700;800', 'Work Sans': 'wght@400;500;600;700', 'Bricolage Grotesque': 'wght@400;600;800', 'Instrument Sans': 'wght@400;500;600;700', 'DM Serif Display': '', 'DM Sans': 'wght@400;500;700', 'Syne': 'wght@400;600;700;800', 'Manrope': 'wght@400;500;600;700;800', 'Playfair Display': 'wght@400;600;700;800', 'Source Sans 3': 'wght@400;600;700', 'Archivo Black': '', 'Archivo': 'wght@400;500;600;700', 'JetBrains Mono': 'wght@400;500' };
const SERIFS = new Set(['Fraunces', 'DM Serif Display', 'Playfair Display']);

const loadedFonts = new Set();
function fontHref(names) { return 'https://fonts.googleapis.com/css2?' + names.map((n) => 'family=' + n.replace(/ /g, '+') + (FONT_AXES[n] ? ':' + FONT_AXES[n] : '')).join('&') + '&display=swap'; }

/* =========================================================================

   ========================================================================= */
const SPACE_CSS = { gap: 'gap', pt: 'padding-top', pr: 'padding-right', pb: 'padding-bottom', pl: 'padding-left', mt: 'margin-top', mb: 'margin-bottom' };

/* Access gates in exported pages. Email gates are soft: the content ships in
   the page and opens once a visitor leaves an address. Password gates are
   real: the content ships only as AES-256-GCM ciphertext under a key derived

    const f = g.querySelector('form'), err = g.querySelector('.fx-gate-e'), id = g.dataset.id, mode = g.dataset.gate, host = g.parentElement;
    const open = (html) => {
      if (html != null) { const t = document.createElement('template'); t.innerHTML = html; g.replaceWith(t.content); }
      else { const c = g.nextElementSibling; if (c && c.classList.contains('fx-gated')) c.replaceWith(...c.childNodes); g.remove(); }
      if (onOpen) onOpen(host);

    if (mode === 'email') { try { if (localStorage.getItem('fx-gate-' + id)) { open(); continue; } } catch (e) {} }
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = f.querySelector('input').value.trim();
      if (mode === 'email') {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { err.textContent = 'Enter a valid email address.'; return; }

      }
      if (!window.crypto || !crypto.subtle) { err.textContent = 'This page must be opened over https to unlock.'; return; }
      try {
        err.textContent = 'Unlocking…';
        const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(v), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(g.dataset.salt), iterations: +g.dataset.it, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    const x = pctOf(id, PI.x, device) + ax, y = pctOf(id, PI.y, device) + ay;
    commitSeq([() => (ax ? { k: 'set', id, p: PI.x, bp: device, v: pctEnc(x) } : null), () => (ay ? { k: 'set', id, p: PI.y, bp: device, v: pctEnc(y) } : null)], 'Nudge');
    toast(`X ${Math.max(PCT_MIN, Math.min(PCT_MAX, x))} % · Y ${Math.max(PCT_MIN, Math.min(PCT_MAX, y))} %`);
  } else moveSel(key === 'ArrowUp' || key === 'ArrowLeft' ? -1 : 1);
}
setInterval(() => { if (sel >= 0 && !live && view === 'design') placeOverlays(); }, 400);
window.addEventListener('resize', layoutStage);

/* boot: the saved site if there is one, otherwise the sample site */
let restored = false;
try { const s = localStorage.getItem('flux-studio-site-v5'); if (s) { const d = JSON.parse(s); if (d && d.v === 5) { loadDoc(d); restored = true; } } } catch (e) { restored = false; }
if (!restored) { buildFresh(sampleSite()); componentizeSample(); }
sel = curPage;
render(); layoutStage(); renderLayers(); renderInspector(); renderPageBtn(); renderStatus();
ensureFonts(['JetBrains Mono']);
setTimeout(() => runChecks(), 400);
if (restored) toast('Restored your last session. More → Load the sample site starts over.');
})();
</script>
