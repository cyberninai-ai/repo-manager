<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Env</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110b09; --bg-deep:#0b0706; --panel:rgba(28,20,17,.82); --panel-solid:#1a1210; --raise:#231915; --raise2:#2b201b;
  --line:rgba(255,224,204,.08); --line2:rgba(255,224,204,.15); --grid:rgba(255,224,204,.035);
  --text:#f2e9e2; --muted:#a69389; --dim:#6e5f57;
  --copper:#e9a184; --copper2:#c8775a; --copper-glow:rgba(233,161,132,.18);
  --teal:#62d6ca; --teal-ink:#05211e; --teal-soft:#0f2b2a; --teal-line:#1f4a47;
  --navy:#0d1d29; --navy-line:#22405a; --navy-text:#d9e8f3;
  --green:#8fdc9f; --green-soft:#132b1c; --green-line:#2c5a3a;
  --amber:#ebbd6a; --amber-soft:#2e2312; --red:#f2836f; --red-soft:#2e1714;
  --display:'Inter Tight','Inter',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 520px at 18% 8%,rgba(233,161,132,.10),transparent 70%),radial-gradient(800px 600px at 90% 90%,rgba(98,214,202,.05),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55))}
#tex{position:fixed;inset:0;z-index:-1;pointer-events:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .copper{color:var(--copper)} .green{color:var(--green)} .red{color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .spacer{flex:1}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 40px;background:linear-gradient(var(--bg) 45%,rgba(17,11,9,0))}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:600 22px var(--display);letter-spacing:.32em}
.brand span{font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--muted);margin-top:5px;white-space:nowrap}
.navpill{display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:rgba(24,17,14,.85);border:1px solid var(--line);backdrop-filter:blur(10px)}
.navpill a,.navpill button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;color:var(--muted);font-size:14px;background:none;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.navpill a:hover,.navpill button:hover{color:var(--text);background:rgba(255,224,204,.04)}
.navpill a.on{color:var(--navy-text);background:var(--navy);border-color:var(--navy-line);box-shadow:inset 0 -2px 0 #4a90c2}
.navpill .badge{font:500 10px var(--mono);background:var(--copper2);color:#1a0d08;border-radius:10px;padding:1px 6px}
.acct{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 10px;color:var(--text);font-size:13px;line-height:1.15}
.acct small{display:block;font:500 9.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.acct small i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.navpill .runbtn{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal)}
.navpill .runbtn:hover{background:#133634;color:var(--teal)}
.menubtn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(24,17,14,.85);border:1px solid var(--line);font:600 10.5px var(--mono);letter-spacing:.14em;cursor:pointer;color:var(--text)}
.menubtn .dots{display:flex;gap:3px} .menubtn .dots i{width:4px;height:4px;border-radius:50%;background:var(--text)}
.menu{position:fixed;right:40px;top:70px;width:300px;background:var(--panel-solid);border:1px solid var(--line2);border-radius:12px;padding:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:40;animation:pop .15s}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;background:none;border:0;cursor:pointer;text-align:left}
.menu button:hover{background:var(--raise)}
.menu .t{font-size:14px} .menu .s{font:10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.mnav{display:none}
@media (max-width:1180px){.navpill .lbl-hide{display:none}}
@media (max-width:860px){.top{padding:12px 16px}.navpill{display:none}.mnav{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;position:sticky;top:64px;z-index:29}
 .mnav a{flex:none;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(24,17,14,.9);font-size:13px;color:var(--muted)} .mnav a.on{color:var(--navy-text);background:var(--navy);border-color:var(--navy-line)} .menu{right:16px;left:16px;width:auto;top:64px}}

/* ---------- layout ---------- */
.page{max-width:1320px;margin:0 auto;padding:28px 40px 64px}
@media (max-width:860px){.page{padding:16px 16px 48px}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:48px;align-items:start;padding-top:20px}
@media (max-width:1100px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}}
.kicker{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.kicker .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--copper)}
.kicker .ring.live{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(143,220,159,.12)}
.kicker .ring.paused{background:var(--amber);border-color:var(--amber)}
.kicker::after{content:"";width:56px;height:1px;background:var(--line2)}
h1.display{font:600 clamp(44px,5.6vw,88px)/.95 var(--display);letter-spacing:-.055em;margin:0}
.acc{display:inline-block;position:relative;z-index:0;background:linear-gradient(180deg,#f3b89f,#d98466);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
h1.display .acc::before{content:"";position:absolute;left:-.18em;top:.08em;bottom:.02em;width:calc(100% + .3em);z-index:-1;background:linear-gradient(90deg,rgba(201,119,90,.26),rgba(201,119,90,0) 75%);border-left:2px solid rgba(233,161,132,.55)}
h1.page-h{font:600 clamp(36px,4.4vw,64px)/.98 var(--display);letter-spacing:-.05em;margin:0}
.lede{font-size:17px;line-height:1.6;color:#d8cbc2;max-width:560px;margin:26px 0 30px}
.lede b{color:var(--text);font-weight:600}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta{display:flex;align-items:center;gap:18px;min-width:260px;padding:16px 16px 16px 20px;border-radius:4px;cursor:pointer;text-align:left;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-1px)}
.cta small{display:block;font:600 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.cta b{font:600 16px var(--sans)}
.cta .arr{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;opacity:.75}
.cta.primary{background:linear-gradient(180deg,#6fdcd0,#4fc4b8);color:var(--teal-ink);box-shadow:0 0 0 1px rgba(98,214,202,.4),0 10px 50px -12px rgba(98,214,202,.55)}
.cta.secondary{background:var(--navy);border-color:var(--navy-line);color:var(--navy-text)}
@media (max-width:640px){.cta{min-width:0;width:100%}}
.textlink{display:inline-flex;gap:6px;align-items:center;margin-top:26px;font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7cc8e8;border:0;border-bottom:1px solid rgba(124,200,232,.35);padding:0 0 4px;cursor:pointer;background:none}
.textlink:hover{color:#a9dcf2}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(6px);position:relative;min-width:0}
.panel.pad{padding:24px}
@media (max-width:640px){.panel.pad{padding:18px}}
.panel h2{font:600 26px/1.15 var(--display);letter-spacing:-.035em;margin:2px 0 18px}
.panel.accent-top::before{content:"";position:absolute;left:24px;top:-1px;width:44px;height:2px;background:var(--copper)}
.inner{background:linear-gradient(180deg,rgba(255,224,204,.025),rgba(255,224,204,.01));border:1px solid var(--line);border-radius:8px}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid rgba(233,161,132,.45);pointer-events:none}
.frame{position:relative}
.frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0} .frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;margin-top:40px}
@media (max-width:960px){.grid2,.split{grid-template-columns:minmax(0,1fr)}}

/* ---------- live build diagram ---------- */
.diagram{position:relative;height:300px;margin-top:6px}
.diagram svg.wires{position:absolute;inset:0;width:100%;height:100%}
.wire{fill:none;stroke:rgba(233,161,132,.28);stroke-width:1.2}
.wire.flow{stroke:rgba(233,161,132,.8);stroke-dasharray:3 14;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.nodes{position:absolute;left:8px;top:6px;display:flex;flex-direction:column;gap:18px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px}
.node .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--raise2);border:1px solid var(--line2);color:#e7d6cb}
.node .c svg{width:20px;height:20px}
.node.hot .c{background:radial-gradient(circle,#4a2a1e,#2b1a14);border-color:rgba(233,161,132,.5);color:var(--copper);box-shadow:0 0 30px -4px rgba(233,161,132,.4)}
.node span{font:500 10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.entry{position:absolute;right:0;top:40px;width:62%;padding:20px 22px;background:linear-gradient(160deg,rgba(54,39,33,.94),rgba(36,26,22,.94));border:1px solid var(--line2);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.entry .big{font:500 38px/1.1 var(--mono);color:var(--green);letter-spacing:-.02em;margin:10px 0 4px}
.entry .okc{position:absolute;right:20px;top:46px;width:50px;height:50px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);background:var(--green-soft)}
.entry .okc.p{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.entry .okc svg{width:24px;height:24px;stroke-width:2.4}
.checks{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ck{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);color:#2a140c;background:linear-gradient(180deg,#f0ae90,#d88565);box-shadow:0 0 14px -3px rgba(233,161,132,.6)}
.quote{font-size:16px;margin:10px 4px 0}
@media (max-width:640px){.diagram{height:auto}.diagram svg.wires{display:none}.nodes{position:static;flex-direction:row;justify-content:space-around;margin-bottom:16px}.node{width:auto}.entry{position:static;width:auto}.entry .big{font-size:30px}}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:flex-start;margin:22px 4px 4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:13px;color:var(--muted);text-align:center}
.step::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:1.5px;background:var(--line2);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:linear-gradient(90deg,var(--green-line),#4f9b62)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-deep);border:1.5px solid var(--line2);z-index:1;font:500 10.5px var(--mono);color:var(--muted)}
.step.done .dot{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.step.cur .dot{border-color:var(--copper);color:var(--copper);box-shadow:0 0 0 4px var(--copper-glow)}
.step.cur,.step.done{color:var(--text)}
.step .dot svg{width:13px;height:13px;stroke-width:2.6}
@media (max-width:480px){.step{font-size:11px}}

/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);margin-top:48px;padding-top:22px}
@media (max-width:960px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .eyebrow{font-size:10.5px}
.stat .n{font:600 30px var(--display);letter-spacing:-.03em;margin-top:6px}
.stat .n small{font:400 11px var(--mono);color:var(--muted);letter-spacing:.02em;margin-left:5px}
.stat .d{font-size:12px;color:var(--dim);margin-top:2px}

/* ---------- tiles, lists ---------- */
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.015);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--line2);background:rgba(255,224,204,.035)}
.ti{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--raise2);border:1px solid var(--line);color:var(--copper);flex:none}
.tile .tt{font-size:16px;font-weight:500}
.tile .ts{font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.tile .go{margin-left:auto;color:var(--dim)}
.list .item{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.list .item:first-child{border-top:0}
.list button.item:hover .it{color:var(--copper)}
.list div.item{cursor:default}
.list .it{font-weight:500;transition:color .15s}
.list .is{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.vbig{font:500 22px var(--mono);color:var(--text);width:52px;flex:none}
@media (max-width:640px){.hide-sm{display:none!important}}

/* ---------- chips & buttons ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.live{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.chip.paused{color:var(--amber);border-color:rgba(235,189,106,.35);background:var(--amber-soft)}
.chip.revoked{color:var(--red);border-color:rgba(242,131,111,.35);background:var(--red-soft)}
.chip.deprecated{color:var(--amber)}
.chip.notyet{border-style:dashed}
.ver{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;font:500 11px var(--mono);white-space:nowrap;vertical-align:middle}
.ver b{font-weight:500;padding:1px 7px;background:var(--raise);color:var(--muted)} .ver span{padding:1px 7px;color:var(--text)}
.fp{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--mono);color:var(--green);cursor:pointer;border:0;border-bottom:1px dashed rgba(143,220,159,.35);background:none;padding:0}
.fp svg{width:11px;height:11px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raise2)}
.btn.solid{background:linear-gradient(180deg,#6fdcd0,#4fc4b8);border-color:transparent;color:var(--teal-ink)}
.btn.danger{color:var(--red);border-color:rgba(242,131,111,.35);background:var(--red-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--raise)}
.btn.sm{padding:5px 11px;font-size:13px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.2)}
.seg button{background:none;border:0;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--raise2);color:var(--text)}
.input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;line-height:1.4}
.input:focus{outline:none;border-color:var(--teal-line);box-shadow:0 0 0 3px rgba(98,214,202,.12)}
select.input option{background:var(--panel-solid)}
label.f{display:block;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px;display:flex;gap:6px;align-items:center}

/* ---------- refusal (archive frame) ---------- */
.refusal{position:relative;margin:16px 0;border:1px solid rgba(242,131,111,.3);background:linear-gradient(180deg,rgba(242,131,111,.07),rgba(242,131,111,.02));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.refusal.warn{border-color:rgba(235,189,106,.3);background:linear-gradient(180deg,rgba(235,189,106,.07),rgba(235,189,106,.02))}
.refusal .rh{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red);padding:10px 16px;border-bottom:1px solid rgba(242,131,111,.18);background:rgba(242,131,111,.06)}
.refusal.warn .rh{color:var(--amber);border-color:rgba(235,189,106,.18);background:rgba(235,189,106,.06)}
.refusal dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 16px;margin:0;padding:14px 16px}
.refusal dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.refusal dd{margin:0;font-size:14px}
.refusal .code{font:10.5px var(--mono);color:var(--dim);padding:0 16px 12px;letter-spacing:.06em}
@media (max-width:640px){.refusal dl{grid-template-columns:minmax(0,1fr);gap:2px}.refusal dd{margin-bottom:8px}}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .ev{position:relative;padding:8px 0}
.tl .ev::before{content:"";position:absolute;left:-24px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--bg-deep);border:1.5px solid var(--muted)}
.tl .ev.g::before{border-color:var(--green);background:var(--green-soft)} .tl .ev.a::before{border-color:var(--amber)} .tl .ev.r::before{border-color:var(--red);background:var(--red-soft)}
.tl .when{font:10.5px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* ---------- drawer, modal, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,3,2,.6);backdrop-filter:blur(3px);z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--panel-solid);border-left:1px solid var(--line2);z-index:51;display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px rgba(0,0,0,.5)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}

.modal .mh{padding:20px 24px 0} .modal .mb{padding:8px 24px 20px} .modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;padding:11px 16px;border-radius:10px;background:rgba(36,26,22,.97);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:14px;animation:pop .18s}
.toast svg{color:var(--green)}

.card{border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.02);margin-bottom:12px}
.card .ch{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}

.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 10px var(--sans);color:#1a0d08;flex:none;vertical-align:middle}

/* ---------- tester run ---------- */
.stage{border:1px solid var(--line2);border-radius:10px;background:#080504}
.stage .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(36,26,22,.8);border-radius:10px 10px 0 0}
.stage canvas{display:block;width:100%;height:440px;border-radius:0 0 10px 10px}
@media (max-width:640px){.stage canvas{height:300px}}

.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.law{padding:20px;border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.015)}
.law .num{font:500 11px var(--mono);color:var(--copper);letter-spacing:.12em}
.law h4{font:600 19px/1.2 var(--display);letter-spacing:-.025em;margin:10px 0 6px}
.law p{margin:0;color:var(--muted);font-size:14px}
.sw{height:56px;border-radius:8px;border:1px solid var(--line2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}

.tbl{overflow-x:auto}

.foot a:hover{color:var(--text)}

.sect a,.sect button.textlink{margin:0 0 0 auto}
.envrow{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}

.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;cursor:pointer;text-align:left;background:none;width:100%}

.opt.on .radio{border-color:var(--teal)} .opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal)}

.pmenu button{display:flex;gap:12px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;background:none;border:0;cursor:pointer;text-align:left}
.pmenu button:hover,.pmenu button.cur{background:var(--raise)}

.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--display);color:#1a0d08;flex:none}

  const o=openFb(p).length; if(o) a.push({t:`Review ${plural(o,'report')}`,go:`location.hash='#/p/${p.id}/feedback'`});

function exploreOpen(pid,id){
  const p=P(pid), e=p.envs[id];
  if(isDev(p)){ location.hash=`#/p/${pid}/overview`; return; }
  if(e.access==='request'&&e.my!=='approved'){
    if(e.my==='requested'){ toast(`Still waiting on ${p.owner}`); return; }
    modal('Ask to join',`${p.owner}/${p.name}`,`<p class="muted" style="margin-top:0">${esc(p.owner)} approves each tester. You'll get a notification when you're in.</p><label class="f" for="rq">Say hello <span class="dim">· optional</span></label><textarea class="input" id="rq" rows="2" placeholder="What you'd like to test"></textarea>`,
      `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="P('${pid}').envs['${id}'].my='requested';closeLayer();toast('Request sent to ${p.owner}');render()">Send request</button>`);
    return;
  }
  unlock(pid,id);
}

function testingCard(p,id,e){

  const label={active:'Ready',paused:'Paused',closed:'Closed',revoked:'Access removed',requested:'Requested'}[st];
  const act = st==='active'&&canOpen(e) ? `<span class="btn solid sm">${ic('play')}Open</span>` : chip(st==='active'?'':st==='revoked'?'revoked':st==='paused'?'paused':'',label);
  return `<button class="pcard" onclick="testingOpen('${p.id}','${id}')">
    <div class="row" style="gap:12px">${sq(p)}<span><div class="eyebrow" style="font-size:10px">${esc(p.owner)} · ${esc(id)}</div><div class="pt">${esc(p.name)}</div></span></div>

    <div class="pf"><span class="envrow">${e.from?`${av(e.from)}from ${esc(e.from)}`:e.my==='requested'?ic('hand')+'Waiting on '+esc(p.owner):ic('globe')+'Public'}</span><span class="spacer"></span>${act}</div></button>`;
}
function testingOpen(pid,id){
  const p=P(pid), e=p.envs[id];
  if(e.my==='revoked') return modal('Access',`Can't open ${p.name}`,refusal('Access removed',{what:`${esc(e.from||p.owner)} removed your access to ${esc(p.name)}.`,need:'A new invite.',fix:`Ask ${esc(e.from||p.owner)} if this is a mistake. Copies you already opened stay on your device.`,code:'access.revoked'}),`<button class="btn" onclick="closeLayer()">OK</button>`);
  if(e.my==='requested') return toast(`Waiting on ${p.owner} to approve you`);
  if(e.rollout.state!=='active') return modal('Not available',`${p.name} is ${e.rollout.state}`,refusal('Not available right now',{what:`${esc(p.owner)} ${e.rollout.state} this build.`,need:'The developer to turn it back on.',fix:"You'll get a notification when it's back.",code:'rollout.'+e.rollout.state},true),`<button class="btn" onclick="closeLayer()">OK</button>`);
  unlock(pid,id);
}
function vTesting(){
