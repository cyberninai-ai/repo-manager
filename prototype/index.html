<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Env Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --panel:#0d1117; --panel2:#111823; --line:#1c2430; --text:#d7e1ea; --muted:#6b7a8c;
  --cyan:#00e5ff; --green:#39ff88; --amber:#ffb020; --magenta:#ff2bd6; --red:#ff3b5c;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Space Grotesk',var(--mono);
  --scan:.025; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel2:#f0f3f6; --line:#d9dee5; --text:#0e141b; --muted:#5b6775;
  --cyan:#007c8c; --green:#0a8a45; --amber:#9a6200; --magenta:#b00f95; --red:#c4183a; --scan:0; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.55 var(--mono);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-attachment:fixed}
body::after{content:"";pointer-events:none;position:fixed;inset:0;z-index:100;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,var(--scan)) 0 1px,transparent 1px 3px)}
@media (prefers-reduced-motion: reduce){ body::after{display:none} *{animation:none!important;transition:none!important} }
a{color:var(--cyan);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
code{color:var(--cyan)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:52px auto 1fr 30px;height:100vh}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font:700 15px var(--display);letter-spacing:.2em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo b{color:var(--cyan)}
.crumb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb strong{color:var(--text)}
.spacer{flex:1}
.banner{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:6px 16px;font-size:12px;border-bottom:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));background:color-mix(in srgb,var(--amber) 7%,var(--panel));color:var(--amber)}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding:8px 0;overflow:auto}
nav.side h6{font:600 10px var(--display);letter-spacing:.18em;color:var(--muted);margin:16px 16px 6px;text-transform:uppercase}
nav.side a{display:flex;align-items:center;gap:10px;padding:7px 16px;color:var(--text);border-left:2px solid transparent}
nav.side a:hover{background:var(--panel2)}
nav.side a.on{border-left-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 8%,transparent);color:var(--cyan)}
nav.side .count{margin-left:auto;font-size:11px;color:var(--muted)}
main{overflow:auto;padding:20px 24px 40px;min-width:0}
footer.status{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap}
h1{font:600 20px var(--display);letter-spacing:.06em;margin:0 0 4px;text-transform:uppercase}
h2{font:600 12px var(--display);letter-spacing:.14em;margin:0 0 10px;text-transform:uppercase;color:var(--muted)}
h3{font:600 14px var(--display);margin:0 0 6px}
.sub{color:var(--muted);margin-bottom:18px;max-width:900px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px;min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}nav.side{display:none}.g2,.g4{grid-template-columns:minmax(0,1fr)}main{padding:16px}.crumb,.hide-sm{display:none}header.top{padding:0 12px}}
.show-sm{display:none}
@media (max-width:760px){.show-sm{display:inline}}
.mnav{display:none;gap:6px;overflow-x:auto;margin:-4px 0 14px;padding-bottom:4px}
@media (max-width:760px){.mnav{display:flex}}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px -8px var(--cyan)}
.btn.danger{border-color:color-mix(in srgb,var(--red) 60%,var(--line));color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--muted);box-shadow:none}
input.f,select.f,textarea.f{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 9px;width:100%;min-width:0}
input.f:focus,select.f:focus,textarea.f:focus,.btn:focus-visible{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 40%,transparent),0 0 18px -6px var(--cyan)}
label.l{display:block;color:var(--muted);font-size:11px;margin:8px 0 3px;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:3px;padding:0 7px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
.s-complete{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.s-notBuilt{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.s-sim{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}
.muted{color:var(--muted)} .green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)} .mag{color:var(--magenta)} .cyan{color:var(--cyan)}
.oid{color:var(--cyan);font-size:12px;word-break:break-all}
table{width:100%;border-collapse:collapse}
th{font:600 10px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
ul.l{margin:0;padding-left:18px} ul.l li{margin:3px 0}
.term{background:#030507;border:1px solid var(--line);border-radius:6px;padding:14px 16px;font-size:12.5px;overflow-x:auto;white-space:pre;color:#c9d6e2}
:root[data-theme="light"] .term{background:#0b1016}
.term .g{color:#39ff88} .term .a{color:#ffb020} .term .c{color:#00e5ff} .term .m{color:#6b7a8c}
.refusal{border:1px solid color-mix(in srgb,var(--red) 50%,var(--line));border-left:3px solid var(--red);border-radius:4px;padding:10px 12px;margin-bottom:10px;background:color-mix(in srgb,var(--red) 5%,var(--panel))}
.refusal.nb{border-color:color-mix(in srgb,var(--amber) 50%,var(--line));border-left-color:var(--amber);background:color-mix(in srgb,var(--amber) 5%,var(--panel))}
.refusal.ok{border-color:color-mix(in srgb,var(--green) 45%,var(--line));border-left-color:var(--green);background:color-mix(in srgb,var(--green) 5%,var(--panel))}
.refusal dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:3px 10px;margin:6px 0 0}
.refusal dt{color:var(--muted)} .refusal dd{margin:0}
@media (max-width:760px){.refusal dl{grid-template-columns:minmax(0,1fr)} .refusal dd{margin-bottom:4px}}
.step{border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;background:var(--panel)}
.step .num{font:700 11px var(--display);color:var(--muted);letter-spacing:.14em}
.jrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.jrow:hover{background:var(--panel2)}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:12px;overflow:auto;max-height:340px;margin:8px 0 0;white-space:pre-wrap;word-break:break-all}
.ttable td,.ttable th{text-align:center} .ttable td:first-child,.ttable th:first-child{text-align:left}
.cell{display:inline-block;padding:2px 8px;border-radius:3px;border:1px solid var(--line);font-size:11.5px;white-space:nowrap}
.cell.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.cell.no{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.cell.na{color:var(--muted)}
.cell.nb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
tr.hl td{background:color-mix(in srgb,var(--cyan) 7%,transparent)}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--panel)}
.tile .v{font:600 20px var(--display)} .tile .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pipe{display:flex;align-items:stretch;overflow-x:auto;padding-bottom:6px}
.pipe .st{flex:1 0 160px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel)}
.pipe .ar{flex:0 0 22px;display:grid;place-items:center;color:var(--muted)}
svg text{font-family:var(--mono)}
.node{cursor:pointer}
.node:hover rect:first-child,.node:focus rect:first-child{stroke-width:2;stroke:var(--cyan)}
.node:focus{outline:none}
.toasts{position:fixed;right:16px;bottom:42px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 32px)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--cyan);padding:9px 13px;border-radius:4px;max-width:380px;animation:slide .2s ease-out}
.toast.g{border-left-color:var(--green)} .toast.r{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(20px);opacity:0}}
.law{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.law .i{color:var(--cyan);font:700 12px var(--display)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="cyan">⬢</span>REMOTE<b>/</b>ENV</div>
    <div class="crumb">flux/remote-env · <strong>remote.defxn.com</strong> <span class="chip s-notBuilt">planned · not deployed</span></div>
    <div class="spacer"></div>
    <button class="btn sm" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </header>
  <div class="banner"><b>◇ DESIGN PROTOTYPE</b><span class="show-sm">ledger snapshot · simulated sandbox</span><span class="hide-sm">Batch status is a snapshot of the implementation batch ledger (2026-10-08). The protocol sandbox runs in this page only: no engine, no signing, no resolver, no network.</span></div>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
  <footer class="status" id="status"></footer>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   LEDGER SNAPSHOT
   Source of truth: the Remote Env implementation batch ledger. This page
   renders a dated snapshot and never upgrades a status on its own.
   ===================================================================== */
const SNAPSHOT_DATE = '2026-10-08';
const B = [
 {n:0,name:'Product boundary and repo routing',status:'complete',deps:[],
  note:'flux/remote-env is the sole product root. The signed workspace registry routes product terms there with no declared runtime dependencies; nine tests prove the read-only status/CLI/import contract. Remaining workspace:doctor errors are pre-existing stale paths that do not name remote-env. No gateway, resolver, preview host, UI, Caddy route, DNS record or deployment was added.',
  deliver:['Create flux/remote-env as the single product implementation root','Register in .workspace/workspace-manifest.json with only its real dependency closure; regenerate routing; run workspace:doctor','Package metadata, test command, CLI entrypoint, explicit notBuilt status surface','Record ownership boundaries with Bundle, Registry, Repo, Domains, Flux Access Resolver and node-power resolver','Reserve remote.defxn.com only as a planned control-plane product (no Caddy, DNS or deployment claims)'],
  tests:['Workspace routing selects remote-env for its product and protocol terms','Importing library modules performs no filesystem, network or process work','Status reports each unavailable capability as notBuilt'],

 {n:1,name:'Schemas, registries and hostile vectors',status:'complete',deps:[0],
  note:'Six record schemas and three manifest/descriptor schemas frozen under flux/remote-env/schemas, registered in the canonical flx/flux-spec record and access catalogs, covered by generated signing-byte/CID vectors and the hostile corpus. The JavaScript reference consumer reproduces every object, byte sequence, CID and reason code.',
  caveat:'No Rust or Dense Remote Env consumer exists yet. No second runtime is reported as passing and no Dense role letter was allocated.',
  deliver:['Freeze canonical JSON schemas: flux.remote-project.v1, flux.remote-module.v1, flux.remote-environment.v1, flux.remote-cohort.v1, flux.remote-rollout.v1, flux.remote-feedback.v1','Stable action/resource mappings in the canonical access permission catalog','Register record and manifest types through existing Flux registries (no role letter, no product-local registry)','Freeze canonical signing bytes, CID vectors, reason codes and interface version rules','Capability-manifest, encryption-descriptor and artifact-descriptor schemas without mutable URLs or latest tags'],
  tests:['Duplicate fields, forbidden unknown fields, conflicting singular roles','Malformed IDs, CIDs, signatures, MIME types, byte lengths, timestamps','Mutable version selectors, unverified network URLs, unresolved module dependencies','Environment heads with duplicate mount points or module IDs','Cross-project references, predecessor gaps, sequence reuse, cycles','Rollout events targeting a head from another project/environment','Plaintext secret/key/session fields in any public record'],
  gate:'JavaScript and any Rust/dense consumers produce identical canonical objects, signing bytes, CIDs and refusal codes for every positive and hostile vector.'},
 {n:2,name:'Canonical integrity, blob and mutation primitives',status:'notBuilt',deps:[1],
  deliver:['Consume existing canonical signing/addressing and blob behavior; extract a neutral package from @deadark/pva-core with compatibility exports if needed; never copy','Reuse SQLite WAL + exact-head transaction behavior from flux/name-integrity; extract a shared primitive only if it serves both without changing historical behavior','One artifact-descriptor verifier for CID, MIME and byte length','One mutation boundary for validation, append, derived index and receipt persistence','Read-only open mode and exact row/record diagnostics'],
  tests:['Signing and CID conformance against frozen Batch 1 vectors','Streamed blob ingest/retrieval without buffering the full artifact','Missing blob, wrong MIME, wrong length, changed bytes fail before append','Crash injection around each transaction boundary leaves all-or-none state','Two independent processes cannot commit the same sequence, predecessor or nonce'],
  gate:'Remote Env has no local signature, CID, blob-store or ordered-journal fork, and the transaction primitive passes independent-process collision and crash tests.'},
 {n:3,name:'Durable journal, indexes and replay verifier',status:'notBuilt',deps:[2],
  deliver:['SQLite WAL event, head, nonce, decision-reference and derived-index tables','Append/read projections for projects, modules, environment heads, cohorts, rollouts, feedback metadata','Serialized compare-and-append transitions with exact predecessor checks','Read-only remote-env verify that reconstructs every index from verified events','Truncation/corruption reporting with exact table, row, CID and reason','Backup, restore and versioned migrations that never rewrite signed payloads'],
  tests:['Concurrent competing head, cohort and rollout writes produce one winner','Restart reconstructs the same heads and projections','Tampered signature, CID, predecessor, policy binding, index row, receipt reference fail at the exact record','Truncated/corrupt DB and interrupted migration identify the recovery action','Read-only verification performs no writes, timestamp changes or migrations'],
  gate:'A fresh derived store rebuilt from the journal is byte-equivalent at the canonical projection boundary, and every corruption fixture is rejected with an exact diagnostic.'},
 {n:4,name:'Local engine, CLI and read API',status:'notBuilt',deps:[3],
  deliver:['Local protocol engine over the Batch 3 store','CLI: status, verify, project create|show, module publish|show, environment publish|show|history, cohort create|show, rollout activate|pause|resume|rollback|close, feedback submit|show|history','Read-only HTTP routes for exact objects and histories','Mutating HTTP routes may prepare unsigned records; signing stays in the client; append refuses unsigned/invalid records','Stable pagination cursors tied to an observed head'],
  tests:['End-to-end local project → module → environment → cohort → rollout → feedback','Forged signatures, stale heads, unknown references fail before mutation','Pagination stable while newer events append','CLI and HTTP prepare identical signing bytes','Private keys never cross HTTP or appear in process arguments'],
  gate:'All local product history can be created, verified, queried and replayed without network access, while access-controlled operations remain explicitly notBuilt.'},
 {n:5,name:'Immutable adapters: Repo, Registry, Bundle, Domains',status:'notBuilt',deps:[4],
  deliver:['Read/verify adapters for exact Bundle release and Registry package-version CIDs','Repo snapshot adapter only once repo.defxn.com has a stable snapshot contract; until then source provenance is optional and notBuilt','Domains adapter only for optional authorized preview-domain binding; Remote Env never claims a name','Validate availability, publisher proof, provenance and interface compatibility before a module enters a head','Cache only verified immutable objects by CID'],
  tests:['Cross-product CID/signature vectors and tampered-object refusals','Missing, deprecated, incompatible releases are distinguished','Mutable tags and domain targets cannot enter an environment head','Domain delegation authorizes binding only, not project/module/tester access','Adapter outages report unavailable evidence; no stale mutable lookups reused'],
  gate:'An environment head can be reproduced using only exact, independently verified immutable product objects, with optional unavailable products honestly marked.'},
 {n:6,name:'Composition, cohorts, views and rollout history',status:'notBuilt',deps:[5],
  deliver:['Deterministic composition of a complete head from exact module records','Interface/dependency graph validation with cycle detection','Cohorts backed by verified membership evidence or a deterministic policy selector','Deterministic identity bucketing where policy permits staged percentages','One environment-view CID per exact head + actor/cohort projection + capability surface','Append-only activate, pause, resume, close, deprecate and rollback events','Session-transition policy for viewers of a superseded head'],
  tests:['Updating one module preserves all unchanged module CIDs','Ordering differences cannot change the composition CID','Dependency/interface conflicts and cycles fail before append','Two rollout writers cannot activate competing heads at one sequence','Rollback points to an earlier head while preserving intervening events','Cohort bucketing deterministic across processes and languages'],
  gate:'Every tester projection is reproducible from one environment-view CID, and no runtime can assemble an unrecorded mix of modules.'},
 {n:7,name:'Artifact encryption, identity keys and key epochs',status:'notBuilt',deps:[2],
  deliver:['Reviewed standard AEAD and sealed-key primitives via a recorded cryptographic decision','Dedicated identity encryption subkey with a signed binding to the signing identity (never reuse Ed25519 signing keys)','Encrypt artifact bytes before public storage; address the ciphertext','Bind algorithm, nonce, lengths, ciphertext CID and key epoch into the signed module record','Wrap content keys through project/group epochs and identity-bound sealed grants','Rotate epochs for future artifacts after revocation','Streamed encrypt/decrypt with range-compatible chunk framing'],

  gate:'No private artifact plaintext or usable content key reaches public storage, history or logs, and independent clients decrypt the frozen vectors exactly.'},
 {n:8,name:'Global Flux Access Resolver integration',status:'notBuilt',deps:[6,7,'FAR'],
  deliver:['Map every protected operation to the frozen Batch 1 action/resource catalog','Exact AccessQuery: identity, policy, evidence head, proof of possession, nonce','Verify independent checker receipts over the same query, resolver code, evidence head and result','Persist decisions for mutations and key release; hash-chained receipts for read-heavy operations','Fail closed on deny, incomplete revocation evidence, checker disagreement, stale policy, changed head, replayed nonce'],
  tests:['Allow, deny, indeterminate vectors match the canonical resolver','Forged grant/deny, wrong audience/network, expired delegation, incomplete evidence, widened scope fail with stable reasons','A receipt for one head/action cannot authorize another','Checker disagreement blocks execution and becomes durable conflict evidence','No product-local ACL fallback when the resolver is unavailable'],
  gate:'Every protected Remote Env operation is authorized by a reproducible global decision bound to its exact policy, evidence head, action and resource.'},
 {n:9,name:'Node-power resolver integration',status:'notBuilt',deps:[8],
  deliver:['Construct NodePowerQuery only after a verified global allow','Bind node role, capabilities, budget, custody, availability, local policy to the global decision CID','Return only capable, refuse or unavailable','Persist node-power receipts separately from global access history','Required capabilities for metadata, ciphertext storage, key release, preview execution, feedback storage'],
  tests:['Missing, stale or mismatched global decisions block node-power evaluation','Global deny/indeterminate cannot become execution under any node state','Global allow + local refuse/unavailable returns a local refusal without changing the global result','Capability, budget, custody evidence cannot be substituted across nodes'],
  gate:'Exhaustive authority-order tests prove that node power only narrows a verified global allow.'},
 {n:10,name:'Identity sessions and unlock gateway',status:'notBuilt',deps:[6,7,8,9],
  deliver:['Signed challenge / proof-of-possession login with one-use nonce and short expiry','Short-lived session capability bound to actor, audience, environment-view CID, module CIDs, access-decision CID, expiry, nonce','HttpOnly, Secure, restrictive SameSite cookies where cookies are used','Ciphertext and sealed-key delivery only after global and node-power receipts pass','Durable key-release receipts that never record the released secret','Invalidation on expiry, revocation, paused rollout or head mismatch','Rate limits and abuse evidence that are not an alternate authorization system'],
  tests:['Challenge replay, session fixation, audience confusion, CSRF, stolen bearer reuse, concurrent nonce use fail closed','Sessions cannot widen module lists or survive forbidden head/policy changes','Key-release receipts bind exact identity, ciphertext, epoch and decision','Gateway logs contain no private key, content key, plaintext or reusable proof'],
  gate:'An authorized identity can unlock only the exact modules in one environment view, while every unauthorized, stale or replayed path is refused and audited.'},
 {n:11,name:'Isolated modular web runtime',status:'notBuilt',deps:[10],
  deliver:['Signed shell manifest loading only exact verified module CIDs','Separate origins or equally strong sandboxes for mutually untrusted modules','Strict CSP, iframe sandboxing; explicit controls for navigation, popups, downloads, media, clipboard, storage, network','Versioned, allowlisted inter-module message channels','Narrow identity capability messages; no private key or reusable gateway credential injection','Storage partitioned by project, head, identity and module','Exact-version and environment-view metadata for diagnostics and feedback'],
  tests:['Cross-module DOM, cookie, storage, identity access blocked','Undeclared network, worker, popup, navigation attempts fail','MIME/runtime disagreement and changed bytes do not execute','Message interfaces work only at compatible versions','Image, SVG, video, WASM/worker, generative fixtures follow declared policy'],
  gate:'The hostile browser suite shows one compromised test module cannot escape its declared capability boundary or impersonate another module.'},
 {n:12,name:'Feedback, audit history and operational evidence',status:'notBuilt',deps:[6,10],
  deliver:['Signed, version-bound feedback with correction-by-supersession','Public, project-private and author-private visibility on the same encrypted blob contract','Reproduction metadata bound to environment-view and module CIDs','Append-only triage/status events; original tester statements never edited','Feedback reads authorized by global resolver then node power','Metrics that distinguish notBuilt, unavailable, refused and measured zero'],
  tests:['Feedback cannot target an unknown head/module or a version outside the tester session','Corrections preserve originals and exact supersession lineage','Private feedback is ciphertext to unauthorized storage readers','Metrics never average missing capabilities into a score','Every submitted field survives into the exact rendered/read representation'],
  gate:'A developer can prove which identity or approved pseudonym tested which exact view and read its authorized feedback without leaking private content.'},

function canon(v){

let selG='allow', selN='capable';
function decide(g,n){
  if(g==='notBuilt') return {out:'refused · notBuilt',cls:'nb',why:'No global decision can be produced. There is no product-local ACL fallback.'};
  if(g==='deny') return {out:'refused · global deny',cls:'no',why:'NodePowerQuery is only constructed after a verified global allow, so node power is never evaluated.'};
  if(g==='indeterminate') return {out:'refused · fail closed',cls:'no',why:'Incomplete evidence, checker disagreement, stale policy, changed head or replayed nonce fails closed and is recorded as conflict evidence.'};
  if(n==='capable') return {out:'execute',cls:'ok',why:'Verified global allow, narrowed by node power to capable. Both receipts persist separately.'};
  if(n==='refuse') return {out:'refused · local',cls:'no',why:'Local refusal. The global result stays allow and is not rewritten.'};
  return {out:'unavailable',cls:'na',why:'The node cannot evaluate (capability, budget, custody or availability evidence missing). Reported as unavailable, never as success.'};
}

/* =====================================================================
   PROTOCOL SANDBOX
   In-page model of the record flow that B4/B6 will own. Field shapes are
   illustrative; the frozen schemas live in flux/remote-env/schemas.
   Digests are SHA-256 over sorted-key JSON, not Flux CIDs. Reason codes
   are illustrative; the frozen codes are the Batch 1 vectors.
   ===================================================================== */
const S = { journal:[], refusals:[], refusalCount:0, project:null, modules:[], heads:[], cohort:null, rollouts:[], feedback:[], open:null, envView:null, hostile:null };
const PROJECT_ID = 'prj-demo';
const lastHead = () => S.heads.at(-1);
const lastRollout = () => S.rollouts.at(-1);
const rolloutState = () => { const r=lastRollout(); if(!r) return 'draft'; return {activate:'active',resume:'active',rollback:'active',pause:'paused',close:'closed'}[r.record.action]; };
const activeHeadDigest = () => { for(let i=S.rollouts.length-1;i>=0;i--){ const a=S.rollouts[i].record.action; if(['activate','rollback','resume'].includes(a)) return S.rollouts[i].record.head; } return null; };

function refuse(code, failure, missing, remedy, owner){
  S.refusalCount++;
  S.refusals.unshift({code,failure,missing,remedy,owner}); S.refusals.length=Math.min(S.refusals.length,12);
  toast(`<b class="red">refused</b> ${esc(code)}`,'r'); return null;
}
const SECRET_FIELDS = /^(privateKey|secretKey|secret|password|bearer|sessionToken|contentKey|seed)$/i;
function scanSecrets(o,path=''){ if(o&&typeof o==='object'){ for(const k of Object.keys(o)){ if(SECRET_FIELDS.test(k)) return path+k; const r=scanSecrets(o[k],path+k+'.'); if(r) return r; } } return null; }
async function append(type, record){
  const secret = scanSecrets(record);
  if(secret) return refuse('record.plaintext-secret-field',`Public record field "${secret}" carries a secret-shaped value.`,'An encrypted descriptor or sealed grant in place of plaintext (B7).','Remove the field. Secrets travel only as ciphertext under key epochs (B7) and never enter public history.','L10 · B1 hostile vector');
  const h = await digest(record);
  const ev = {seq:S.journal.length+1,type,record,digest:sim(h)};
  S.journal.push(ev); S.open=ev.seq; return ev;
}
const EXACT_VERSION = /^\d+\.\d+\.\d+$/;

async function createProject(name){
  if(S.project) return refuse('project.exists','Project already has a genesis record.','None.','Projects are created once; later changes append new events.','L01');
  const ev = await append('flux.remote-project.v1',{type:'flux.remote-project.v1',projectId:PROJECT_ID,name,owner:'id:dev-demo',signature:'notBuilt'});
  if(ev){ S.project=ev; toast('project record appended (simulated)','g'); }
}
async function publishModule(moduleId, version, mime, bytes, extra={}){
  if(!S.project) return refuse('reference.unknown-project','Module references a project that has no record.','A flux.remote-project.v1 genesis record.','Create the project first.','B1 hostile vector');
  if(!moduleId) return refuse('module.invalid-id','Module ID is empty.','A module ID.','Name the module.','B1 hostile vector');
  if(!EXACT_VERSION.test(version)) return refuse('module.mutable-version-selector',`Version "${version}" is not an exact version.`,'An exact version bound to an exact artifact CID.','Publish an exact version such as 1.4.0. Selectors like latest, ^1.2 or ~1 cannot enter a head.','B1 hostile vector · B5');
  if(!/^\d+$/.test(String(bytes))||+bytes<=0) return refuse('artifact.invalid-length','Artifact byte length is missing or not a positive integer.','A verified length in the artifact descriptor.','Supply the exact byte length the blob store measured (B2 verifier).','B1 · B2');
  if((extra.projectId||PROJECT_ID)!==PROJECT_ID) return refuse('reference.cross-project',`Module claims project "${extra.projectId}".`,'A record in this project.','Publish the module inside the project that will use it.','B1 hostile vector');
  if(S.modules.some(m=>m.record.moduleId===moduleId&&m.record.version===version)) return refuse('module.version-reuse',`${moduleId}@${version} already exists.`,'None.','Publish a new exact version. Existing records are never rewritten.','L01');
  const artifactCid = sim(await digest('artifact:'+moduleId+':'+version+':'+bytes));
  const rec = {type:'flux.remote-module.v1',projectId:PROJECT_ID,moduleId,version,
    artifact:{cid:artifactCid,mime,bytes:+bytes},encryption:'notBuilt (B7)',signature:'notBuilt',...(extra.fields||{})};
  const ev = await append('flux.remote-module.v1',rec);
  if(ev){ S.modules.push(ev); toast(`module ${esc(moduleId)}@${esc(version)} appended`,'g'); }
}
async function publishHead(mounts, predecessorOverride){
  if(!S.project) return refuse('reference.unknown-project','No project record.','Project genesis.','Create the project first.','B1');
  if(!mounts.length) return refuse('environment.empty','An environment head must mount at least one module.','Mounted module records.','Select modules and mount points.','B6');
  const seen=new Set(), ids=new Set();
  for(const m of mounts){
    if(seen.has(m.mount)) return refuse('environment.duplicate-mount-point',`Mount point "${m.mount}" is used twice.`,'A unique mount per module.','Give each module its own mount point.','B1 hostile vector');
    if(ids.has(m.moduleId)) return refuse('environment.duplicate-module-id',`Module "${m.moduleId}" is mounted twice.`,'One exact version per module ID in a head.','Pick a single version of each module.','B1 hostile vector');
    seen.add(m.mount); ids.add(m.moduleId);
  }
  const expected = lastHead()?.digest || null;
  const predecessor = predecessorOverride!==undefined ? predecessorOverride : expected;
  if(predecessor!==expected) return refuse('environment.stale-head',`Predecessor ${short(predecessor)} is not the current head ${short(expected)}.`,'An exact-head match at append time.','Re-read the current head, recompose and resubmit. Two writers cannot both win one sequence.','L06 · B3 compare-and-append');
  const rec = {type:'flux.remote-environment.v1',projectId:PROJECT_ID,environmentId:'env-staging',sequence:S.heads.length+1,predecessor,
    modules:mounts.slice().sort((a,b)=>a.mount<b.mount?-1:1).map(m=>({mount:m.mount,moduleId:m.moduleId,record:m.record})),signature:'notBuilt'};
  const ev = await append('flux.remote-environment.v1',rec);
  if(ev){ S.heads.push(ev); toast(`environment head #${rec.sequence} appended`,'g'); }
}
async function createCohort(name, percent){
  if(!S.project) return refuse('reference.unknown-project','No project record.','Project genesis.','Create the project first.','B1');
  const p=+percent; if(!(Number.isInteger(p)&&p>=1&&p<=100)) return refuse('cohort.invalid-selector','Bucket percentage must be a whole number from 1 to 100.','A deterministic policy selector.','Pick a percentage between 1 and 100.','B6');
  const ev = await append('flux.remote-cohort.v1',{type:'flux.remote-cohort.v1',projectId:PROJECT_ID,cohortId:'coh-'+(name.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'cohort'),
    selector:{kind:'identity-bucket',percent:p},membershipEvidence:'notBuilt (B6)',signature:'notBuilt'});
  if(ev){ S.cohort=ev; toast('cohort record appended','g'); }
}
async function bucketOf(identity){ const h=await digest(S.cohort.record.cohortId+'|'+identity); return h?parseInt(h.slice(0,8),16)%100:null; }
const TRANSITIONS = {draft:['activate'],active:['activate','pause','rollback','close'],paused:['resume','rollback','close'],closed:[]};
async function rollout(action, headDigest, extra={}){
  const st = rolloutState();
  if(!S.cohort) return refuse('rollout.no-cohort','Rollout has no cohort.','A flux.remote-cohort.v1 record.','Create a cohort first.','B6');
  if(!TRANSITIONS[st].includes(action)) return refuse('rollout.invalid-transition',`"${action}" is not allowed from state "${st}".`,'None.',`Allowed from ${st}: ${TRANSITIONS[st].join(', ')||'nothing (closed is final)'}.`,'B6');
  if(extra.foreign) return refuse('rollout.foreign-head','Rollout targets a head recorded for project "prj-other".','A head in this project and environment.','Target an environment head recorded for env-staging in prj-demo.','B1 hostile vector');
  const head = ['pause','close','resume'].includes(action) ? activeHeadDigest() : headDigest;
  const target = S.heads.find(h=>h.digest===head);
  if(!target) return refuse('rollout.unknown-head','Target head is not in the journal.','An appended environment head.','Publish an environment head first.','B1');
  const cur = S.heads.findIndex(h=>h.digest===activeHeadDigest()), tgt=S.heads.indexOf(target);
  if(action==='rollback' && tgt>=cur) return refuse('rollout.rollback-not-earlier','Rollback must point to an earlier head than the active one.','An earlier head in this environment.','Pick a lower-sequence head, or use activate to move forward.','B6');
  if(action==='activate' && cur>=0 && tgt<=cur) return refuse('rollout.activate-not-forward','Activate must move to a newer head.','A head with a higher sequence than the active one.','Use rollback to return to an earlier head; it is recorded as a rollback, not a silent re-activation.','B6');
  const prev = lastRollout();
  const rec = {type:'flux.remote-rollout.v1',projectId:PROJECT_ID,environmentId:'env-staging',sequence:S.rollouts.length+1,predecessor:prev?prev.digest:null,
    action,head,cohortId:S.cohort.record.cohortId,signature:'notBuilt'};
  const ev = await append('flux.remote-rollout.v1',rec);
  if(ev){ S.rollouts.push(ev); const a=activeHeadDigest(); S.envView = rolloutState()==='closed'?null:sim(await digest({head:a,cohort:S.cohort.record.cohortId,capabilities:'notBuilt (B11)'})); toast(`rollout ${action} appended`,'g'); }
}
async function submitFeedback(body, moduleDigest, visibility){
  const active = activeHeadDigest();
  if(!active||rolloutState()!=='active') return refuse('feedback.no-active-view','No active environment view to bind feedback to.','An active rollout and its environment-view digest.','Activate or resume a rollout first.','B12');
  if(visibility!=='public') return refuse('feedback.encryption-notBuilt',`${visibility} feedback needs the encrypted blob contract.`,'Artifact encryption and key epochs (B7).','Submit as public in the sandbox, or wait for B7 and B12. Private feedback is never stored as plaintext.','L08 · L10');
  const head = S.heads.find(h=>h.digest===active);
  if(!head.record.modules.some(m=>m.record===moduleDigest)) return refuse('feedback.version-not-in-view','Feedback claims a module version the active view does not include.','A module CID inside the session\'s environment view.','Report against a module in the active head. A tester cannot claim a version their session did not receive.','B12');
  if(!body.trim()) return refuse('feedback.empty','Feedback statement is empty.','None.','Write what you observed.','B12');
  const ev = await append('flux.remote-feedback.v1',{type:'flux.remote-feedback.v1',projectId:PROJECT_ID,environmentView:S.envView,head:active,module:moduleDigest,
    visibility,statement:body,tester:'pseudonym:tester-07 (identity proof notBuilt, B10)',signature:'notBuilt'});
  if(ev){ S.feedback.push(ev); toast('feedback appended','g'); }
}
function unlock(){
  refuse('access.resolver-notBuilt','No global access decision exists for this unlock.','Global AccessQuery decision + checker receipts (B8), node-power receipt (B9), identity session (B10), encrypted artifact + sealed key (B7).','Complete B7–B10. There is no local ACL fallback and no mock in a production profile.','L05 · L08');
}

const viewModules = () => S.heads.find(h=>h.digest===activeHeadDigest())?.record.modules || [];
const HOSTILE = [

 ['H2','duplicate mount point in a head', ()=>{ const m=S.modules.slice(-2); if(m.length<2) return refuse('fixture.needs-modules','This vector needs two module records.','Two published modules.','Seed the happy path first.','sandbox'); return publishHead([{mount:'/app',moduleId:m[0].record.moduleId,record:m[0].digest},{mount:'/app',moduleId:m[1].record.moduleId,record:m[1].digest}]); }],
 ['H3','stale predecessor (competing writer)', ()=>{ if(S.heads.length<2) return refuse('fixture.needs-heads','This vector needs two heads.','Two environment heads.','Seed the happy path first.','sandbox'); const m=S.modules[0]; return publishHead([{mount:'/x',moduleId:m.record.moduleId,record:m.digest}], S.heads[0].digest); }],
 ['H4','rollout targets another project\'s head', ()=>rollout(TRANSITIONS[rolloutState()][0]||'activate', lastHead()?.digest, {foreign:true})],
 ['H5','plaintext private key in a public record', ()=>publishModule('leaky','1.0.0','application/wasm',512,{fields:{privateKey:'ed25519:9f…'}})],
 ['H6','cross-project module reference', ()=>publishModule('foreign','1.0.0','text/javascript',100,{projectId:'prj-other'})],
 ['H7','feedback claims a version outside the view', ()=>{ const outside=S.modules.find(m=>!viewModules().some(x=>x.record===m.digest)); return submitFeedback('crash on load', outside?.digest||'sim:sha256:0', 'public'); }],
 ['H8','private feedback without encryption', ()=>submitFeedback('internal note', viewModules()[0]?.record, 'project-private')],
];
async function runHostile(){
  const before = S.journal.length, results=[];
  for(const [id,name,fn] of HOSTILE){
    const n=S.refusalCount, j=S.journal.length; await fn();
    const refused = S.journal.length===j && S.refusalCount>n;
    results.push({id,name,refused, code: refused ? S.refusals[0].code : 'APPENDED (defect)'});
  }
  S.hostile = {results, appended:S.journal.length-before};
}
async function seedHappy(){
  if(!S.project) await createProject('demo-game');
  const need=[['ui-shell','1.0.0','text/html',2048],['physics','2.3.1','application/wasm',184320],['level-pack','0.9.0','application/octet-stream',1048576]];
  for(const [i,v,m,b] of need) if(!S.modules.some(x=>x.record.moduleId===i)) await publishModule(i,v,m,b);

    <div class="step"><div class="num">07 · FEEDBACK SUBMIT</div>
      ${activeHead?`<div class="grid g2" style="gap:8px;margin-top:4px">
        <div><label class="l" for="fMod">about module</label><select class="f" id="fMod">${S.modules.map(m=>`<option value="${m.digest}">${esc(m.record.moduleId)}@${esc(m.record.version)}${activeHead.record.modules.some(x=>x.record===m.digest)?'':' (not in view)'}</option>`).join('')}</select></div>
        <div><label class="l" for="fVis">visibility</label><select class="f" id="fVis"><option>public</option><option>project-private</option><option>author-private</option></select></div></div>
        <label class="l" for="fBody">statement</label><textarea class="f" id="fBody" rows="2" placeholder="What did you observe?"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="fBtn">feedback submit</button></div>
        ${S.feedback.map(f=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="oid">${short(f.digest)}</span> <span>${esc(f.record.statement)}</span><div class="muted">view ${short(f.record.environmentView)} · ${esc(f.record.visibility)}</div></div>`).join('')}`
      :'<div class="muted" style="margin-top:6px">Feedback binds to an active environment view. Activate a rollout first.</div>'}
    </div>
  </div>

  <div>
    <div class="card"><h2>Refusals · failure, missing evidence, remedy</h2>
      ${S.refusals.length?S.refusals.map(r=>`<div class="refusal ${r.code.includes('notBuilt')?'nb':''}"><b class="${r.code.includes('notBuilt')?'amber':'red'}">${esc(r.code)}</b> <span class="muted">· ${esc(r.owner)}</span>
        <dl><dt>failure</dt><dd>${esc(r.failure)}</dd><dt>missing evidence</dt><dd>${esc(r.missing)}</dd><dt>remedy</dt><dd>${esc(r.remedy)}</dd></dl></div>`).join('')
       :'<div class="muted">No refusals yet. Try the hostile corpus.</div>'}
    </div>
    <div class="card"><h2>Journal · append-only · ${S.journal.length} events</h2>
      ${S.journal.slice().reverse().map(e=>`<div class="jrow" data-j="${e.seq}" tabindex="0" role="button"><span class="muted">#${e.seq}</span><span>${e.type.replace('flux.remote-','').replace('.v1','')} <span class="oid">${short(e.digest)}</span></span><span class="chip s-sim">unsigned</span></div>
        ${S.open===e.seq?`<pre class="json">${esc(JSON.stringify(e.record,null,2))}</pre><div class="muted" style="font-size:11px;margin:4px 0 8px;word-break:break-all">hashed form: ${esc(canon(e.record).slice(0,220))}${canon(e.record).length>220?'…':''}</div>`:''}`).join('')||'<div class="muted">Empty. Seed the happy path or create a project.</div>'}
    </div>
  </div></div>`;

  const v = id => $(id)?.value ?? '';
  const on = (id,fn) => { const el=$(id); if(el) el.onclick = async()=>{ await fn(); render(); }; };
  on('#seed', seedHappy); on('#hostile', runHostile);
  on('#reset', ()=>{ Object.assign(S,{journal:[],refusals:[],refusalCount:0,project:null,modules:[],heads:[],cohort:null,rollouts:[],feedback:[],open:null,envView:null,hostile:null}); });
  on('#pBtn', ()=>createProject(v('#pName')||'demo'));
  on('#mBtn', ()=>publishModule(v('#mId').trim(),v('#mVer').trim(),v('#mMime'),v('#mBytes').trim()));
  on('#hBtn', ()=>{ const mounts=[...document.querySelectorAll('.hm')].filter(c=>c.checked).map(c=>{const m=S.modules[+c.dataset.i];return {mount:document.querySelector(`.hmount[data-i="${c.dataset.i}"]`).value.trim(),moduleId:m.record.moduleId,record:m.digest};}); return publishHead(mounts); });
  on('#cBtn', ()=>createCohort(v('#cName')||'cohort',v('#cPct')));
  on('#uBtn', unlock);
  on('#fBtn', ()=>submitFeedback(v('#fBody'),v('#fMod'),v('#fVis')));
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{ await rollout(b.dataset.r, v('#rHead')); render(); });
  document.querySelectorAll('[data-j]').forEach(r=>{ const t=()=>{ S.open = S.open===+r.dataset.j?null:+r.dataset.j; render(); }; r.onclick=t; r.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); t(); } }; });
  const bb=$('#bBtn'); if(bb) bb.onclick=async()=>{ const id=v('#bId').trim(); if(!id) return; const k=await bucketOf(id); const p=S.cohort.record.selector.percent;
    $('#bOut').innerHTML = k===null?'<span class="amber">digest unavailable</span>':`${esc(id)} → bucket <b>${k}</b> → ${k<p?'<span class="green">in cohort</span>':'<span class="muted">not in cohort</span>'} (in when bucket &lt; ${p})`; };
};

/* ======================= boot ======================= */
view = location.hash.slice(1)||'ledger';
render();
</script>
</body>
</html>
