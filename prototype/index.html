  return `<div class="page"><section style="padding-top:20px">${kicker('Testing', ready?'live':'')}
    <h1 class="page-h">${ready?plural(ready,'build')+' '+(ready===1?'is':'are'):'Nothing is'} <span class="acc">ready for you.</span></h1>
    <p class="lede">Builds other people shared with you, and ones you opened from Explore.</p></section>
    <div class="cards">${L.map(({p,id,e})=>testingCard(p,id,e)).join('')}</div>
    <div class="sect"><h2>Your reports</h2><span class="eyebrow">${mine.length}</span></div>
    <div class="panel pad"><div class="list">${mine.map(({p,f})=>`<div class="item">${sq(p)}<span style="flex:1;min-width:0"><div class="it">${esc(f.title)}</div><div class="is">${esc(p.owner)}/${esc(p.name)} · ${f.env} v${f.v} · ${f.st}${f.thread.some(t=>t.k==='reply'&&t.by!==D.me)?' · developer replied':''}</div></span></div>`).join('')||'<div class="muted" style="padding:8px 4px">No reports yet. Open a build and tell them what you find.</div>'}</div></div>
  </div>${foot()}`;
}

/* ======================= PROJECT · OVERVIEW ======================= */
function vOverview(p){
  if(!isDev(p)) { location.hash='#/testing'; return ''; }
  const eid=selEnv(p), e=p.envs[eid], r=e.rollout, nv=newest(e), live=e.versions.find(v=>v.n===r.live), open=openFb(p).length;
  let head, lede, primary;
  if(!p.modules.length){ head=[`${p.name} is`,'empty.']; lede='Publish your first module. Then pin it as a version and choose who can open it.'; primary=cta('primary','Step 1 of 3','Publish first module',`publishModal('${p.id}')`,'upload'); }
  else if(!nv){ head=['Pieces ready.','Compose v1.']; lede=`${plural(p.modules.length,'module')} published. Pin exact versions together to make the first build.`; primary=cta('primary','Step 2 of 3','Compose v1',`composeModal('${p.id}','${eid}')`); }
  else if(r.state==='draft'){ head=[`v${nv} is ready`,'to release.']; lede=`Nobody can open ${eid} yet. Releasing makes it available to ${audience(e)}.`; primary=cta('primary','Step 3 of 3',`Release v${nv}`,`releaseModal('${p.id}','${eid}',${nv})`); }
  else if(r.state==='active'){ const ppl=e.access==='public'?'anyone on Explore.':e.access==='link'?'anyone with the link.':`${plural(e.group.people,'tester')}.`; head=[`v${r.live} is live`,`for ${ppl}`];
    lede = nv>r.live?`<b>v${nv} is composed and ready.</b>`:open?`<b>${plural(open,'report')} waiting for you.</b>`:e.group.people===0&&e.access==='invite'?'<b>Nobody is invited yet.</b>':'Nothing needs you right now.';
    lede='Every tester gets the same exact build. '+lede;
    primary = nv>r.live?cta('primary','Ready to ship',`Release v${nv}`,`releaseModal('${p.id}','${eid}',${nv})`)
      : open?cta('primary','Testers are waiting',`Review ${plural(open,'report')}`,`location.hash='#/p/${p.id}/feedback'`)
      : e.access==='invite'&&e.group.people===0?cta('primary','Nobody yet','Invite testers',`inviteModal('${p.id}','${eid}')`,'users')
      : cta('primary','Next build',`Compose v${nv+1}`,`composeModal('${p.id}','${eid}')`); }
  else if(r.state==='paused'){ head=['Paused',`on v${r.live}.`]; lede=`${eid} is paused. Testers can't open it until you resume.`; primary=cta('primary','Back on',`Resume v${r.live}`,`act('${p.id}','${eid}','resume')`); }
  else { head=['Closed.','Nothing is live.']; lede='History and feedback stay readable.'; primary=cta('primary','Start again','New environment',`newEnvModal('${p.id}')`,'plus'); }
  const steps=[['Publish',p.modules.length?'done':'cur'],['Compose',nv?'done':p.modules.length?'cur':''],['Release',r.live&&nv===r.live?'done':nv?'cur':''],['Test',r.state==='active'?'done':r.live?'cur':''],['Feedback',r.live?(open?'cur':'done'):'']];
  const panel = live ? `<div class="inner" style="padding:18px"><div class="diagram">
      <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${Object.keys(live.mods).slice(0,3).map((m,i,a)=>{const y=[16,47,78][i];return `<path class="wire ${r.state==='active'?'flow':''}" vector-effect="non-scaling-stroke" d="M17 ${y} C 28 ${y}, 28 46, 38 46" style="animation-delay:${i*.3}s"/>`;}).join('')}</svg>
      <div class="nodes">${Object.keys(live.mods).slice(0,3).map((m,i)=>`<div class="node ${i===0?'hot':''}"><span class="c">${ic(mod(p,m)?.icon||'cube')}</span><span>${esc(mod(p,m)?.name||m)}</span></div>`).join('')}</div>
      <div class="entry"><div class="row"><span class="eyebrow" style="color:var(--text)">${esc(eid)}</span><span class="spacer"></span><span class="eyebrow">v${r.live} / ${nv}</span></div>
        <div class="big">#${hash('view:'+p.id+':'+eid+':'+r.live).slice(0,4)}</div>
        <div class="mono muted" style="font-size:12px">↳ ${live.n>1?'follows v'+(live.n-1):'first version'} · ${plural(Object.keys(live.mods).length,'module')}</div>
        <span class="okc ${r.state==='active'?'':'p'}">${ic(r.state==='active'?'check':'pause')}</span>
        <div class="checks"><span class="eyebrow" style="margin-right:6px">Checks</span>${[['S','Signed'],['E','Encrypted'],['A','Access checked'],['B','Sandboxed']].map(([a,t])=>`<span class="ck" title="${t}" aria-label="${t}">${a}</span>`).join('')}</div></div></div>
      <p class="quote">“${e.access==='invite'?esc(e.group.name)+' get':audience(e)+' gets'} ${Object.entries(live.mods).map(([m,v])=>(mod(p,m)?.name||m).toLowerCase()+' '+v).join(', ')}.”</p></div>`
    : `<div class="empty frame"><span class="ti">${ic(p.modules.length?'layers':'upload')}</span><h3>${p.modules.length?'No build yet':'Nothing here yet'}</h3>${p.modules.length?'Compose a version to see it here.':'Your live build will appear here once it exists.'}</div>`;
  return `<div class="page"><section class="hero">
    <div>${kicker(`${p.name} · ${eid}`, stCls(r.state))}
      <h1 class="display">${esc(head[0])}<br><span class="acc">${esc(head[1])}</span></h1>
      <p class="lede">${lede}</p>
      <div class="ctas">${primary}${r.state==='active'?cta('secondary','See it like they do','Open as tester',`unlock('${p.id}','${eid}')`):''}</div>
      ${live?`<button class="textlink" onclick="openCompare('${p.id}','${eid}',${r.live})">What changed in v${r.live} ${ic('ne')}</button>`:''}
    </div>
    <div class="panel pad accent-top"><div class="row"><span class="eyebrow">The live build</span><span class="spacer"></span>${envSeg(p,eid,'pickEnv')}</div><h2>${live?'Every tester gets exactly this.':'Three steps to your first build.'}</h2>${panel}${stepper(steps)}</div></section>
    <div class="stats">
      ${stat('Live · '+esc(eid),r.live?'v'+r.live:'—',r.live?`of ${nv}`:'',STATE_TXT[r.state])}
      ${stat('Who can open',e.access==='invite'?e.group.people:'∞',e.access==='invite'?'people':'',ACCESS[e.access].label)}
      ${stat('Open feedback',open,'reports',open?'Newest '+openFb(p)[0].at:'All clear')}
      ${stat('Environments',envIds(p).length,'total',envIds(p).filter(i=>p.envs[i].rollout.state==='active').length+' live')}
      ${stat('Modules',p.modules.length,'published','Exact versions only')}
    </div></div>${foot()}`;
}

/* ======================= PROJECT · BUILD ======================= */
function vBuild(p){
  const eid=selEnv(p), e=p.envs[eid], live=e.rollout.live;
  return `<div class="page"><section style="padding-top:20px">${kicker('Build · '+p.name)}
    <h1 class="page-h">${p.modules.length?plural(p.modules.length,'module')+'.':'No modules yet.'} <span class="acc">${p.modules.length?'One exact build.':'Start with one.'}</span></h1>
    <p class="lede">Publish modules, then pin them together as a version. Nothing reaches testers until you release it.</p>
    <div class="ctas">${p.modules.length?cta('primary','Next version',`Compose ${eid} v${newest(e)+1}`,`composeModal('${p.id}','${eid}')`)+cta('secondary','New file','Publish a module',`publishModal('${p.id}')`,'upload'):cta('primary','Step 1','Publish first module',`publishModal('${p.id}')`,'upload')}</div></section>
  <div class="split">
    <div class="panel pad accent-top"><div class="eyebrow">Modules</div><h2>The pieces</h2>
      ${p.modules.length?`<div class="tiles">${p.modules.map(m=>{const nv=m.versions.filter(v=>v.st!=='revoked').at(-1);return `<button class="tile" onclick="openModule('${p.id}','${m.id}')"><span class="ti">${ic(m.icon)}</span><span><div class="tt">${esc(m.name)}</div><div class="ts">${esc(m.id)} · ${nv?'v'+esc(nv.v):'no version'}${nv&&nv.size!=='—'?' · '+nv.size:''}</div></span><span class="go">${ic('arrow')}</span></button>`;}).join('')}</div>`
        :`<div class="empty"><span class="ti">${ic('upload')}</span><h3>No modules</h3>A module is one part of your build: an app shell, an engine, a data pack.</div>`}</div>
    <div class="panel pad accent-top"><div class="row"><span class="eyebrow">Versions</span><span class="spacer"></span>${envSeg(p,eid,'pickEnv')}</div><h2>${esc(eid)}</h2>
      ${e.versions.length?`<div class="list">${e.versions.slice().reverse().map(v=>`<button class="item" onclick="openCompare('${p.id}','${eid}',${v.n})"><span class="vbig">v${v.n}</span><span style="flex:1;min-width:0"><div class="it">${esc(v.note)}</div><div class="is">${esc(v.by)} · ${v.at} · ${plural(Object.keys(v.mods).length,'module')}</div></span>${v.n===live?chip(stCls(e.rollout.state),STATE_TXT[e.rollout.state]):''}<span class="dim">${ic('arrow')}</span></button>`).join('')}</div>`
        :`<div class="empty"><span class="ti">${ic('layers')}</span><h3>No versions</h3>${p.modules.length?`<button class="btn solid sm" style="margin-top:10px" onclick="composeModal('${p.id}','${eid}')">Compose v1</button>`:'Publish a module first.'}</div>`}</div>
  </div></div>${foot()}`;
}
function diffTable(p,a,b){
  const ids=[...new Set([...Object.keys(a||{}),...Object.keys(b)])];
  return `<div class="tbl"><table class="t"><tr><th>Module</th><th>Before</th><th>After</th></tr>${ids.map(id=>{const o=a?.[id],n=b[id],k=!o?'add':!n?'del':o!==n?'chg':'same';
    return `<tr class="d-${k}"><td>${esc(mod(p,id)?.name||id)}</td><td class="mono ${k==='same'?'dim':''}">${o||'—'}</td><td class="mono">${n||'<span class="red">removed</span>'}${k!=='same'?` <span class="chip ${k==='add'?'live':k==='del'?'revoked':'paused'}" style="margin-left:6px">${{add:'new',chg:'changed',del:'removed'}[k]}</span>`:''}</td></tr>`;}).join('')}</table></div>`;
}
function openCompare(pid,eid,n){
  const p=P(pid), e=p.envs[eid], v=e.versions.find(x=>x.n===n), pv=e.versions.find(x=>x.n===n-1), r=e.rollout;
  drawer(`${eid} · v${n}`,esc(v.note),`
    <div class="row" style="margin-bottom:18px">${n===r.live?chip(stCls(r.state),r.state==='active'?'Live now':'Live · '+r.state):chip('','Not live')}<span class="muted" style="font-size:13px">${esc(v.by)} · ${v.at}</span><span class="spacer"></span>${fp('view:'+pid+':'+eid+':'+n)}</div>
    <div class="eyebrow" style="margin-bottom:8px">${pv?'Compared with v'+pv.n:'First version'}</div>${diffTable(p,pv?.mods,v.mods)}`,
    n>r.live&&r.state!=='closed'?`<button class="btn solid" onclick="releaseModal('${pid}','${eid}',${n})">${ic('play')}Release v${n}</button>`:n<r.live&&r.state!=='closed'?`<button class="btn" onclick="rollbackModal('${pid}','${eid}',${n})">${ic('undo')}Roll back to v${n}</button>`:'');
}
function openModule(pid,id){
  const p=P(pid), m=mod(p,id);
  drawer(m.name,`${m.id}`,`<div class="list">${m.versions.slice().reverse().map(v=>`<div class="item"><span class="vbig" style="width:76px;font-size:18px">${esc(v.v)}</span><span style="flex:1;min-width:0"><div class="it">${esc(v.notes)}</div><div class="is">${esc(v.by)} · ${v.at} · ${v.size}</div></span>
      ${v.st!=='active'?chip(v.st,v.st):`<button class="btn ghost sm" onclick="revokeModal('${pid}','${m.id}','${esc(v.v)}')">Revoke</button>`}</div>`).join('')}</div>
    <p class="hint" style="margin-top:16px">${ic('lock')} Versions never change once published. Publish a new one to fix something.</p>`,
    `<button class="btn solid" onclick="publishModal('${pid}','${m.id}')">${ic('upload')}Publish new version</button>`);
}

/* ======================= PROJECT · RELEASE ======================= */
const EVT={release:['released','g'],pause:['paused','a'],resume:['resumed','g'],rollback:['rolled back to','r'],close:['closed','']};
function vRelease(p){
  const eid=selEnv(p), e=p.envs[eid], r=e.rollout, nv=newest(e);
  const head = r.state==='active'?[`v${r.live} is`,'live.']:r.state==='paused'?['Paused',`on v${r.live}.`]:r.state==='draft'?[nv?`v${nv} is ready.`:'Nothing yet.',nv?'Not live yet.':'Compose v1 first.']:['Closed.','Nothing is live.'];
  let primary;
  if(r.state==='closed') primary=cta('primary','Start again','New environment',`newEnvModal('${p.id}')`,'plus');
  else if(!nv) primary=cta('primary','First build','Compose v1',`composeModal('${p.id}','${eid}')`);
  else if(nv>r.live) primary=cta('primary',r.state==='draft'?'Go live':'Ready to ship',`Release v${nv}`,`releaseModal('${p.id}','${eid}',${nv})`);
  else if(r.state==='paused') primary=cta('primary','Back on',`Resume v${r.live}`,`act('${p.id}','${eid}','resume')`);
  else primary=cta('secondary','Stop new sessions','Pause',`act('${p.id}','${eid}','pause')`,'pause');
  const evs=r.events.slice().reverse();
  return `<div class="page"><section class="hero">
    <div><div class="row" style="margin-bottom:22px">${kicker('Release',stCls(r.state),'margin:0')}<span class="spacer"></span>${envSeg(p,eid,'pickEnv')}</div>
      <h1 class="display">${esc(head[0])}<br><span class="acc">${esc(head[1])}</span></h1>
      <p class="lede">${r.state==='closed'?'Feedback and history stay readable.':`Who can open it: <b>${audience(e)}</b>. Anyone mid-session finishes first.`}</p>
      <div class="ctas">${primary}</div>
      ${r.state!=='closed'?`<div class="row" style="margin-top:22px">
        <button class="btn" onclick="accessModal('${p.id}','${eid}')">${ic(ACCESS[e.access].icon)}${ACCESS[e.access].label}</button>
        ${e.access==='invite'?`<button class="btn" onclick="inviteModal('${p.id}','${eid}')">${ic('users')}Invite</button>`:e.access==='link'?`<button class="btn" onclick="linkModal('${p.id}','${eid}')">${ic('link')}Copy link</button>`:''}
        ${r.live>1?`<button class="btn" onclick="rollbackModal('${p.id}','${eid}')">${ic('undo')}Roll back</button>`:''}
        ${r.state==='active'&&nv>r.live?`<button class="btn" onclick="act('${p.id}','${eid}','pause')">${ic('pause')}Pause</button>`:''}
        ${r.state!=='draft'?`<button class="btn ghost" onclick="closeRollout('${p.id}','${eid}')">Close</button>`:''}</div>`:''}
    </div>
    <div class="panel pad accent-top"><div class="eyebrow">Timeline · ${esc(eid)}</div><h2>Every change, kept.</h2>
      ${evs.length?`<div class="tl">${evs.slice(0,D.allEv?99:4).map(ev=>`<div class="ev ${EVT[ev.a][1]}"><div>${av(ev.by)} <b>${esc(ev.by)}</b> ${EVT[ev.a][0]} ${ev.a==='close'?'the rollout':'<b>v'+ev.v+'</b>'}</div>${ev.reason?`<div class="muted" style="font-size:14px;margin:2px 0">“${esc(ev.reason)}”</div>`:''}<div class="when">${ev.at}</div></div>`).join('')}</div>
      ${evs.length>4?`<button class="textlink" style="margin-top:14px" onclick="D.allEv=!D.allEv;render()">${D.allEv?'Show less':'Show all '+evs.length}</button>`:''}`
      :`<div class="empty">Nothing released yet. The first release starts the timeline.</div>`}
    </div></section>
    <div class="stats">${stat('Live version',r.live?'v'+r.live:'—',r.live?`of ${nv}`:'',STATE_TXT[r.state])}${stat('Who can open',e.access==='invite'?e.group.people:'∞',e.access==='invite'?'people':'',ACCESS[e.access].label)}${stat('Fingerprint',r.live?'#'+hash('view:'+p.id+':'+eid+':'+r.live).slice(0,4):'—','','What testers see')}${stat('Releases',r.events.filter(x=>x.a==='release').length,'total','')}${stat('Rollbacks',r.events.filter(x=>x.a==='rollback').length,'total','')}</div>
  </div>${foot()}`;
}
function act(pid,eid,a,extra={}){
  const p=P(pid), r=p.envs[eid].rollout, v=extra.v??r.live;
  r.events.push({a,v,by:D.me,at:'just now',reason:extra.reason});
  if(a==='pause')r.state='paused'; if(['resume','release','rollback'].includes(a))r.state='active'; if(a==='close')r.state='closed'; if(a==='release'||a==='rollback')r.live=v;
  log(pid,'release',`${EVT[a][0]} ${eid}${a==='close'?'':' v'+v}`);
  closeLayer(); toast({pause:`${eid} paused`,resume:`${eid} v${v} is back on`,release:`${eid} v${v} is live`,rollback:`${eid} is back on v${v}`,close:`${eid} closed`}[a]); render();
}
function releaseModal(pid,eid,n){
  const p=P(pid), e=p.envs[eid], r=e.rollout;
  modal('Ship it',`Release ${eid} v${n}?`,`<p class="muted" style="margin-top:0">${audience(e)} can open it${r.live?' on their next session':''}.</p>${diffTable(p,r.live?e.versions.find(x=>x.n===r.live).mods:null,e.versions.find(x=>x.n===n).mods)}
    ${e.access==='invite'&&e.group.people===0?refusal('Nobody invited yet',{what:'This environment is invite only and has no testers.',need:'At least one invited person.',fix:'Release now and invite people next, or change who can open it.'},true):''}`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="act('${pid}','${eid}','release',{v:${n}})">${ic('play')}Release v${n}</button>`);
}
function rollbackModal(pid,eid,pre){
  const e=P(pid).envs[eid], r=e.rollout, opts=e.versions.filter(x=>x.n<r.live).reverse();
  modal('Roll back',`Return ${eid} to an earlier version`,`<label class="f" for="rbV" style="margin-top:4px">Version</label><select class="input" id="rbV">${opts.map(x=>`<option value="${x.n}" ${x.n===pre?'selected':''}>v${x.n} · ${esc(x.note)}</option>`).join('')}</select>
    <label class="f" for="rbR">Why? · shown in the timeline</label><input class="input" id="rbR" placeholder="e.g. Level 4 crashes after reload"><div id="rbMsg"></div>
    <p class="hint">Nothing is deleted. You can release v${r.live} again any time.</p>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRollback('${pid}','${eid}')">${ic('undo')}Roll back</button>`);
}
function doRollback(pid,eid){const reason=document.getElementById('rbR').value.trim(); if(!reason){document.getElementById('rbMsg').innerHTML=refusal('Reason needed',{what:'Rollbacks without a reason are refused.',need:'One line your team and testers can read.',fix:'Say what went wrong.',code:'rollout.reason-required'});return;} act(pid,eid,'rollback',{v:+document.getElementById('rbV').value,reason});}
function closeRollout(pid,eid){
  modal('Final step',`Close ${eid}?`,`<p class="muted" style="margin-top:0">Nobody can open ${eid} after this. Feedback and history stay.</p><label class="f" for="clC">Type ${eid} to confirm</label><input class="input" id="clC" autocomplete="off"><div id="clMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="confirmClose('${pid}','${eid}')">Close</button>`);
}
function confirmClose(pid,eid){ if(document.getElementById('clC').value===eid) act(pid,eid,'close'); else document.getElementById('clMsg').innerHTML=refusal('Not confirmed',{what:"The name doesn't match.",need:'The environment name, exactly.',fix:`Type ${eid}.`,code:'confirm.mismatch'}); }

/* ======================= ACCESS · INVITE · LINK ======================= */
const optList=(name,cur)=>`<div class="opts" role="radiogroup">${Object.entries(ACCESS).map(([k,a])=>`<button type="button" role="radio" aria-checked="${k===cur}" class="opt ${k===cur?'on':''}" data-v="${k}" onclick="pickOpt(this)"><span class="radio"></span>${ic(a.icon,'copper')}<span><div class="ob">${a.label}</div><div class="os">${a.sub}</div></span></button>`).join('')}</div>`;
function pickOpt(b){ b.parentNode.querySelectorAll('.opt').forEach(o=>{o.classList.remove('on');o.setAttribute('aria-checked','false');}); b.classList.add('on'); b.setAttribute('aria-checked','true'); }
const optVal=sel=>document.querySelector(sel+' .opt.on')?.dataset.v;
function accessModal(pid,eid){
  const e=P(pid).envs[eid];
  modal('Who can open it',eid,`<div id="acc">${optList('acc',e.access)}</div><p class="hint">${ic('shield')} Every open is still checked by Flux Access, whatever you choose.</p>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="setAccess('${pid}','${eid}')">Save</button>`);
}
function setAccess(pid,eid){ const e=P(pid).envs[eid], v=optVal('#acc'); e.access=v; if(v==='public') e.group={name:'Everyone',people:e.group.people}; if(v==='link') e.group={name:'Anyone with the link',people:e.group.people};
  log(pid,'access',`set ${eid} to ${ACCESS[v].label.toLowerCase()}`); closeLayer(); toast(v==='public'||v==='request'?`${eid} is now on Explore`:`Saved: ${ACCESS[v].label}`); render(); }
function inviteModal(pid,eid){
  modal('Invite testers',eid,`<label class="f" for="invW" style="margin-top:4px">Emails or handles</label><textarea class="input" id="invW" rows="3" placeholder="alex@example.com, tester-31"></textarea><div id="invMsg"></div>
    <p class="hint">${ic('lock')} They confirm who they are the first time they open it.</p>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doInvite('${pid}','${eid}')">Send invites</button>`);
}
function doInvite(pid,eid){ const raw=document.getElementById('invW').value.split(/[\s,]+/).filter(Boolean);
  if(!raw.length){document.getElementById('invMsg').innerHTML=refusal('Nobody to invite',{what:'The list is empty.',need:'At least one email or handle.',fix:'Add the people you want to test.',code:'invite.empty'});return;}
  const e=P(pid).envs[eid]; e.group.people+=raw.length; if(e.group.name==='Invited people') e.group.rule='Named people'; log(pid,'access',`invited ${plural(raw.length,'person').replace('persons','people')} to ${eid}`); closeLayer(); toast(`${plural(raw.length,'invite')} sent`); render(); }
function linkModal(pid,eid){ const l=`remote.defxn.com/t/${hash(pid+eid).slice(0,8)}`;
  modal('Share',`Link to ${eid}`,`<div class="linkbox">${l}<span class="spacer"></span><button class="fp" data-copy="https://${l}" style="color:var(--teal)">Copy${ic('copy')}</button></div><p class="hint">Anyone with this link can open ${eid}. Change who can open it to stop the link.</p>`,`<button class="btn" onclick="closeLayer()">Done</button>`); }

/* ======================= CREATE: PROJECT · ENVIRONMENT ======================= */
const SLUG=/^[a-z0-9][a-z0-9-]{1,30}$/;
let W=null;
function newProject(){ closeMenus(); W={step:0,owner:D.me,name:'',kind:'Game',desc:'',env:'preview',access:'invite'}; wizard(); }
function wizard(msg=''){
  const s=W.step, steps=[['Name',s>0?'done':'cur'],['Who can open',s>1?'done':s===1?'cur':''],['Create',s===2?'cur':'']];
  let body='';
  if(s===0) body=`<label class="f" for="wOwner" style="margin-top:4px">Owner</label><select class="input" id="wOwner"><option value="${D.me}" ${W.owner===D.me?'selected':''}>${D.me} (you)</option><option value="defxn" ${W.owner==='defxn'?'selected':''}>defxn (team)</option></select>
    <label class="f" for="wName">Project name</label><input class="input" id="wName" value="${esc(W.name)}" placeholder="my-game" autocomplete="off"><div class="hint">Lowercase letters, numbers and dashes.</div>
    <label class="f">Kind</label><div class="kinds" id="wKind">${KINDS.map(k=>`<button type="button" class="${W.kind===k?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${k}</button>`).join('')}</div>
    <label class="f" for="wDesc">In one line <span class="dim">· optional</span></label><input class="input" id="wDesc" value="${esc(W.desc)}" placeholder="What is it?">`;
  if(s===1) body=`<label class="f" for="wEnv" style="margin-top:4px">First environment</label><input class="input" id="wEnv" value="${esc(W.env)}" autocomplete="off"><div class="hint">A place testers open, like preview, beta or playtest.</div>
    <label class="f">Who can open it</label><div id="wAcc">${optList('w',W.access)}</div>`;
  if(s===2) body=`<div class="list">${[['Project',`${W.owner}/${W.name}`],['Kind',W.kind],['Environment',W.env],['Who can open',ACCESS[W.access].label]].map(([k,v])=>`<div class="item"><span class="eyebrow" style="width:130px">${k}</span><span class="it">${esc(v)}</span></div>`).join('')}</div>
    <p class="hint">${ic('lock')} Encryption keys are created on your device. You can change everything later.</p>`;
  modal(`New project · ${s+1} / 3`,['Name it','Who can open it?','Ready to create'][s],`<div style="margin-bottom:10px">${stepper(steps)}</div>`+body+msg,
    `${s?`<button class="btn ghost" onclick="wizBack()">Back</button>`:`<button class="btn ghost" onclick="closeLayer()">Cancel</button>`}<button class="btn solid" onclick="wizNext()">${s===2?ic('plus')+'Create project':'Continue'}</button>`);
}
function wizSave(){ const g=id=>document.getElementById(id); if(W.step===0){W.owner=g('wOwner').value;W.name=g('wName').value.trim().toLowerCase();W.kind=document.querySelector('#wKind .on')?.textContent||'Game';W.desc=g('wDesc').value.trim();} if(W.step===1){W.env=g('wEnv').value.trim().toLowerCase();W.access=optVal('#wAcc');} }
function wizBack(){ wizSave(); W.step--; wizard(); }
function wizNext(){
  wizSave();
  if(W.step===0){ if(!SLUG.test(W.name)) return wizard(refusal('Name not usable',{what:W.name?`“${esc(W.name)}” has characters we can't use in a link.`:'No name entered.',need:'2–31 lowercase letters, numbers or dashes.',fix:'Try something like my-game.',code:'project.invalid-name'}));
    if(D.projects.some(p=>p.owner===W.owner&&p.name===W.name)) return wizard(refusal('Name taken',{what:`${esc(W.owner)}/${esc(W.name)} already exists.`,need:'A name you haven\'t used.',fix:`Try ${esc(W.name)}-2.`,code:'project.exists'})); }
  if(W.step===1&&!SLUG.test(W.env)) return wizard(refusal('Environment name not usable',{what:W.env?`“${esc(W.env)}” can't be used.`:'No name entered.',need:'Lowercase letters, numbers or dashes.',fix:'Try preview or beta.',code:'environment.invalid-name'}));
  if(W.step<2){ W.step++; return wizard(); }
  let id=W.name; if(P(id)) id=W.owner+'-'+W.name;
  const grp=W.access==='public'?{name:'Everyone',people:0}:W.access==='link'?{name:'Anyone with the link',people:0}:{name:W.access==='request'?'Approved testers':'Invited people',people:0};
  D.projects.unshift({id,owner:W.owner,name:W.name,kind:W.kind,desc:W.desc||`A new ${W.kind.toLowerCase()}.`,role:'owner',members:[{u:D.me,r:'Owner'}],keys:[{n:1,at:'just now',why:'Project created'}],modules:[],envs:{[W.env]:env({access:W.access,group:grp})},feedback:[]});
  log(id,'build','created the project'); closeLayer(); toast(`${W.owner}/${W.name} created`); location.hash=`#/p/${id}/overview`;
}
function newEnvModal(pid){
  const p=P(pid);
  modal('New environment',p.name,`<label class="f" for="neN" style="margin-top:4px">Name</label><input class="input" id="neN" placeholder="beta" autocomplete="off"><div class="hint">Each environment has its own versions, testers and timeline.</div>
    <label class="f">Who can open it</label><div id="neA">${optList('ne','invite')}</div><div id="neMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doNewEnv('${pid}')">${ic('plus')}Create</button>`);
}
function doNewEnv(pid){
  const p=P(pid), n=document.getElementById('neN').value.trim().toLowerCase(), a=optVal('#neA'), out=document.getElementById('neMsg');
  if(!SLUG.test(n)){out.innerHTML=refusal('Name not usable',{what:n?`“${esc(n)}” can't be used.`:'No name entered.',need:'Lowercase letters, numbers or dashes.',fix:'Try beta or staging.',code:'environment.invalid-name'});return;}
  if(p.envs[n]){out.innerHTML=refusal('Already exists',{what:`${esc(p.name)} already has ${esc(n)}.`,need:'A new name.',fix:`Pick another name, or open ${esc(n)}.`,code:'environment.exists'});return;}
  p.envs[n]=env({access:a,group:a==='public'?{name:'Everyone',people:0}:a==='link'?{name:'Anyone with the link',people:0}:{name:'Invited people',people:0}});
  D.sel[pid]=n; log(pid,'release',`created environment ${n}`); closeLayer(); toast(`${n} created`); render();
}

/* ======================= COMPOSE / PUBLISH / REVOKE ======================= */
function composeModal(pid,eid){
  const p=P(pid), e=p.envs[eid], cur=e.versions.at(-1)||{n:0,mods:{}};
  if(!p.modules.length) return publishModal(pid);
  const base=cur.n?cur.mods:Object.fromEntries(p.modules.map(m=>[m.id,m.versions.filter(v=>v.st!=='revoked').at(-1)?.v]).filter(x=>x[1]));
  modal(`Compose · ${eid}`,`Version ${cur.n+1}`,`<p class="muted" style="margin-top:0">Pick one exact version of each module.</p>
    ${p.modules.map(m=>`<label class="f" for="cm-${m.id}">${esc(m.name)}</label><select class="input cm" id="cm-${m.id}" data-m="${m.id}"><option value="">Leave out</option>${m.versions.slice().reverse().map(v=>`<option value="${esc(v.v)}" ${base[m.id]===v.v?'selected':''} ${v.st==='revoked'?'disabled':''}>${esc(v.v)}${v.st==='revoked'?' · revoked':''}</option>`).join('')}</select>`).join('')}
    <label class="f" for="cmN">What changed?</label><input class="input" id="cmN" placeholder="One line"><div id="cmMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doCompose('${pid}','${eid}')">Save v${cur.n+1}</button>`);
}
function doCompose(pid,eid){
  const e=P(pid).envs[eid], cur=e.versions.at(-1), mods={}; document.querySelectorAll('.cm').forEach(s=>{if(s.value)mods[s.dataset.m]=s.value;});
  const out=document.getElementById('cmMsg');
  if(!Object.keys(mods).length){out.innerHTML=refusal('Empty version',{what:'No modules are selected.',need:'At least one module.',fix:'Pick a version for a module.',code:'environment.empty'});return;}
  if(cur&&JSON.stringify(Object.entries(mods).sort())===JSON.stringify(Object.entries(cur.mods).sort())){out.innerHTML=refusal('Nothing changed',{what:`This is the same as v${cur.n}.`,need:'At least one different module version.',fix:`Change a version, or release v${cur.n} as it is.`,code:'environment.identical'});return;}
  const n=(cur?.n||0)+1; e.versions.push({n,mods,by:D.me,at:'just now',note:document.getElementById('cmN').value.trim()||(n===1?'First build':'Updated modules')}); log(pid,'build',`composed ${eid} v${n}`);
  closeLayer(); toast(`${eid} v${n} saved. Release it when you're ready.`); render();
}
function publishModal(pid,pre){
  const p=P(pid);
  modal('Publish',p.modules.length?'New module version':'Your first module',`<label class="f" for="pmM" style="margin-top:4px">Module</label><select class="input" id="pmM" onchange="document.getElementById('pmNew').hidden=this.value!=='__new'">${p.modules.map(m=>`<option value="${m.id}" ${m.id===pre?'selected':''}>${esc(m.name)} · ${m.id}</option>`).join('')}<option value="__new" ${p.modules.length?'':'selected'}>+ New module</option></select>
    <div id="pmNew" ${p.modules.length?'hidden':''}><label class="f" for="pmName">Module name</label><input class="input" id="pmName" placeholder="app" autocomplete="off"></div>
    <label class="f" for="pmV">Version</label><input class="input" id="pmV" placeholder="1.0.0" style="max-width:200px">
    <label class="f">File</label><button class="tile" id="pmF" onclick="pickFile(this)"><span class="ti">${ic('upload')}</span><span><div class="tt">Choose a file</div><div class="ts">Encrypted on your device first</div></span></button>
    <div id="pmMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doPublish('${pid}')">${ic('upload')}Publish</button>`);
}
function pickFile(el){ el.dataset.ok=1; el.querySelector('.tt').textContent='build.zip'; el.querySelector('.ts').textContent='1.4 MB · ready'; }
function doPublish(pid){
  const p=P(pid), sel=document.getElementById('pmM').value, v=document.getElementById('pmV').value.trim(), out=document.getElementById('pmMsg');
  let m=null, newId=null;
  if(sel==='__new'){ newId=document.getElementById('pmName').value.trim().toLowerCase(); if(!SLUG.test(newId)){out.innerHTML=refusal('Module name not usable',{what:newId?`“${esc(newId)}” can't be used.`:'No module name.',need:'Lowercase letters, numbers or dashes.',fix:'Try app, engine or assets.',code:'module.invalid-name'});return;}
    if(mod(p,newId)){out.innerHTML=refusal('Module exists',{what:`${esc(newId)} is already in this project.`,need:'A new name, or pick it from the list.',fix:'Choose it above to add a version.',code:'module.exists'});return;} }
  else m=mod(p,sel);
  if(!/^\d+\.\d+\.\d+$/.test(v)){out.innerHTML=refusal("Can't publish this version",{what:v?`“${esc(v)}” isn't an exact version.`:'No version entered.',need:'An exact number like 1.0.0.',fix:'Words like “latest” and ranges like “^1.2” can change later, so they can\'t be published.',code:'module.mutable-version'});return;}
  if(m&&m.versions.some(x=>x.v===v)){out.innerHTML=refusal('Version already used',{what:`${esc(m.id)} ${esc(v)} exists.`,need:'A new number.',fix:'Published versions never change. Try '+esc(v.replace(/(\d+)$/,d=>+d+1))+'.',code:'module.version-reuse'});return;}
  if(!document.getElementById('pmF').dataset.ok){out.innerHTML=refusal('No file',{what:'Nothing is attached.',need:'The built file.',fix:'Choose the file for this version.',code:'artifact.missing'});return;}
  if(!m){ m={id:newId,name:newId[0].toUpperCase()+newId.slice(1),icon:KIND_ICON[p.kind]||'cube',versions:[]}; p.modules.push(m); }
  m.versions.push({v,size:'1.4 MB',by:D.me,at:'just now',st:'active',notes:p.modules.length===1&&m.versions.length===0?'First version':'New version'}); log(pid,'build',`published ${m.id} ${v}`); closeLayer(); toast(`${esc(m.name)} ${esc(v)} published`); render();
}
function revokeModal(pid,id,v){
  modal('Permanent',`Revoke ${id} ${v}?`,`<p class="muted" style="margin-top:0">It can't be added to new versions or downloaded again.</p>${refusal("Copies already downloaded stay",{what:'Testers who opened it keep their copy.',need:'Nothing from you here.',fix:'If it held a secret, rotate that secret.'},true)}
    <label class="f" for="rvR">Why?</label><input class="input" id="rvR" placeholder="e.g. Unlicensed audio"><div id="rvMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRevoke('${pid}','${id}','${v}')">Revoke</button>`);
}
function doRevoke(pid,id,v){ if(!document.getElementById('rvR').value.trim()){document.getElementById('rvMsg').innerHTML=refusal('Reason needed',{what:'Revokes without a reason are refused.',need:'One line for the history.',fix:'Say why it is being revoked.',code:'module.reason-required'});return;}
  mod(P(pid),id).versions.find(x=>x.v===v).st='revoked'; log(pid,'access',`revoked ${id} ${v}`); closeLayer(); toast(`${id} ${v} revoked`); render(); }

/* ======================= PROJECT · FEEDBACK ======================= */
function vFeedback(p){
  const open=openFb(p), list=D.fbTab==='open'?open:p.feedback.filter(f=>f.st!=='open');
  return `<div class="page"><section style="padding-top:20px">${kicker('Feedback · '+p.name)}
    <h1 class="page-h">${open.length?`${plural(open.length,'report')} <span class="acc">need${open.length>1?'':'s'} you.</span>`:`All clear. <span class="acc">Nothing waiting.</span>`}</h1>
    <p class="lede">Every report is tied to the exact version the tester had open.</p></section>
  <div class="panel pad accent-top"><div class="row" style="margin-bottom:6px"><div class="seg" role="group" aria-label="Filter"><button class="${D.fbTab==='open'?'on':''}" onclick="D.fbTab='open';render()">Open · ${open.length}</button><button class="${D.fbTab==='done'?'on':''}" onclick="D.fbTab='done';render()">Done · ${p.feedback.length-open.length}</button></div></div>
    <div class="list">${list.map(f=>`<button class="item" onclick="openReport('${p.id}',${f.n})">${av(f.by)}<span style="flex:1;min-width:0"><div class="it">${esc(f.title)}</div><div class="is">#${f.n} · ${f.at} · ${esc(f.env)} v${f.v}${f.vis!=='Public'?' · '+f.vis:''}</div></span><span class="hide-sm">${ver(f.mod,f.mv)}</span><span class="dim">${ic('arrow')}</span></button>`).join('')||`<div class="muted" style="padding:28px 4px">${p.feedback.length?'Nothing here.':'No reports yet. They arrive once testers open a live build.'}</div>`}</div>
  </div></div>${foot()}`;
}
function openReport(pid,n){
  const p=P(pid), f=p.feedback.find(x=>x.n===n);
  drawer(f.title,`Report #${f.n} · ${esc(f.env)} v${f.v}`,`
    <div class="row" style="margin-bottom:16px">${chip(f.st==='open'?'live':'',f.st==='open'?'Open':'Done')}${ver(f.mod,f.mv)}<span class="muted" style="font-size:13px">${f.vis}</span><span class="spacer"></span>${fp('view:'+pid+':'+f.env+':'+f.v)}</div>
    <div class="card orig frame"><div class="ch">${av(f.by)}<b>${esc(f.by)}</b><span class="muted">${f.at}</span><span class="spacer"></span><span class="eyebrow" style="font-size:9.5px;display:flex;gap:4px;align-items:center">${ic('lock')} Original</span></div><div class="cb">${esc(f.body)}</div></div>
    ${f.thread.map(t=>t.k==='status'?`<div class="eyebrow" style="margin:10px 0 12px 4px">${esc(t.by)} marked it ${t.to==='done'?'done':'open'} · ${t.at}</div>`:`<div class="card"><div class="ch">${av(t.by)}<b>${esc(t.by)}</b><span class="muted">${t.at}</span>${t.k==='correction'?'<span class="chip paused" style="margin-left:auto">Correction</span>':''}</div><div class="cb">${esc(t.body)}</div></div>`).join('')}
    <label class="f" for="rp">Reply</label><textarea class="input" id="rp" rows="3" placeholder="Ask, thank, or say what's fixed"></textarea>`,
    `${f.st==='open'?`<button class="btn" onclick="setFb('${pid}',${n},'done')">${ic('check')}Mark done</button>`:`<button class="btn" onclick="setFb('${pid}',${n},'open')">Reopen</button>`}<button class="btn solid" onclick="reply('${pid}',${n})">Send reply</button>`);
}
function setFb(pid,n,s){const f=P(pid).feedback.find(x=>x.n===n);f.st=s;f.thread.push({k:'status',by:D.me,at:'just now',to:s});log(pid,'feedback',`marked #${n} ${s}`);closeLayer();toast(`#${n} ${s==='done'?'marked done':'reopened'}`);render();}
function reply(pid,n){const t=document.getElementById('rp').value.trim();if(!t){document.getElementById('rp').focus();toast('Write a reply first');return;}P(pid).feedback.find(x=>x.n===n).thread.push({k:'reply',by:D.me,at:'just now',body:t});openReport(pid,n);toast('Reply sent');render();}

/* ======================= MENU DRAWERS ======================= */
function openActivity(pid){
  const list=D.activity.filter(a=>!pid||a.p===pid);
  drawer('Activity',pid?`Everything in ${esc(P(pid).name)} · permanent`:'Across your projects · permanent',`<div class="tl">${list.map(a=>`<div class="ev ${a.k==='release'?'g':a.k==='access'?'a':''}"><div>${av(a.who)} <b>${esc(a.who)}</b> ${esc(a.t)}${pid?'':` <span class="muted">· ${esc(P(a.p)?.name||a.p)}</span>`}</div><div class="when">${a.at} · ${a.k}</div></div>`).join('')||'<div class="muted">Nothing yet.</div>'}</div>`,'');
}
function openPeople(pid){
  const p=P(pid);
  drawer('People & keys',`Who can work on ${esc(p.name)}`,`<div class="list">${p.members.map(m=>`<div class="item">${av(m.u)}<span style="flex:1"><div class="it">${esc(m.u)}</div><div class="is">${m.r}</div></span>${m.r!=='Owner'?`<button class="btn ghost sm" onclick="removeMember('${pid}','${m.u}')">Remove</button>`:''}</div>`).join('')}</div>
    <button class="btn sm" style="margin-top:12px" onclick="addMember('${pid}')">${ic('plus')}Add a developer</button>
    <div class="eyebrow" style="margin:26px 0 10px">Encryption key</div>
    <div class="row"><div class="stat"><div class="n" style="margin:0">v${p.keys[0].n}<small>current</small></div></div><span class="spacer"></span><button class="btn sm" onclick="rotateKey('${pid}')">Rotate now</button></div>
    <p class="hint">${esc(p.keys[0].why)} · ${p.keys[0].at}. Rotates by itself when someone loses access.</p>
    <p class="hint">${ic('shield')} Access is decided by Flux Access. If it can't be reached, actions are refused, not allowed.</p>`,'');
}
function addMember(pid){ modal('Team','Add a developer',`<label class="f" for="amU" style="margin-top:4px">Handle</label><input class="input" id="amU" placeholder="devon"><label class="f" for="amR">Role</label><select class="input" id="amR"><option>Developer</option><option>Maintainer</option></select>`,
  `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="const u=document.getElementById('amU').value.trim();if(!u){toast('Add a handle');return;}P('${pid}').members.push({u,r:document.getElementById('amR').value});log('${pid}','access','added '+u);closeLayer();openPeople('${pid}');toast('Invite sent to '+esc(u))">Add</button>`); }
function rotateKey(pid){ const p=P(pid); p.keys.unshift({n:p.keys[0].n+1,at:'just now',why:'Manual rotation'}); log(pid,'access','rotated the encryption key'); openPeople(pid); toast('Key rotated'); }
function removeMember(pid,u){
  modal('Remove access',`Remove ${u}?`,`<p class="muted" style="margin-top:0">${esc(u)} loses access now and the key rotates.</p>${refusal("Some things can't be taken back",{what:`Anything ${esc(u)} already downloaded stays with them.`,need:'Nothing from you here.',fix:'Rotate any secrets they could see.'},true)}`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRemove('${pid}','${u}')">Remove ${esc(u)}</button>`);
}
function doRemove(pid,u){ const p=P(pid); p.members=p.members.filter(m=>m.u!==u); p.keys.unshift({n:p.keys[0].n+1,at:'just now',why:`${u} removed`}); log(pid,'access',`removed ${u}`); closeLayer(); toast(`${u} removed · key rotated`); }

/* ======================= OPEN & RUN ======================= */
function unlock(pid,eid){
  closeMenus(); const p=P(pid), e=p.envs[eid], key=pid+'/'+eid;
  if(D.unlocked[key]){ location.hash=`#/run/${pid}/${eid}`; return; }
  modal('Opening',`${p.owner}/${p.name} · ${eid}`,`<div class="stepper" id="ust">${["Confirm it's you",'Check access','Unlock v'+e.rollout.live].map((l,k)=>`<div class="step ${k===0?'cur':''}" data-k="${k}"><span class="dot">${String(k+1).padStart(2,'0')}</span>${l}</div>`).join('')}</div>
    <p class="hint" style="justify-content:center;margin-top:18px">${ic('lock')} Approve in your signer app. Your keys never leave it.</p>`,`<button class="btn ghost" onclick="closeLayer()">Cancel</button>`);
  let k=0; const tick=()=>{const s=document.querySelector(`#ust .step[data-k="${k}"]`); if(!s) return; s.className='step done'; s.querySelector('.dot').innerHTML=ic('check'); k++; const n=document.querySelector(`#ust .step[data-k="${k}"]`); if(n){n.className='step cur'; setTimeout(tick,600);} else setTimeout(()=>{closeLayer();D.unlocked[key]=true;if(!isDev(p)&&!e.my&&!D.recent.includes(key))D.recent.push(key);location.hash=`#/run/${pid}/${eid}`;},350);};
  setTimeout(tick,800);
}
let anim;
function vRun(p,eid){
  const e=p?.envs[eid]; if(!e) return `<div class="page">${refusal('Not found',{what:'This build does not exist.',need:'A valid link.',fix:'Go back home.',code:'environment.unknown'})}<a class="btn" href="#/home">Home</a></div>`;
  const r=e.rollout, v=e.versions.find(x=>x.n===r.live), back=isDev(p)?`#/p/${p.id}/overview`:'#/testing';
  if(r.state!=='active') return `<div class="page" style="max-width:760px">${refusal('Not available',{what:`${esc(eid)} is ${r.state}.`,need:'The developer to turn it back on.',fix:"You'll be notified when it's back.",code:'rollout.'+r.state},true)}<a class="btn" href="${back}">Back</a></div>`;
  if(!D.unlocked[p.id+'/'+eid]) return `<div class="page" style="max-width:760px">${refusal('Not unlocked',{what:"You haven't opened this build yet.",need:'A quick identity check.',fix:'Open it again to confirm it\'s you.',code:'session.missing'},true)}<button class="btn solid" onclick="unlock('${p.id}','${eid}')">Open</button></div>`;
  return `<div class="page"><div class="row" style="margin-bottom:16px"><a class="eyebrow" href="${back}">← ${isDev(p)?esc(p.name):'Testing'}</a><span class="spacer"></span>${isDev(p)?'':`<span class="envrow">${av(p.owner)}by ${esc(p.owner)}</span>`}<button class="btn solid" onclick="reportModal('${p.id}','${eid}')">${ic('msg')}Report an issue</button></div>
    <div class="stage frame"><div class="bar"><span class="kicker" style="margin:0"><span class="ring live"></span></span><b>${esc(p.name)} · ${esc(eid)} v${v.n}</b><span class="hide-sm row" style="gap:6px">${Object.entries(v.mods).map(([m,x])=>ver(m,x)).join('')}</span><span class="spacer"></span>${fp('view:'+p.id+':'+eid+':'+v.n)}</div><canvas id="game" data-kind="${p.kind}" aria-label="${esc(p.name)} preview"></canvas></div>
    <p class="hint">${ic('shield')} Each piece runs in its own sandbox and can only use what it declared.</p></div>`;
}
function startGame(){
  const c=document.getElementById('game'); if(!c) return; const x=c.getContext('2d'), kind=c.dataset.kind; let t=0;
  const draw=()=>{ if(!document.getElementById('game')) return; const w=c.width=c.clientWidth, h=c.height=c.clientHeight;
    x.fillStyle='#080504'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(233,161,132,.06)'; for(let i=0;i<w;i+=22){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();} for(let j=0;j<h;j+=22){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();}
    if(kind==='Game'){ x.fillStyle='#231915'; x.fillRect(0,h-56,w,56); [[.18,.6],[.42,.45],[.68,.55]].forEach(([a,b])=>{x.fillStyle='#3a2a23';x.fillRect(a*w,b*h,130,12);});
      const px=(t*2.2)%(w+40)-20, py=h-56-26-Math.abs(Math.sin(t/20))*100; x.shadowColor='#e9a184'; x.shadowBlur=18; x.fillStyle='#e9a184'; x.fillRect(px,py,26,26); x.shadowBlur=0;
      x.fillStyle='#a69389'; x.font='11px JetBrains Mono, monospace'; x.fillText('LEVEL 04 · SCORE '+(1200+Math.floor(t/3)),18,26); }
    else if(kind==='Media'){ x.strokeStyle='#e9a184'; x.lineWidth=2; x.beginPath(); for(let i=0;i<w;i+=3){const y=h/2+Math.sin((i+t*4)/40)*60*Math.sin(t/60+i/300);i?x.lineTo(i,y):x.moveTo(i,y);} x.stroke(); x.lineWidth=1; }
    else { x.fillStyle='#1a1210'; x.fillRect(20,20,w*.22,h-40); x.fillStyle='#231915'; for(let i=0;i<6;i++) x.fillRect(32,40+i*34,w*.22-24,20); x.fillStyle='#1a1210'; x.fillRect(w*.22+36,20,w*.78-56,h-40);
      x.fillStyle='rgba(98,214,202,.85)'; x.fillRect(w*.22+56,44,120,28); x.fillStyle='#2b201b'; for(let i=0;i<5;i++) x.fillRect(w*.22+56,96+i*40,(w*.78-96)*(0.5+((i*37+Math.floor(t/90))%5)/10),14); }
    t++; anim=requestAnimationFrame(draw); };
  cancelAnimationFrame(anim); draw(); if(matchMedia('(prefers-reduced-motion: reduce)').matches) cancelAnimationFrame(anim);
}
function reportModal(pid,eid){
  const p=P(pid), e=p.envs[eid], v=e.versions.find(x=>x.n===e.rollout.live);
  modal('Report',`What did you find?`,`<label class="f" for="rT" style="margin-top:4px">In one line</label><input class="input" id="rT" placeholder="e.g. Button does nothing on second tap">
    <label class="f" for="rB">What happened</label><textarea class="input" id="rB" rows="3" placeholder="What you did, what you expected, what you saw"></textarea>
    <label class="f">Who can see it</label><div class="seg" id="rV" role="group" aria-label="Who can see it">${['Public','Team only'].map((o,i)=>`<button type="button" class="${i===0?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${o}</button>`).join('')}</div>
    <p class="hint">${esc(eid)} v${v.n} is attached automatically. You can add a correction later.</p><div id="rMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="sendReport('${pid}','${eid}')">Send to ${esc(p.owner)}</button>`);
}
function sendReport(pid,eid){
  const t=document.getElementById('rT').value.trim(), b=document.getElementById('rB').value.trim(), vis=document.querySelector('#rV .on').textContent;
  if(!t||!b){document.getElementById('rMsg').innerHTML=refusal('A little more, please',{what:'The report is missing details.',need:'A title and what happened.',fix:'Fill in both so the developer can reproduce it.',code:'feedback.empty'});return;}
  const p=P(pid), e=p.envs[eid], r=e.rollout, v=e.versions.find(x=>x.n===r.live), n=Math.max(0,...D.projects.flatMap(q=>q.feedback.map(f=>f.n)))+1, [m,mv]=Object.entries(v.mods)[0];
  p.feedback.unshift({n,title:t,env:eid,v:r.live,mod:m,mv,by:D.me,vis,st:'open',at:'just now',body:b,thread:[]});
  if(isDev(p)) log(pid,'feedback',`reported #${n} on ${eid} v${r.live}`);
  closeLayer(); toast(`Thanks. Report #${n} sent to ${esc(p.owner)}.`); render();
}

/* ======================= DESIGN SYSTEM ======================= */
function vSystem(){
  const laws=[['One answer per screen','The headline is the answer. Read only that and you know where things stand.'],['One next step','A single primary action: the thing to do now, chosen from state.'],['Details on demand','Lists stay short. Depth opens in a drawer, never a maze of pages.'],['We do the hard work','Never ask people to compare, compute or remember. Show the diff, the count, the fingerprint.'],['Numbers carry units','“82 people”, “3 reports”. A bare number is a question.'],["Say what can't be undone",'Only where it matters, in one sentence, before it happens.'],['Refusals explain themselves',"What happened, what's needed, how to fix. Always all three."],['Empty is a starting point','Every empty screen says what goes here and offers the one action that fills it.']];
  const terms=[['Project','flux.remote-project'],['Environment','environment (per project)'],['Environment version','environment head'],['Module version','module record'],['Who can open it','access policy → Flux Access resolver'],['Invited people · tester group','cohort'],['Release · Pause · Resume · Roll back · Close','rollout events'],['Report · Correction','feedback · supersession'],['Fingerprint','environment-view CID'],["Confirm it's you",'signed challenge'],['Encryption key vN','key epoch'],['Not available yet','notBuilt']];
  return `<div class="page"><section style="padding-top:20px">${kicker('Design system')}<h1 class="page-h">Less on screen. <span class="acc">More understood.</span></h1>
    <p class="lede">We do the hard work so people don't have to think about it. These laws decide what earns a place on screen.</p></section>
  <div class="laws">${laws.map(([h,p],i)=>`<div class="law frame"><div class="num">${String(i+1).padStart(2,'0')} / ${String(laws.length).padStart(2,'0')}</div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>
  <div class="split" style="margin-top:16px">
    <div class="panel pad accent-top"><div class="eyebrow">Structure</div><h2>Two levels, nothing deeper</h2>
      <div class="list">${[['Workspace','Home · Explore · Testing','Everything across projects and people'],['Project','Overview · Build · Release · Feedback','One project, switch environments inline'],['Drawer','Versions · diffs · reports · people','Detail without leaving the page'],['Dialog','Create · publish · release · invite','One decision at a time']].map(([a,b,c])=>`<div class="item"><span class="eyebrow" style="width:96px;color:var(--copper)">${a}</span><span style="flex:1"><div class="it">${b}</div><div class="is">${c}</div></span></div>`).join('')}</div></div>
    <div class="panel pad accent-top"><div class="eyebrow">Color</div><h2>Warm dark, few signals</h2>
      <div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[['#110b09','Ground'],['#e9a184','Copper · emphasis'],['#62d6ca','Teal · primary'],['#0d1d29','Navy · secondary'],['#8fdc9f','Green · live'],['#ebbd6a','Amber · paused'],['#f2836f','Red · refused'],['#a69389','Muted'],['#1a1210','Panel']].map(([c,l])=>`<div><div class="sw" style="background:${c}"></div><div class="eyebrow" style="margin-top:6px;font-size:9.5px">${l}</div></div>`).join('')}</div></div>
  </div>
  <div class="panel pad accent-top" style="margin-top:16px"><div class="eyebrow">Components</div><h2>The kit</h2>
    <div class="ctas">${cta('primary','Ready to ship','Release v4',"toast('Primary: one per screen')")}${cta('secondary','Start fresh','New project',"toast('Secondary')",'plus')}</div>
    <div class="row" style="margin-top:18px">${chip('live','Live')}${chip('paused','Paused')}${chip('','Closed')}${chip('revoked','Revoked')}${chip('notyet','Not available yet')}${ver('physics','2.3.1')}${fp('demo')}<button class="btn solid sm">Solid</button><button class="btn sm">Default</button><button class="btn danger sm">Danger</button><button class="btn ghost sm">Ghost</button></div>
    <div class="cards" style="margin-top:18px">${projectCard(D.projects[0])}${exploreCard(P('synth-lab'),'open')}${testingCard(P('cafe-pos'),'staging',P('cafe-pos').envs.staging)}</div>
    ${refusal("Can't publish this version",{what:'“latest” isn\'t an exact version.',need:'An exact number like 1.2.0.',fix:'Enter the exact number.',code:'module.mutable-version'})}</div>
  <div class="panel pad accent-top" style="margin-top:16px"><div class="eyebrow">Handoff</div><h2>Words on screen → protocol</h2><div class="tbl"><table class="t"><tr><th>Users see</th><th>Engineering term</th></tr>${terms.map(([a,b])=>`<tr><td>${a}</td><td class="mono muted" style="font-size:12.5px">${b}</td></tr>`).join('')}</table></div></div>
  </div>${foot()}`;
}

/* ======================= LAYERS ======================= */
let lastFocus=null;
function drawer(title,sub,body,foot){
  lastFocus=document.activeElement;
  document.getElementById('layer').innerHTML=`<div class="scrim" onclick="closeLayer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="dh"><div style="min-width:0"><div class="eyebrow">${sub}</div><h3 id="lt">${esc(title)}</h3></div><button class="xbtn" aria-label="Close" onclick="closeLayer()">${ic('x')}</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}</aside>`;
  setTimeout(()=>document.querySelector('.drawer .xbtn')?.focus(),0);
}
function modal(eyebrow,title,body,foot){
  if(!document.getElementById('layer').innerHTML) lastFocus=document.activeElement;
  document.getElementById('layer').innerHTML=`<div class="scrim"></div><div class="modalw" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="mh"><div class="row"><span class="eyebrow">${eyebrow}</span><button class="xbtn" aria-label="Close" onclick="closeLayer()">${ic('x')}</button></div><h3 id="lt">${esc(title)}</h3></div><div class="mb">${body}</div><div class="mf">${foot}</div></div></div>`;
  setTimeout(()=>(document.querySelector('.modal .refusal')?null:(document.querySelector('.modal input,.modal select,.modal textarea')||document.querySelector('.modal .mf .btn:last-child')))?.focus(),0);
}
function closeLayer(){ if(!document.getElementById('layer').innerHTML) return; document.getElementById('layer').innerHTML=''; if(lastFocus&&document.contains(lastFocus)) lastFocus.focus(); }

/* ======================= TEXTURE · faint labelled grid ======================= */
function texture(){
  const c=document.getElementById('tex'), x=c.getContext('2d'), w=c.width=innerWidth, h=c.height=innerHeight;
  const words=['TERMS','CHECK','RESULT','INTENT','LINK','TRACE','OFFER','SNAPSHOT'];
  x.clearRect(0,0,w,h); x.font='7px JetBrains Mono, monospace';
  let s=7; const rnd=()=>((s=(Math.imul(s^(s>>>15),2246822507)+0x6d2b79f5)>>>0)/4294967296);
  for(let gx=0;gx<w;gx+=66) for(let gy=0;gy<h;gy+=44){ if(rnd()<.3){ x.fillStyle='rgba(255,224,204,.05)'; x.fillText(words[(rnd()*words.length)|0],gx+3,gy+9); }
    if(rnd()<.12){ x.fillStyle=`rgba(255,224,204,${.025+rnd()*.04})`; x.fillRect(gx+22*((rnd()*3)|0),gy+22*((rnd()*2)|0),11,11); } }
}
addEventListener('resize',()=>{clearTimeout(texture.t);texture.t=setTimeout(texture,150);});

/* ======================= RENDER ======================= */
function render(){
  const r=route(); let body;
  if(r[0]==='p'){ const p=P(r[1]); if(!p){ location.hash='#/home'; return; } body=({overview:vOverview,build:vBuild,release:vRelease,feedback:vFeedback}[r[2]||'overview']||vOverview)(p); if(!isDev(p)) return; }
  else if(r[0]==='run') body=vRun(P(r[1]),r[2]);
  else if(r[0]==='explore') body=vExplore();
  else if(r[0]==='testing') body=vTesting();
  else if(r[0]==='system') body=vSystem();
  else body=vHome();
  document.getElementById('app').innerHTML=topBar()+body;
  if(r[0]==='run') startGame();
}
addEventListener('hashchange',()=>{ closeLayer(); closeMenus(); render(); scrollTo(0,0); });
texture(); render();

</script>
