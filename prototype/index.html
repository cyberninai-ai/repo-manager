<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Env</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110b09; --bg-deep:#0b0706; --panel:rgba(28,20,17,.82); --panel-solid:#1a1210; --raise:#231915; --raise2:#2b201b;
  --line:rgba(255,224,204,.08); --line2:rgba(255,224,204,.15); --grid:rgba(255,224,204,.035);
  --text:#f2e9e2; --muted:#a69389; --dim:#6e5f57;
  --copper:#e9a184; --copper2:#c8775a; --copper-glow:rgba(233,161,132,.18);
  --teal:#62d6ca; --teal-ink:#05211e; --teal-soft:#0f2b2a; --teal-line:#1f4a47;
  --navy:#0d1d29; --navy-line:#22405a; --navy-text:#d9e8f3;
  --green:#8fdc9f; --green-soft:#132b1c; --green-line:#2c5a3a;
  --amber:#ebbd6a; --amber-soft:#2e2312; --red:#f2836f; --red-soft:#2e1714;
  --display:'Inter Tight','Inter',system-ui,sans-serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(900px 520px at 18% 8%,rgba(233,161,132,.10),transparent 70%),radial-gradient(800px 600px at 90% 90%,rgba(98,214,202,.05),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55))}
#tex{position:fixed;inset:0;z-index:-1;pointer-events:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono)}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .copper{color:var(--copper)} .green{color:var(--green)} .red{color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .spacer{flex:1}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 40px;background:linear-gradient(var(--bg) 45%,rgba(17,11,9,0))}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font:600 22px var(--display);letter-spacing:.32em}
.brand span{font:500 9.5px var(--mono);letter-spacing:.18em;color:var(--muted);margin-top:5px;white-space:nowrap}
.navpill{display:flex;align-items:center;gap:2px;padding:5px;border-radius:12px;background:rgba(24,17,14,.85);border:1px solid var(--line);backdrop-filter:blur(10px)}
.navpill a,.navpill button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;color:var(--muted);font-size:14px;background:none;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.navpill a:hover,.navpill button:hover{color:var(--text);background:rgba(255,224,204,.04)}
.navpill a.on{color:var(--navy-text);background:var(--navy);border-color:var(--navy-line);box-shadow:inset 0 -2px 0 #4a90c2}
.navpill .badge{font:500 10px var(--mono);background:var(--copper2);color:#1a0d08;border-radius:10px;padding:1px 6px}
.acct{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 10px;color:var(--text);font-size:13px;line-height:1.15}
.acct small{display:block;font:500 9.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.acct small i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
.navpill .runbtn{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal)}
.navpill .runbtn:hover{background:#133634;color:var(--teal)}
.menubtn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:rgba(24,17,14,.85);border:1px solid var(--line);font:600 10.5px var(--mono);letter-spacing:.14em;cursor:pointer;color:var(--text)}
.menubtn .dots{display:flex;gap:3px} .menubtn .dots i{width:4px;height:4px;border-radius:50%;background:var(--text)}
.menu{position:fixed;right:40px;top:70px;width:300px;background:var(--panel-solid);border:1px solid var(--line2);border-radius:12px;padding:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:40;animation:pop .15s}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;background:none;border:0;cursor:pointer;text-align:left}
.menu button:hover{background:var(--raise)}
.menu .t{font-size:14px} .menu .s{font:10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.mnav{display:none}
@media (max-width:1180px){.navpill .lbl-hide{display:none}}
@media (max-width:860px){.top{padding:12px 16px}.navpill{display:none}.mnav{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;position:sticky;top:64px;z-index:29}
 .mnav a{flex:none;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(24,17,14,.9);font-size:13px;color:var(--muted)} .mnav a.on{color:var(--navy-text);background:var(--navy);border-color:var(--navy-line)} .menu{right:16px;left:16px;width:auto;top:64px}}

/* ---------- layout ---------- */
.page{max-width:1320px;margin:0 auto;padding:28px 40px 64px}
@media (max-width:860px){.page{padding:16px 16px 48px}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.02fr);gap:48px;align-items:start;padding-top:20px}
@media (max-width:1100px){.hero{grid-template-columns:minmax(0,1fr);gap:28px}}
.kicker{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.kicker .ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--copper)}
.kicker .ring.live{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(143,220,159,.12)}
.kicker .ring.paused{background:var(--amber);border-color:var(--amber)}
.kicker::after{content:"";width:56px;height:1px;background:var(--line2)}
h1.display{font:600 clamp(44px,5.6vw,88px)/.95 var(--display);letter-spacing:-.055em;margin:0}
.acc{display:inline-block;position:relative;z-index:0;background:linear-gradient(180deg,#f3b89f,#d98466);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.05em}
h1.display .acc::before{content:"";position:absolute;left:-.18em;top:.08em;bottom:.02em;width:calc(100% + .3em);z-index:-1;background:linear-gradient(90deg,rgba(201,119,90,.26),rgba(201,119,90,0) 75%);border-left:2px solid rgba(233,161,132,.55)}
h1.page-h{font:600 clamp(36px,4.4vw,64px)/.98 var(--display);letter-spacing:-.05em;margin:0}
.lede{font-size:17px;line-height:1.6;color:#d8cbc2;max-width:560px;margin:26px 0 30px}
.lede b{color:var(--text);font-weight:600}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta{display:flex;align-items:center;gap:18px;min-width:260px;padding:16px 16px 16px 20px;border-radius:4px;cursor:pointer;text-align:left;border:1px solid transparent;transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-1px)}
.cta small{display:block;font:600 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:5px}
.cta b{font:600 16px var(--sans)}
.cta .arr{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;opacity:.75}
.cta.primary{background:linear-gradient(180deg,#6fdcd0,#4fc4b8);color:var(--teal-ink);box-shadow:0 0 0 1px rgba(98,214,202,.4),0 10px 50px -12px rgba(98,214,202,.55)}
.cta.secondary{background:var(--navy);border-color:var(--navy-line);color:var(--navy-text)}
@media (max-width:640px){.cta{min-width:0;width:100%}}
.textlink{display:inline-flex;gap:6px;align-items:center;margin-top:26px;font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7cc8e8;border:0;border-bottom:1px solid rgba(124,200,232,.35);padding:0 0 4px;cursor:pointer;background:none}
.textlink:hover{color:#a9dcf2}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(6px);position:relative;min-width:0}
.panel.pad{padding:24px}
@media (max-width:640px){.panel.pad{padding:18px}}
.panel h2{font:600 26px/1.15 var(--display);letter-spacing:-.035em;margin:2px 0 18px}
.panel.accent-top::before{content:"";position:absolute;left:24px;top:-1px;width:44px;height:2px;background:var(--copper)}
.inner{background:linear-gradient(180deg,rgba(255,224,204,.025),rgba(255,224,204,.01));border:1px solid var(--line);border-radius:8px}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid rgba(233,161,132,.45);pointer-events:none}
.frame{position:relative}
.frame::before{left:-1px;top:-1px;border-right:0;border-bottom:0} .frame::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;margin-top:40px}
@media (max-width:960px){.grid2,.split{grid-template-columns:minmax(0,1fr)}}

/* ---------- live build diagram ---------- */
.diagram{position:relative;height:300px;margin-top:6px}
.diagram svg.wires{position:absolute;inset:0;width:100%;height:100%}
.wire{fill:none;stroke:rgba(233,161,132,.28);stroke-width:1.2}
.wire.flow{stroke:rgba(233,161,132,.8);stroke-dasharray:3 14;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-34}}
.nodes{position:absolute;left:8px;top:6px;display:flex;flex-direction:column;gap:18px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:92px}
.node .c{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--raise2);border:1px solid var(--line2);color:#e7d6cb}
.node .c svg{width:20px;height:20px}
.node.hot .c{background:radial-gradient(circle,#4a2a1e,#2b1a14);border-color:rgba(233,161,132,.5);color:var(--copper);box-shadow:0 0 30px -4px rgba(233,161,132,.4)}
.node span{font:500 10px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.entry{position:absolute;right:0;top:40px;width:62%;padding:20px 22px;background:linear-gradient(160deg,rgba(54,39,33,.94),rgba(36,26,22,.94));border:1px solid var(--line2);border-radius:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.entry .big{font:500 38px/1.1 var(--mono);color:var(--green);letter-spacing:-.02em;margin:10px 0 4px}
.entry .okc{position:absolute;right:20px;top:46px;width:50px;height:50px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);background:var(--green-soft)}
.entry .okc.p{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.entry .okc svg{width:24px;height:24px;stroke-width:2.4}
.checks{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ck{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);color:#2a140c;background:linear-gradient(180deg,#f0ae90,#d88565);box-shadow:0 0 14px -3px rgba(233,161,132,.6)}
.quote{font-size:16px;margin:10px 4px 0}
@media (max-width:640px){.diagram{height:auto}.diagram svg.wires{display:none}.nodes{position:static;flex-direction:row;justify-content:space-around;margin-bottom:16px}.node{width:auto}.entry{position:static;width:auto}.entry .big{font-size:30px}}

/* ---------- stepper ---------- */
.stepper{display:flex;align-items:flex-start;margin:22px 4px 4px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:13px;color:var(--muted);text-align:center}
.step::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:1.5px;background:var(--line2);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:linear-gradient(90deg,var(--green-line),#4f9b62)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg-deep);border:1.5px solid var(--line2);z-index:1;font:500 10.5px var(--mono);color:var(--muted)}
.step.done .dot{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
.step.cur .dot{border-color:var(--copper);color:var(--copper);box-shadow:0 0 0 4px var(--copper-glow)}
.step.cur,.step.done{color:var(--text)}
.step .dot svg{width:13px;height:13px;stroke-width:2.6}
@media (max-width:480px){.step{font-size:11px}}

/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);margin-top:48px;padding-top:22px}
@media (max-width:960px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .eyebrow{font-size:10.5px}
.stat .n{font:600 30px var(--display);letter-spacing:-.03em;margin-top:6px}
.stat .n small{font:400 11px var(--mono);color:var(--muted);letter-spacing:.02em;margin-left:5px}
.stat .d{font-size:12px;color:var(--dim);margin-top:2px}

/* ---------- tiles, lists ---------- */
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.015);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--line2);background:rgba(255,224,204,.035)}
.ti{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--raise2);border:1px solid var(--line);color:var(--copper);flex:none}
.tile .tt{font-size:16px;font-weight:500}
.tile .ts{font:500 10.5px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.tile .go{margin-left:auto;color:var(--dim)}
.list .item{display:flex;align-items:center;gap:14px;padding:14px 4px;border:0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left}
.list .item:first-child{border-top:0}
.list button.item:hover .it{color:var(--copper)}
.list div.item{cursor:default}
.list .it{font-weight:500;transition:color .15s}
.list .is{font:500 10.5px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.vbig{font:500 22px var(--mono);color:var(--text);width:52px;flex:none}
@media (max-width:640px){.hide-sm{display:none!important}}

/* ---------- chips & buttons ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.live{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.chip.paused{color:var(--amber);border-color:rgba(235,189,106,.35);background:var(--amber-soft)}
.chip.revoked{color:var(--red);border-color:rgba(242,131,111,.35);background:var(--red-soft)}
.chip.deprecated{color:var(--amber)}
.chip.notyet{border-style:dashed}
.ver{display:inline-flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden;font:500 11px var(--mono);white-space:nowrap;vertical-align:middle}
.ver b{font-weight:500;padding:1px 7px;background:var(--raise);color:var(--muted)} .ver span{padding:1px 7px;color:var(--text)}
.fp{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--mono);color:var(--green);cursor:pointer;border:0;border-bottom:1px dashed rgba(143,220,159,.35);background:none;padding:0}
.fp svg{width:11px;height:11px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raise2)}
.btn.solid{background:linear-gradient(180deg,#6fdcd0,#4fc4b8);border-color:transparent;color:var(--teal-ink)}
.btn.danger{color:var(--red);border-color:rgba(242,131,111,.35);background:var(--red-soft)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);background:var(--raise)}
.btn.sm{padding:5px 11px;font-size:13px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.2)}
.seg button{background:none;border:0;padding:6px 14px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:13px}
.seg button.on{background:var(--raise2);color:var(--text)}
.input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;line-height:1.4}
.input:focus{outline:none;border-color:var(--teal-line);box-shadow:0 0 0 3px rgba(98,214,202,.12)}
select.input option{background:var(--panel-solid)}
label.f{display:block;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 7px}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px;display:flex;gap:6px;align-items:center}

/* ---------- refusal (archive frame) ---------- */
.refusal{position:relative;margin:16px 0;border:1px solid rgba(242,131,111,.3);background:linear-gradient(180deg,rgba(242,131,111,.07),rgba(242,131,111,.02));clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.refusal.warn{border-color:rgba(235,189,106,.3);background:linear-gradient(180deg,rgba(235,189,106,.07),rgba(235,189,106,.02))}
.refusal .rh{font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red);padding:10px 16px;border-bottom:1px solid rgba(242,131,111,.18);background:rgba(242,131,111,.06)}
.refusal.warn .rh{color:var(--amber);border-color:rgba(235,189,106,.18);background:rgba(235,189,106,.06)}
.refusal dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 16px;margin:0;padding:14px 16px}
.refusal dt{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.refusal dd{margin:0;font-size:14px}
.refusal .code{font:10.5px var(--mono);color:var(--dim);padding:0 16px 12px;letter-spacing:.06em}
@media (max-width:640px){.refusal dl{grid-template-columns:minmax(0,1fr);gap:2px}.refusal dd{margin-bottom:8px}}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl .ev{position:relative;padding:8px 0}
.tl .ev::before{content:"";position:absolute;left:-24px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--bg-deep);border:1.5px solid var(--muted)}
.tl .ev.g::before{border-color:var(--green);background:var(--green-soft)} .tl .ev.a::before{border-color:var(--amber)} .tl .ev.r::before{border-color:var(--red);background:var(--red-soft)}
.tl .when{font:10.5px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

/* ---------- drawer, modal, toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,3,2,.6);backdrop-filter:blur(3px);z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--panel-solid);border-left:1px solid var(--line2);z-index:51;display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 80px rgba(0,0,0,.5)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer .dh{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dh h3,.modal .mh h3{font:600 24px/1.15 var(--display);letter-spacing:-.03em;margin:6px 0 0}
.drawer .db{padding:20px 24px;overflow:auto;flex:1}
.drawer .df{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.xbtn:hover{color:var(--text)}
.modalw{position:fixed;inset:0;z-index:52;display:grid;place-items:start center;padding:9vh 16px 16px;overflow:auto}
.modal{width:100%;max-width:580px;background:var(--panel-solid);border:1px solid var(--line2);border-radius:12px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.modal .mh{padding:20px 24px 0} .modal .mb{padding:8px 24px 20px} .modal .mf{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;padding:11px 16px;border-radius:10px;background:rgba(36,26,22,.97);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:14px;animation:pop .18s}
.toast svg{color:var(--green)}

/* ---------- report cards ---------- */
.card{border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.02);margin-bottom:12px}
.card .ch{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.card .cb{padding:12px 14px}
.card.orig{border-color:rgba(233,161,132,.25)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:600 10px var(--sans);color:#1a0d08;flex:none;vertical-align:middle}

/* ---------- tester run ---------- */
.stage{border:1px solid var(--line2);border-radius:10px;background:#080504}
.stage .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(36,26,22,.8);border-radius:10px 10px 0 0}
.stage canvas{display:block;width:100%;height:440px;border-radius:0 0 10px 10px}
@media (max-width:640px){.stage canvas{height:300px}}

/* ---------- system ---------- */
.laws{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.law{padding:20px;border:1px solid var(--line);border-radius:8px;background:rgba(255,224,204,.015)}
.law .num{font:500 11px var(--mono);color:var(--copper);letter-spacing:.12em}
.law h4{font:600 19px/1.2 var(--display);letter-spacing:-.025em;margin:10px 0 6px}
.law p{margin:0;color:var(--muted);font-size:14px}
.sw{height:56px;border-radius:8px;border:1px solid var(--line2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl{overflow-x:auto}
tr.d-add td:first-child{box-shadow:inset 2px 0 var(--green)} tr.d-chg td:first-child{box-shadow:inset 2px 0 var(--amber)} tr.d-del td:first-child{box-shadow:inset 2px 0 var(--red)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 40px 28px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.foot a:hover{color:var(--text)}
@media (max-width:860px){.foot{padding:16px}}

function hash(s){let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0;}let o='',x=h;for(let i=0;i<5;i++){x=Math.imul(x^(x>>>13),0x5bd1e995)>>>0;o+=x.toString(16).padStart(8,'0');}return o;}
const fp=k=>{const h=hash(k);return `<button class="fp" data-copy="${h}" title="Fingerprint · copy full value">#${h.slice(0,4)}${ic('copy')}</button>`;};
const COL={mara:'#e9a184',devon:'#7cc8e8',jo:'#d7a6e8','tester-07':'#8fdc9f','tester-22':'#ebbd6a'};
const av=u=>`<span class="av" style="background:${COL[u]||'#b9a79c'}" aria-hidden="true">${esc(u[0].toUpperCase())}</span>`;

  return `<div class="page"><section class="hero">

      <h1 class="display">${head[0]}<br><span class="acc">${head[1]}</span></h1>

    </div>
    <div class="panel pad accent-top">
      <div class="eyebrow">The live build</div><h2>Every tester gets exactly this.</h2>
      <div class="inner" style="padding:18px">
        <div class="diagram">
          <svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

          </svg>
          <div class="nodes">${D.modules.map((m,i)=>`<div class="node ${i===1?'hot':''}"><span class="c">${ic(m.icon)}</span><span>${m.name}</span></div>`).join('')}</div>
          <div class="entry"><div class="row"><span class="eyebrow" style="color:var(--text)">Playtest</span><span class="spacer"></span><span class="eyebrow">v${r.live} / ${nv}</span></div>

            <div class="mono muted" style="font-size:12px">↳ ${live.n>1?'follows v'+(live.n-1):'first version'} · ${Object.keys(live.mods).length} modules</div>

            <div class="checks"><span class="eyebrow" style="margin-right:6px">Checks</span>${[['S','Signed'],['E','Encrypted'],['A','Access checked'],['B','Sandboxed']].map(([a,t])=>`<span class="ck" title="${t}" aria-label="${t}">${a}</span>`).join('')}</div>
          </div>
        </div>
        <p class="quote">“${esc(g.name)} get ${Object.entries(live.mods).map(([m,v])=>mod(m).name.toLowerCase()+' '+v).join(', ')}.”</p>
      </div>
      ${stepper(steps)}
    </div></section>
    <div class="stats">
      ${stat('Live · playtest','v'+r.live,`of ${nv}`, r.state==='active'?'Released '+r.events.filter(x=>x.a==='release'||x.a==='rollback').at(-1).at:'Not serving')}
      ${stat('Testers',g.people,'people',g.name)}
      ${stat('Open feedback',open,'reports',open?'Newest '+openFb()[0].at:'All clear')}
      ${stat('Modules',D.modules.length,'pinned','Exact versions only')}
      ${stat('Rollbacks',r.events.filter(x=>x.a==='rollback').length,'total','History kept in full')}
    </div></div>${foot()}`;
}

/* ======================= BUILD ======================= */
function vBuild(){
  const env=D.buildEnv, e=E(env), live=e.rollout.live;
  return `<div class="page"><section style="padding-top:20px">
    ${kicker('Build · '+D.project)}
    <h1 class="page-h">${D.modules.length} modules. <span class="acc">One exact build.</span></h1>
    <p class="lede">Publish modules, then pin them together as a version. Nothing reaches testers until you release it.</p>
    <div class="ctas">${cta('primary','Next version',`Compose v${newest(env)+1}`,`composeModal('${env}')`)}${cta('secondary','New file','Publish a module',"publishModal()")}</div></section>
  <div class="split">
    <div class="panel pad accent-top"><div class="eyebrow">Modules</div><h2>The pieces</h2>
      <div class="tiles">${D.modules.map(m=>{const nv=m.versions.filter(v=>v.st!=='revoked').at(-1);return `<button class="tile" onclick="openModule('${m.id}')"><span class="ti">${ic(m.icon)}</span><span><div class="tt">${m.name}</div><div class="ts">${m.id} · v${nv.v} · ${nv.size}</div></span><span class="go">${ic('arrow')}</span></button>`;}).join('')}</div></div>
    <div class="panel pad accent-top"><div class="row"><span class="eyebrow">Versions</span><span class="spacer"></span><div class="seg" role="group" aria-label="Environment">${Object.keys(D.envs).map(k=>`<button class="${k===env?'on':''}" onclick="D.buildEnv='${k}';render()">${k}</button>`).join('')}</div></div><h2>${env}</h2>
      <div class="list">${e.versions.slice().reverse().map(v=>`<button class="item" onclick="openCompare('${env}',${v.n})"><span class="vbig">v${v.n}</span><span style="flex:1;min-width:0"><div class="it">${esc(v.note)}</div><div class="is">${v.by} · ${v.at} · ${Object.keys(v.mods).length} modules</div></span>${v.n===live?chip(stCls(e.rollout.state),e.rollout.state==='active'?'Live':e.rollout.state):''}<span class="dim">${ic('arrow')}</span></button>`).join('')}</div></div>
  </div></div>${foot()}`;
}
function diffTable(a,b){
  const ids=[...new Set([...Object.keys(a||{}),...Object.keys(b)])];
  return `<div class="tbl"><table class="t"><tr><th>Module</th><th>Before</th><th>After</th></tr>${ids.map(id=>{const o=a?.[id],n=b[id],k=!o?'add':!n?'del':o!==n?'chg':'same';
    return `<tr class="d-${k}"><td>${mod(id).name}</td><td class="mono ${k==='same'?'dim':''}">${o||'—'}</td><td class="mono">${n||'<span class="red">removed</span>'}${k!=='same'?` <span class="chip ${k==='add'?'live':k==='del'?'revoked':'paused'}" style="margin-left:6px">${{add:'new',chg:'changed',del:'removed'}[k]}</span>`:''}</td></tr>`;}).join('')}</table></div>`;
}
function openCompare(env,n){
  const e=E(env), v=e.versions.find(x=>x.n===n), p=e.versions.find(x=>x.n===n-1), r=e.rollout;
  drawer(`${env} · v${n}`,esc(v.note),`
    <div class="row" style="margin-bottom:18px">${n===r.live?chip(stCls(r.state),r.state==='active'?'Live now':'Live · '+r.state):chip('','Not live')}<span class="muted" style="font-size:13px">${v.by} · ${v.at}</span><span class="spacer"></span>${fp('view:'+env+':'+n)}</div>
    <div class="eyebrow" style="margin-bottom:8px">${p?'Compared with v'+p.n:'First version'}</div>${diffTable(p?.mods,v.mods)}`,
    n>r.live&&r.state!=='closed'?`<button class="btn solid" onclick="releaseModal('${env}',${n})">${ic('play')}Release v${n}</button>`:n<r.live&&r.state!=='closed'?`<button class="btn" onclick="rollbackModal('${env}',${n})">${ic('undo')}Roll back to v${n}</button>`:'');
}
function openModule(id){
  const m=mod(id);
  drawer(m.name,`${m.id} · ${m.kind}`,`<div class="list">${m.versions.slice().reverse().map(v=>`<div class="item"><span class="vbig" style="width:76px;font-size:18px">${v.v}</span><span style="flex:1;min-width:0"><div class="it">${esc(v.notes)}</div><div class="is">${v.by} · ${v.at} · ${v.size}</div></span>
      ${v.st!=='active'?chip(v.st,v.st):`<button class="btn ghost sm" onclick="revokeModal('${m.id}','${v.v}')">Revoke</button>`}</div>`).join('')}</div>
    <p class="hint" style="margin-top:16px">${ic('lock')} Versions never change once published. Publish a new one to fix something.</p>`,
    `<button class="btn solid" onclick="publishModal('${m.id}')">${ic('upload')}Publish new version</button>`);
}

/* ======================= RELEASE ======================= */
const EVT={release:['released','g'],pause:['paused','a'],resume:['resumed','g'],rollback:['rolled back to','r'],close:['closed','']};
function vRelease(){
  const env=D.relEnv, e=E(env), r=e.rollout, g=D.groups[r.group], nv=newest(env);
  const head = r.state==='active'?[`v${r.live} is`,'live.']:r.state==='paused'?['Paused','on v'+r.live+'.']:['Closed.','Nothing is live.'];
  let primary;
  if(r.state==='closed') primary=cta('primary','Start again','New rollout',"toast('A new rollout can start from any version')");
  else if(nv>r.live) primary=cta('primary','Ready to ship',`Release v${nv}`,`releaseModal('${env}',${nv})`);
  else if(r.state==='paused') primary=cta('primary','Back on',`Resume v${r.live}`,`act('${env}','resume')`);
  else primary=cta('secondary','Stop new sessions','Pause',`act('${env}','pause')`);
  const evs=r.events.slice().reverse();
  return `<div class="page"><section class="hero">
    <div><div class="row" style="margin-bottom:22px">${kicker('Release',stCls(r.state),'margin:0')}<span class="spacer"></span><div class="seg" role="group" aria-label="Environment">${Object.keys(D.envs).map(k=>`<button class="${k===env?'on':''}" onclick="D.relEnv='${k}';D.allEv=false;render()">${k}</button>`).join('')}</div></div>
      <h1 class="display">${head[0]}<br><span class="acc">${head[1]}</span></h1>
      <p class="lede">${r.state==='closed'?'Feedback and history stay readable.':`<b>${esc(g.name)}</b> · ${esc(g.rule)} · ${g.people} people. Anyone mid-session finishes first.`}</p>
      <div class="ctas">${primary}</div>
      ${r.state!=='closed'?`<div class="row" style="margin-top:22px">${r.live>1?`<button class="btn" onclick="rollbackModal('${env}')">${ic('undo')}Roll back</button>`:''}${r.state==='active'&&nv>r.live?`<button class="btn" onclick="act('${env}','pause')">${ic('pause')}Pause</button>`:''}<button class="btn ghost" onclick="closeRollout('${env}')">Close rollout</button></div>`:''}
    </div>
    <div class="panel pad accent-top"><div class="eyebrow">Timeline · ${env}</div><h2>Every change, kept.</h2>
      <div class="tl">${evs.slice(0,D.allEv?99:4).map(ev=>`<div class="ev ${EVT[ev.a][1]}"><div>${av(ev.by)} <b>${ev.by}</b> ${EVT[ev.a][0]} ${ev.a==='close'?'the rollout':'<b>v'+ev.v+'</b>'}</div>${ev.reason?`<div class="muted" style="font-size:14px;margin:2px 0">“${esc(ev.reason)}”</div>`:''}<div class="when">${ev.at}</div></div>`).join('')}</div>
      ${evs.length>4?`<button class="textlink" style="margin-top:14px" onclick="D.allEv=!D.allEv;render()">${D.allEv?'Show less':'Show all '+evs.length}</button>`:''}
    </div></section>
    <div class="stats">${stat('Live version','v'+r.live,`of ${nv}`,r.state==='active'?'Serving':'Not serving')}${stat('Audience',g.people,'people',esc(g.name))}${stat('Fingerprint','#'+hash('view:'+env+':'+r.live).slice(0,4),'','What testers see')}${stat('Releases',r.events.filter(x=>x.a==='release').length,'total','')}${stat('Rollbacks',r.events.filter(x=>x.a==='rollback').length,'total','')}</div>
  </div>${foot()}`;
}
function act(env,a,extra={}){
  const r=E(env).rollout, v=extra.v??r.live;
  r.events.push({a,v,by:D.me,at:'just now',reason:extra.reason});
  if(a==='pause')r.state='paused'; if(['resume','release','rollback'].includes(a))r.state='active'; if(a==='close')r.state='closed'; if(a==='release'||a==='rollback')r.live=v;
  log('release',`${EVT[a][0]} ${env}${a==='close'?'':' v'+v}`);
  closeLayer(); toast({pause:`${env} paused`,resume:`${env} v${v} is back on`,release:`${env} v${v} is live`,rollback:`${env} is back on v${v}`,close:`${env} rollout closed`}[a]); render();
}
function releaseModal(env,n){
  const e=E(env), r=e.rollout, g=D.groups[r.group];
  modal('Ship it',`Release ${env} v${n}?`,`<p class="muted" style="margin-top:0">${esc(g.name)} (${g.people} people) get it on their next session.</p>${diffTable(e.versions.find(x=>x.n===r.live).mods,e.versions.find(x=>x.n===n).mods)}`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="act('${env}','release',{v:${n}})">${ic('play')}Release v${n}</button>`);
}
function rollbackModal(env,pre){
  const e=E(env), r=e.rollout, opts=e.versions.filter(x=>x.n<r.live).reverse();
  modal('Roll back',`Return ${env} to an earlier version`,`<label class="f" for="rbV" style="margin-top:4px">Version</label><select class="input" id="rbV">${opts.map(x=>`<option value="${x.n}" ${x.n===pre?'selected':''}>v${x.n} · ${esc(x.note)}</option>`).join('')}</select>
    <label class="f" for="rbR">Why? · shown in the timeline</label><input class="input" id="rbR" placeholder="e.g. Level 4 crashes after reload"><div id="rbMsg"></div>
    <p class="hint">Nothing is deleted. You can release v${r.live} again any time.</p>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRollback('${env}')">${ic('undo')}Roll back</button>`);
}
function doRollback(env){const reason=document.getElementById('rbR').value.trim(); if(!reason){document.getElementById('rbMsg').innerHTML=refusal('Reason needed',{what:'Rollbacks without a reason are refused.',need:'One line your team and testers can read.',fix:'Say what went wrong.',code:'rollout.reason-required'});return;} act(env,'rollback',{v:+document.getElementById('rbV').value,reason});}
function closeRollout(env){
  modal('Final step',`Close the ${env} rollout?`,`<p class="muted" style="margin-top:0">Nobody can open ${env} after this. Feedback and history stay.</p><label class="f" for="clC">Type ${env} to confirm</label><input class="input" id="clC" autocomplete="off"><div id="clMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="confirmClose('${env}')">Close rollout</button>`);
}
function confirmClose(env){ if(document.getElementById('clC').value===env) act(env,'close'); else document.getElementById('clMsg').innerHTML=refusal('Not confirmed',{what:"The name doesn't match.",need:'The environment name, exactly.',fix:`Type ${env}.`,code:'confirm.mismatch'}); }

/* ======================= COMPOSE / PUBLISH / REVOKE ======================= */
function composeModal(env){
  const cur=E(env).versions.at(-1);
  modal(`Compose · ${env}`,`Version ${cur.n+1}`,`<p class="muted" style="margin-top:0">Pick one exact version of each module.</p>
    ${D.modules.map(m=>`<label class="f" for="cm-${m.id}">${m.name}</label><select class="input cm" id="cm-${m.id}" data-m="${m.id}"><option value="">Leave out</option>${m.versions.slice().reverse().map(v=>`<option value="${v.v}" ${cur.mods[m.id]===v.v?'selected':''} ${v.st==='revoked'?'disabled':''}>${v.v}${v.st==='revoked'?' · revoked':''}</option>`).join('')}</select>`).join('')}
    <label class="f" for="cmN">What changed?</label><input class="input" id="cmN" placeholder="One line"><div id="cmMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doCompose('${env}')">Save v${cur.n+1}</button>`);
}
function doCompose(env){
  const e=E(env), cur=e.versions.at(-1), mods={}; document.querySelectorAll('.cm').forEach(s=>{if(s.value)mods[s.dataset.m]=s.value;});
  const out=document.getElementById('cmMsg');
  if(!Object.keys(mods).length){out.innerHTML=refusal('Empty version',{what:'No modules are selected.',need:'At least one module.',fix:'Pick a version for a module.',code:'environment.empty'});return;}
  if(JSON.stringify(Object.entries(mods).sort())===JSON.stringify(Object.entries(cur.mods).sort())){out.innerHTML=refusal('Nothing changed',{what:`This is the same as v${cur.n}.`,need:'At least one different module version.',fix:`Change a version, or release v${cur.n} as it is.`,code:'environment.identical'});return;}
  e.versions.push({n:cur.n+1,mods,by:D.me,at:'just now',note:document.getElementById('cmN').value.trim()||'Updated modules'}); log('build',`composed ${env} v${cur.n+1}`);
  closeLayer(); toast(`${env} v${cur.n+1} saved. Release it when you're ready.`); render();
}
function publishModal(pre){
  modal('Publish','New module version',`<label class="f" for="pmM" style="margin-top:4px">Module</label><select class="input" id="pmM">${D.modules.map(m=>`<option value="${m.id}" ${m.id===pre?'selected':''}>${m.name} · ${m.id}</option>`).join('')}</select>
    <label class="f" for="pmV">Version</label><input class="input" id="pmV" placeholder="1.2.0" style="max-width:200px">
    <label class="f">File</label><button class="tile" id="pmF" onclick="pickFile(this)"><span class="ti">${ic('upload')}</span><span><div class="tt">Choose a file</div><div class="ts">Encrypted on your device first</div></span></button>
    <div id="pmMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="doPublish()">${ic('upload')}Publish</button>`);
}
function pickFile(el){ el.dataset.ok=1; el.querySelector('.tt').textContent='build.wasm'; el.querySelector('.ts').textContent='191 KB · ready'; }
function doPublish(){
  const id=document.getElementById('pmM').value, v=document.getElementById('pmV').value.trim(), out=document.getElementById('pmMsg'), m=mod(id);
  if(!/^\d+\.\d+\.\d+$/.test(v)){out.innerHTML=refusal("Can't publish this version",{what:v?`“${esc(v)}” isn't an exact version.`:'No version entered.',need:'An exact number like 1.2.0.',fix:'Words like “latest” and ranges like “^1.2” can change later, so they can\'t be published.',code:'module.mutable-version'});return;}
  if(m.versions.some(x=>x.v===v)){out.innerHTML=refusal('Version already used',{what:`${id} ${v} exists.`,need:'A new number.',fix:'Published versions never change. Try '+v.replace(/(\d+)$/,d=>+d+1)+'.',code:'module.version-reuse'});return;}
  if(!document.getElementById('pmF').dataset.ok){out.innerHTML=refusal('No file',{what:'Nothing is attached.',need:'The built file.',fix:'Choose the file for this version.',code:'artifact.missing'});return;}
  m.versions.push({v,size:'191 KB',by:D.me,at:'just now',st:'active',notes:'New version'}); log('build',`published ${id} ${v}`); closeLayer(); toast(`${m.name} ${v} published`); render();
}
function revokeModal(id,v){
  modal('Permanent',`Revoke ${id} ${v}?`,`<p class="muted" style="margin-top:0">It can't be added to new versions or downloaded again.</p>${refusal("Copies already downloaded stay",{what:'Testers who opened it keep their copy.',need:'Nothing from you here.',fix:'If it held a secret, rotate that secret.'},true)}
    <label class="f" for="rvR">Why?</label><input class="input" id="rvR" placeholder="e.g. Unlicensed audio"><div id="rvMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRevoke('${id}','${v}')">Revoke</button>`);
}
function doRevoke(id,v){ if(!document.getElementById('rvR').value.trim()){document.getElementById('rvMsg').innerHTML=refusal('Reason needed',{what:'Revokes without a reason are refused.',need:'One line for the history.',fix:'Say why it is being revoked.',code:'module.reason-required'});return;}
  mod(id).versions.find(x=>x.v===v).st='revoked'; log('access',`revoked ${id} ${v}`); closeLayer(); toast(`${id} ${v} revoked`); render(); }

/* ======================= FEEDBACK ======================= */
function vFeedback(){
  const open=openFb(), list=D.fbTab==='open'?open:D.feedback.filter(f=>f.st!=='open');
  return `<div class="page"><section style="padding-top:20px">${kicker('Feedback · playtest')}
    <h1 class="page-h">${open.length?`${open.length} report${open.length>1?'s':''} <span class="acc">need${open.length>1?'':'s'} you.</span>`:`All clear. <span class="acc">Nothing waiting.</span>`}</h1>
    <p class="lede">Every report is tied to the exact version the tester had open.</p></section>
  <div class="panel pad accent-top"><div class="row" style="margin-bottom:6px"><div class="seg" role="group" aria-label="Filter"><button class="${D.fbTab==='open'?'on':''}" onclick="D.fbTab='open';render()">Open · ${open.length}</button><button class="${D.fbTab==='done'?'on':''}" onclick="D.fbTab='done';render()">Done · ${D.feedback.length-open.length}</button></div></div>
    <div class="list">${list.map(f=>`<button class="item" onclick="openReport(${f.n})">${av(f.by)}<span style="flex:1;min-width:0"><div class="it">${esc(f.title)}</div><div class="is">#${f.n} · ${f.at} · ${f.env} v${f.v}${f.vis!=='Public'?' · '+f.vis:''}</div></span><span class="hide-sm">${ver(f.mod,f.mv)}</span>${f.thread.some(t=>t.k==='reply')?`<span class="dim" title="You replied">${ic('msg')}</span>`:''}<span class="dim">${ic('arrow')}</span></button>`).join('')||`<div class="muted" style="padding:28px 4px">Nothing here.</div>`}</div>
  </div></div>${foot()}`;
}
function openReport(n){
  const f=D.feedback.find(x=>x.n===n);
  drawer(f.title,`Report #${f.n} · ${f.env} v${f.v}`,`
    <div class="row" style="margin-bottom:16px">${chip(f.st==='open'?'live':'',f.st==='open'?'Open':'Done')}${ver(f.mod,f.mv)}<span class="muted" style="font-size:13px">${f.vis}</span><span class="spacer"></span>${fp('view:'+f.env+':'+f.v)}</div>
    <div class="card orig frame"><div class="ch">${av(f.by)}<b>${f.by}</b><span class="muted">${f.at}</span><span class="spacer"></span><span class="eyebrow" style="font-size:9.5px;display:flex;gap:4px;align-items:center">${ic('lock')} Original</span></div><div class="cb">${esc(f.body)}</div></div>
    ${f.thread.map(t=>t.k==='status'?`<div class="eyebrow" style="margin:10px 0 12px 4px">${t.by} marked it ${t.to==='done'?'done':'open'} · ${t.at}</div>`:`<div class="card"><div class="ch">${av(t.by)}<b>${t.by}</b><span class="muted">${t.at}</span>${t.k==='correction'?'<span class="chip paused" style="margin-left:auto">Correction</span>':''}</div><div class="cb">${esc(t.body)}</div></div>`).join('')}
    <label class="f" for="rp">Reply</label><textarea class="input" id="rp" rows="3" placeholder="Ask, thank, or say what's fixed"></textarea>`,
    `${f.st==='open'?`<button class="btn" onclick="setFb(${n},'done')">${ic('check')}Mark done</button>`:`<button class="btn" onclick="setFb(${n},'open')">Reopen</button>`}<button class="btn solid" onclick="reply(${n})">Send reply</button>`);
}
function setFb(n,s){const f=D.feedback.find(x=>x.n===n);f.st=s;f.thread.push({k:'status',by:D.me,at:'just now',to:s});log('feedback',`marked #${n} ${s}`);closeLayer();toast(`#${n} ${s==='done'?'marked done':'reopened'}`);render();}
function reply(n){const t=document.getElementById('rp').value.trim();if(!t){document.getElementById('rp').focus();toast('Write a reply first');return;}D.feedback.find(x=>x.n===n).thread.push({k:'reply',by:D.me,at:'just now',body:t});openReport(n);toast('Reply sent');render();}

/* ======================= MENU DRAWERS ======================= */
function openActivity(){
  document.getElementById('menu')?.remove();
  drawer('Activity','Everything that happened · permanent',`<div class="tl">${D.activity.map(a=>`<div class="ev ${a.k==='release'?'g':a.k==='access'?'a':''}"><div>${av(a.who)} <b>${a.who}</b> ${esc(a.t)}</div><div class="when">${a.at} · ${a.k}</div></div>`).join('')}</div>`,'');
}
function openPeople(){
  document.getElementById('menu')?.remove();
  drawer('People & keys','Who can work on '+D.project,`<div class="list">${D.members.map(m=>`<div class="item">${av(m.u)}<span style="flex:1"><div class="it">${m.u}</div><div class="is">${m.r}</div></span>${m.r!=='Owner'?`<button class="btn ghost sm" onclick="removeMember('${m.u}')">Remove</button>`:''}</div>`).join('')}</div>
    <div class="eyebrow" style="margin:26px 0 10px">Encryption key</div>
    <div class="row"><div class="stat"><div class="n" style="margin:0">v${D.keys[0].n}<small>current</small></div></div><span class="spacer"></span><button class="btn sm" onclick="rotateKey()">Rotate now</button></div>
    <p class="hint">${esc(D.keys[0].why)} · ${D.keys[0].at}. Rotates by itself when someone loses access.</p>
    <p class="hint">${ic('shield')} Access is decided by Flux Access. If it can't be reached, actions are refused, not allowed.</p>`,'');
}
function rotateKey(){ D.keys.unshift({n:D.keys[0].n+1,at:'just now',why:'Manual rotation'}); log('access','rotated the encryption key'); openPeople(); toast('Key rotated'); }
function removeMember(u){
  modal('Remove access',`Remove ${u}?`,`<p class="muted" style="margin-top:0">${u} loses access now and the key rotates.</p>${refusal("Some things can't be taken back",{what:`Anything ${u} already downloaded stays with them.`,need:'Nothing from you here.',fix:'Rotate any secrets they could see.'},true)}`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn danger" onclick="doRemove('${u}')">Remove ${u}</button>`);
}
function doRemove(u){ D.members=D.members.filter(m=>m.u!==u); D.keys.unshift({n:D.keys[0].n+1,at:'just now',why:`${u} removed`}); log('access',`removed ${u}`); closeLayer(); toast(`${u} removed · key rotated`); }

/* ======================= TESTER ======================= */
function vInbox(){
  const live=D.inbox.filter(i=>i.st==='live').length;
  return `<div class="page" style="max-width:1040px"><section style="padding-top:20px">${kicker('Tester inbox','live')}
    <h1 class="page-h">${live===1?'One build is':live+' builds are'} <span class="acc">waiting for you.</span></h1>
    <p class="lede">Open it, play, and report what you find. We attach the exact version for you.</p></section>
  <div class="panel pad accent-top"><div class="list">${D.inbox.map((b,i)=>`<div class="item" style="padding:18px 4px"><span class="ti">${ic('cube')}</span>
      <span style="flex:1;min-width:0"><div class="it" style="font-size:17px">${b.proj} <span class="muted" style="font-weight:400">· ${b.env}</span></div><div class="is">from ${b.from}${b.st==='live'?'':' · '+(b.st==='paused'?'paused':'access removed')}</div>${b.note?`<div class="muted" style="font-size:14px;margin-top:6px">“${esc(b.note)}”</div>`:''}</span>
      ${b.st==='live'?`<button class="btn solid" onclick="unlock(${i})">${ic('play')}Open</button>`:b.st==='paused'?chip('paused','Paused'):`<button class="btn ghost sm" onclick="whyRevoked(${i})">Why?</button>`}</div>`).join('')}</div></div>
  <div class="panel pad" style="margin-top:16px"><div class="eyebrow">Your reports</div><div class="list" style="margin-top:8px">${D.feedback.filter(f=>f.by==='tester-07').slice(0,3).map(f=>`<div class="item"><span style="flex:1"><div class="it">${esc(f.title)}</div><div class="is">${f.env} v${f.v} · ${f.st==='open'?'open':'done'}${f.thread.some(t=>t.k==='reply')?' · developer replied':''}</div></span></div>`).join('')}</div></div></div>${foot()}`;
}
function whyRevoked(i){const b=D.inbox[i];modal('Access',`Can't open ${b.proj}`,refusal('Access removed',{what:`${b.from} removed your access to ${b.proj}.`,need:'A new invite.',fix:`Ask ${b.from} if this is a mistake.`,code:'access.revoked'}),`<button class="btn" onclick="closeLayer()">OK</button>`);}
function unlock(i){
  const b=D.inbox[i], v=E('playtest').rollout.live;
  modal('Opening',`${b.proj} · ${b.env}`,`<div class="stepper" id="ust">${["Confirm it's you",'Check access','Unlock v'+v].map((l,k)=>`<div class="step ${k===0?'cur':''}" data-k="${k}"><span class="dot">${String(k+1).padStart(2,'0')}</span>${l}</div>`).join('')}</div>
    <p class="hint" style="justify-content:center;margin-top:18px">${ic('lock')} Approve in your signer app. Your keys never leave it.</p>`,`<button class="btn ghost" onclick="closeLayer()">Cancel</button>`);
  let k=0; const tick=()=>{const s=document.querySelector(`#ust .step[data-k="${k}"]`); if(!s) return; s.className='step done'; s.querySelector('.dot').innerHTML=ic('check'); k++; const n=document.querySelector(`#ust .step[data-k="${k}"]`); if(n){n.className='step cur'; setTimeout(tick,650);} else setTimeout(()=>{closeLayer();D.unlocked=true;location.hash='#/tester/run';},400);};
  setTimeout(tick,850);
}
let anim;
function vRun(){
  const e=E('playtest'), r=e.rollout, v=e.versions.find(x=>x.n===r.live);
  if(r.state!=='active') return `<div class="page" style="max-width:760px">${refusal('Not available',{what:`playtest is ${r.state}.`,need:'The developer to turn it back on.',fix:"You'll be notified when it's back.",code:'rollout.'+r.state},true)}<a class="btn" href="#/tester">Back to inbox</a></div>`;
  if(!D.unlocked) return `<div class="page" style="max-width:760px">${refusal('Not unlocked',{what:"You haven't opened this build yet.",need:'A quick identity check.',fix:'Open it from your inbox.',code:'session.missing'},true)}<a class="btn" href="#/tester">Back to inbox</a></div>`;
  return `<div class="page"><div class="row" style="margin-bottom:16px"><a class="eyebrow" href="#/tester">← Inbox</a><span class="spacer"></span><button class="btn solid" onclick="reportModal()">${ic('msg')}Report an issue</button></div>
    <div class="stage frame"><div class="bar"><span class="kicker" style="margin:0"><span class="ring live"></span></span><b>playtest v${v.n}</b>${Object.entries(v.mods).map(([m,x])=>ver(m,x)).join('')}<span class="spacer"></span>${fp('view:playtest:'+v.n)}</div><canvas id="game" aria-label="Game preview"></canvas></div>
    <p class="hint">${ic('shield')} Each piece runs in its own sandbox.</p></div>`;
}
function startGame(){
  const c=document.getElementById('game'); if(!c) return; const x=c.getContext('2d'); let t=0;
  const draw=()=>{ if(!document.getElementById('game')) return; const w=c.width=c.clientWidth, h=c.height=c.clientHeight;
    x.fillStyle='#080504'; x.fillRect(0,0,w,h); x.strokeStyle='rgba(233,161,132,.07)'; for(let i=0;i<w;i+=22){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();} for(let j=0;j<h;j+=22){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();}
    x.fillStyle='#231915'; x.fillRect(0,h-56,w,56); [[.18,.6],[.42,.45],[.68,.55]].forEach(([a,b])=>{x.fillStyle='#3a2a23';x.fillRect(a*w,b*h,130,12);});
    const px=(t*2.2)%(w+40)-20, py=h-56-26-Math.abs(Math.sin(t/20))*100; x.shadowColor='#e9a184'; x.shadowBlur=18; x.fillStyle='#e9a184'; x.fillRect(px,py,26,26); x.shadowBlur=0;
    x.fillStyle='#a69389'; x.font='11px JetBrains Mono, monospace'; x.fillText('LEVEL 04 · SCORE '+(1200+Math.floor(t/3)),18,26);
    t++; anim=requestAnimationFrame(draw); };
  cancelAnimationFrame(anim); draw(); if(matchMedia('(prefers-reduced-motion: reduce)').matches) cancelAnimationFrame(anim);
}
function reportModal(){
  const v=E('playtest').versions.find(x=>x.n===E('playtest').rollout.live);
  modal('Report','What did you find?',`<label class="f" for="rT" style="margin-top:4px">In one line</label><input class="input" id="rT" placeholder="e.g. Jump clips through ledge">
    <label class="f" for="rB">What happened</label><textarea class="input" id="rB" rows="3" placeholder="What you did, what you expected, what you saw"></textarea>
    <label class="f">Who can see it</label><div class="seg" id="rV" role="group" aria-label="Who can see it">${['Public','Team only'].map((o,i)=>`<button type="button" class="${i===0?'on':''}" onclick="pickSeg(this)">${o}</button>`).join('')}</div>
    <p class="hint">playtest v${v.n} is attached automatically. You can add a correction later.</p><div id="rMsg"></div>`,
    `<button class="btn ghost" onclick="closeLayer()">Cancel</button><button class="btn solid" onclick="sendReport()">Send report</button>`);
}
function pickSeg(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
function sendReport(){
  const t=document.getElementById('rT').value.trim(), b=document.getElementById('rB').value.trim(), vis=document.querySelector('#rV .on').textContent;
  if(!t||!b){document.getElementById('rMsg').innerHTML=refusal('A little more, please',{what:'The report is missing details.',need:'A title and what happened.',fix:'Fill in both so the developer can reproduce it.',code:'feedback.empty'});return;}
  const r=E('playtest').rollout, v=E('playtest').versions.find(x=>x.n===r.live), n=Math.max(...D.feedback.map(f=>f.n))+1, [m,mv]=Object.entries(v.mods)[0];
  D.feedback.unshift({n,title:t,env:'playtest',v:r.live,mod:m,mv,by:'tester-07',vis,st:'open',at:'just now',body:b,thread:[]});
  D.activity.unshift({k:'feedback',who:'tester-07',at:'just now',t:`reported #${n} on playtest v${r.live}`});
  closeLayer(); toast(`Thanks. Report #${n} sent.`);
}

/* ======================= DESIGN SYSTEM ======================= */
function vSystem(){
  const laws=[['One answer per screen','The headline is the answer. Read only that and you know where things stand.'],['One next step','A single primary action: the thing to do now. Everything else is quieter or tucked away.'],['Details on demand','Lists stay short. Depth opens in a drawer, never a maze of pages.'],['We do the hard work','Never ask people to compare, compute or remember. Show the diff, the count, the fingerprint.'],['Numbers carry units','“82 people”, “3 reports”. A bare number is a question.'],["Say what can't be undone",'Only where it matters, in one sentence, before it happens.'],['Refusals explain themselves',"What happened, what's needed, how to fix. Always all three."],['Plain words, exact IDs nearby','Fingerprints show four characters and copy the full value.']];
  const terms=[['Environment version','environment head'],['Module version','module record'],['Tester group','cohort'],['Release · Pause · Resume · Roll back · Close','rollout events'],['Report · Correction','feedback · supersession'],['Fingerprint','environment-view CID'],["Confirm it's you",'signed challenge'],['Access checked','global resolver → node power'],['Encryption key vN','key epoch'],['Not available yet','notBuilt']];
  return `<div class="page"><section style="padding-top:20px">${kicker('Design system')}<h1 class="page-h">Less on screen. <span class="acc">More understood.</span></h1>
    <p class="lede">We do the hard work so people don't have to think about it. These laws decide what earns a place on screen.</p></section>
  <div class="laws">${laws.map(([h,p],i)=>`<div class="law frame"><div class="num">${String(i+1).padStart(2,'0')} / ${String(laws.length).padStart(2,'0')}</div><h4>${h}</h4><p>${p}</p></div>`).join('')}</div>
  <div class="split" style="margin-top:16px">
    <div class="panel pad accent-top"><div class="eyebrow">Color</div><h2>Warm dark, few signals</h2>
      <div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[['#110b09','Ground'],['#1a1210','Panel'],['#e9a184','Copper · emphasis'],['#62d6ca','Teal · primary action'],['#0d1d29','Navy · secondary'],['#8fdc9f','Green · live, verified'],['#ebbd6a','Amber · paused'],['#f2836f','Red · refused'],['#a69389','Muted text']].map(([c,l])=>`<div><div class="sw" style="background:${c}"></div><div class="eyebrow" style="margin-top:6px;font-size:9.5px">${l}</div><div class="mono dim" style="font-size:11px">${c}</div></div>`).join('')}</div></div>
    <div class="panel pad accent-top"><div class="eyebrow">Type</div><h2>Three voices</h2>
      <div style="font:600 46px/1 var(--display);letter-spacing:-.055em">Headline <span class="acc">answers.</span></div><div class="mono dim" style="font-size:11px;margin:6px 0 18px">INTER TIGHT 600 · −5.5% TRACKING</div>
      <div style="font-size:17px">Body explains in one or two calm sentences.</div><div class="mono dim" style="font-size:11px;margin:6px 0 18px">INTER 400 · 15–17 PX</div>
      <div class="eyebrow" style="color:var(--text)">Labels, units and IDs</div><div class="mono dim" style="font-size:11px;margin-top:6px">JETBRAINS MONO · UPPERCASE · +14% TRACKING</div></div>
  </div>
  <div class="panel pad accent-top" style="margin-top:16px"><div class="eyebrow">Components</div><h2>The kit</h2>
    <div class="ctas">${cta('primary','Ready to ship','Release v4',"toast('Primary: one per screen')")}${cta('secondary','See it like they do','Open as tester',"toast('Secondary')")}</div>
    <div class="row" style="margin-top:18px">${chip('live','Live')}${chip('paused','Paused')}${chip('','Closed')}${chip('revoked','Revoked')}${chip('deprecated','Deprecated')}${chip('notyet','Not available yet')}${ver('physics','2.3.1')}${fp('demo')}<button class="btn solid sm">Solid</button><button class="btn sm">Default</button><button class="btn danger sm">Danger</button><button class="btn ghost sm">Ghost</button></div>
    ${stepper([['Publish','done'],['Compose','done'],['Release','cur'],['Test',''],['Feedback','']])}
    ${refusal("Can't publish this version",{what:'“latest” isn\'t an exact version.',need:'An exact number like 1.2.0.',fix:'Enter the exact number.',code:'module.mutable-version'})}
    <div class="stats" style="margin-top:20px">${stat('Testers',82,'people','Number, unit, one line')}${stat('Open feedback',3,'reports','')}${stat('Live','v3','of 4','')}${stat('Key','v4','current','')}${stat('Rollbacks',0,'total','')}</div></div>
  <div class="panel pad accent-top" style="margin-top:16px"><div class="eyebrow">Handoff</div><h2>Words on screen → protocol</h2><div class="tbl"><table class="t"><tr><th>Users see</th><th>Engineering term</th></tr>${terms.map(([a,b])=>`<tr><td>${a}</td><td class="mono muted" style="font-size:12.5px">${b}</td></tr>`).join('')}</table></div></div>
  </div>${foot()}`;
}

/* ======================= LAYERS ======================= */
let lastFocus=null;
function drawer(title,sub,body,foot){
  lastFocus=document.activeElement;
  document.getElementById('layer').innerHTML=`<div class="scrim" onclick="closeLayer()"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="dh"><div style="min-width:0"><div class="eyebrow">${sub}</div><h3 id="lt">${esc(title)}</h3></div><button class="xbtn" aria-label="Close" onclick="closeLayer()">${ic('x')}</button></div><div class="db">${body}</div>${foot?`<div class="df">${foot}</div>`:''}</aside>`;
  setTimeout(()=>document.querySelector('.drawer .xbtn')?.focus(),0);
}
function modal(eyebrow,title,body,foot){
  lastFocus=document.activeElement;
  document.getElementById('layer').innerHTML=`<div class="scrim"></div><div class="modalw" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="mh"><div class="row"><span class="eyebrow">${eyebrow}</span><button class="xbtn" aria-label="Close" onclick="closeLayer()">${ic('x')}</button></div><h3 id="lt">${esc(title)}</h3></div><div class="mb">${body}</div><div class="mf">${foot}</div></div></div>`;
  setTimeout(()=>(document.querySelector('.modal input,.modal select,.modal textarea')||document.querySelector('.modal .mf .btn:last-child'))?.focus(),0);
}
function closeLayer(){ if(!document.getElementById('layer').innerHTML) return; document.getElementById('layer').innerHTML=''; if(lastFocus&&document.contains(lastFocus)) lastFocus.focus(); }

/* ======================= TEXTURE · faint labelled grid ======================= */
function texture(){
  const c=document.getElementById('tex'), x=c.getContext('2d'), w=c.width=innerWidth, h=c.height=innerHeight;
  const words=['TERMS','CHECK','RESULT','INTENT','LINK','TRACE','OFFER','SNAPSHOT'];
  x.clearRect(0,0,w,h); x.font='7px JetBrains Mono, monospace';
  let s=7; const rnd=()=>((s=(Math.imul(s^(s>>>15),2246822507)+0x6d2b79f5)>>>0)/4294967296);
  for(let gx=0;gx<w;gx+=66) for(let gy=0;gy<h;gy+=44){ if(rnd()<.3){ x.fillStyle='rgba(255,224,204,.05)'; x.fillText(words[(rnd()*words.length)|0],gx+3,gy+9); }
    if(rnd()<.12){ x.fillStyle=`rgba(255,224,204,${.025+rnd()*.04})`; x.fillRect(gx+22*((rnd()*3)|0),gy+22*((rnd()*2)|0),11,11); } }
}
addEventListener('resize',()=>{clearTimeout(texture.t);texture.t=setTimeout(texture,150);});

/* ======================= RENDER ======================= */
function render(){
  const r=route(); let body;
  if(r[0]==='tester'){ D.role='tester'; body=r[1]==='run'?vRun():vInbox(); }
  else if(r[0]==='system'){ body=vSystem(); }
  else { D.role='dev'; body=({overview:vOverview,build:vBuild,release:vRelease,feedback:vFeedback}[r[0]]||vOverview)(); }
  document.getElementById('app').innerHTML=topBar()+body;
  if(r[0]==='tester'&&r[1]==='run') startGame();
}
addEventListener('hashchange',()=>{ closeLayer(); render(); scrollTo(0,0); });
texture(); render();
</script>
</body>
</html>
