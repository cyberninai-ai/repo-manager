<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Env</title>
<style>
:root{
  --bg:#0d1117; --bg2:#010409; --panel:#161b22; --subtle:#1c2129; --hover:#1f242c; --border:#30363d; --border2:#21262d;
  --text:#e6edf3; --muted:#848d97; --link:#4493f8; --accent:#2f81f7; --accent-fg:#ffffff;
  --green:#3fb950; --green-bg:rgba(46,160,67,.15); --yellow:#d29922; --yellow-bg:rgba(187,128,9,.15);
  --red:#f85149; --red-bg:rgba(248,81,73,.1); --purple:#a371f7; --purple-bg:rgba(163,113,247,.15);
  --gray-bg:rgba(110,118,129,.15); --btn:#21262d; --btn-hover:#30363d; --primary:#238636; --primary-hover:#2ea043;
  --shadow:0 8px 24px rgba(1,4,9,.75);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f8fa; --panel:#ffffff; --subtle:#f6f8fa; --hover:#f3f4f6; --border:#d0d7de; --border2:#d8dee4;
  --text:#1f2328; --muted:#656d76; --link:#0969da; --accent:#0969da;
  --green:#1a7f37; --green-bg:#dafbe1; --yellow:#9a6700; --yellow-bg:#fff8c5; --red:#d1242f; --red-bg:#ffebe9; --purple:#8250df; --purple-bg:#fbefff;
  --gray-bg:#eaeef2; --btn:#f6f8fa; --btn-hover:#eef1f4; --primary:#1f883d; --primary-hover:#1a7f37; --shadow:0 8px 24px rgba(140,149,159,.2);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:text-bottom}
.muted{color:var(--muted)} .green{color:var(--green)} .yellow{color:var(--yellow)} .red{color:var(--red)} .purple{color:var(--purple)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.gh-header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:12px 24px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);white-space:nowrap}
.logo .mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#2f81f7,#a371f7);display:grid;place-items:center;color:#fff;font-size:15px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--muted);width:280px;background:var(--bg)}
.search kbd{margin-left:auto;border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:var(--btn);border:0;padding:4px 12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.iconbtn{background:transparent;border:1px solid var(--border);border-radius:6px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted);position:relative}
.iconbtn:hover{color:var(--text);background:var(--hover)}
.iconbtn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg2)}
.avatar{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;color:#fff;flex:none;vertical-align:middle}
.avatar.lg{width:32px;height:32px;font-size:13px}

/* repo header */
.repohead{background:var(--bg2);border-bottom:1px solid var(--border2);padding:16px 24px 0}
.crumb{font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--link)} .crumb b a{font-weight:600}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--text);border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs a:hover{text-decoration:none;background:var(--hover)}
.tabs a.on{border-bottom-color:#fd8c73;font-weight:600}
.tabs a svg{color:var(--muted)}
.counter{background:var(--gray-bg);border-radius:20px;padding:0 7px;font-size:12px;font-weight:500;line-height:18px}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding:24px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px}
@media (max-width:960px){.cols{grid-template-columns:minmax(0,1fr)}.search{display:none}}
@media (max-width:640px){.wrap{padding:16px}.gh-header{padding:10px 16px;gap:10px}.repohead{padding:12px 16px 0}.hide-sm{display:none!important}.crumb{font-size:17px}}
h1{font-size:24px;font-weight:600;margin:0} h2{font-size:16px;font-weight:600;margin:0 0 12px} h3{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 16px}

/* boxes */
.box{border:1px solid var(--border);border-radius:6px;background:var(--panel);margin-bottom:16px;min-width:0}
.box-h{padding:12px 16px;background:var(--subtle);border-bottom:1px solid var(--border);border-radius:6px 6px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.box-b{padding:16px}
.box-row{padding:12px 16px;border-top:1px solid var(--border2);display:flex;gap:12px;align-items:flex-start}
.box-row:first-child{border-top:0}
.box-row.click{cursor:pointer} .box-row.click:hover{background:var(--hover)}
.side h3{font-size:14px;margin:0 0 8px} .side section{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--border2)}
.side section:last-child{border:0}
.side .kv{display:flex;gap:8px;align-items:center;color:var(--muted);margin:6px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--btn);border:1px solid var(--border);border-radius:6px;padding:5px 14px;font-weight:500;cursor:pointer;line-height:20px;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--btn-hover);text-decoration:none}
.btn.primary{background:var(--primary);border-color:rgba(240,246,252,.1);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--red)} .btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:2px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 12px;width:100%;line-height:20px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.3)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
.hint{color:var(--muted);font-size:12px;margin-top:4px}

/* labels */
.state{display:inline-flex;align-items:center;gap:4px;border-radius:2em;padding:2px 10px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap;border:1px solid transparent}
.st-active{background:var(--green-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.st-paused{background:var(--yellow-bg);color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.st-draft,.st-closed,.st-unavailable{background:var(--gray-bg);color:var(--muted);border-color:var(--border)}
.st-deprecated{background:var(--yellow-bg);color:var(--yellow)}
.st-revoked{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.st-notbuilt{background:transparent;color:var(--muted);border:1px dashed var(--border)}
.st-open{background:var(--primary);color:#fff} .st-triaged{background:var(--purple);color:#fff} .st-done{background:var(--purple-bg);color:var(--purple)} .st-wontfix{background:var(--gray-bg);color:var(--muted)}
.lbl{display:inline-block;border-radius:2em;padding:0 7px;font-size:12px;font-weight:500;line-height:18px;border:1px solid transparent}
.l-bug{background:rgba(248,81,73,.15);color:#ff7b72;border-color:rgba(248,81,73,.4)}
.l-ui{background:rgba(56,139,253,.15);color:#79c0ff;border-color:rgba(56,139,253,.4)}
.l-praise{background:rgba(46,160,67,.15);color:#56d364;border-color:rgba(46,160,67,.4)}
.l-perf{background:rgba(187,128,9,.15);color:#e3b341;border-color:rgba(187,128,9,.4)}
:root[data-theme="light"] .l-bug{color:#a40e26} :root[data-theme="light"] .l-ui{color:#0550ae} :root[data-theme="light"] .l-praise{color:#116329} :root[data-theme="light"] .l-perf{color:#7d4e00}
.ver{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:2em;font-size:12px;line-height:18px;overflow:hidden;white-space:nowrap;vertical-align:middle}
.ver b{padding:0 7px;background:var(--subtle);font-weight:500;border-right:1px solid var(--border)} .ver span{padding:0 7px;font-family:var(--mono)}
.fp{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--subtle);border:1px solid var(--border2);border-radius:6px;padding:0 6px;cursor:pointer}
.fp:hover{color:var(--link);border-color:var(--border)}
.fp svg.i{width:12px;height:12px}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;padding:8px 16px;background:var(--subtle);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
td{padding:10px 16px;border-top:1px solid var(--border2);vertical-align:middle}
tr:first-child td{border-top:0}
.tbl{overflow-x:auto}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)}
.diff-add td{background:rgba(46,160,67,.12)} .diff-del td{background:rgba(248,81,73,.1)} .diff-chg td{background:rgba(187,128,9,.1)}
.diff-add td:first-child{box-shadow:inset 3px 0 var(--green)} .diff-del td:first-child{box-shadow:inset 3px 0 var(--red)} .diff-chg td:first-child{box-shadow:inset 3px 0 var(--yellow)}

/* callouts */
.callout{border:1px solid;border-radius:6px;padding:12px 16px;margin:12px 0;display:flex;gap:12px}
.callout.err{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.callout.warn{background:var(--yellow-bg);border-color:color-mix(in srgb,var(--yellow) 40%,transparent)}
.callout.info{background:rgba(56,139,253,.1);border-color:rgba(56,139,253,.4)}
.callout.ok{background:var(--green-bg);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.callout .ic{padding-top:2px} .callout.err .ic{color:var(--red)} .callout.warn .ic{color:var(--yellow)} .callout.info .ic{color:var(--link)} .callout.ok .ic{color:var(--green)}
.callout dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:8px 0 0}
.callout dt{color:var(--muted)} .callout dd{margin:0}
@media (max-width:640px){.callout dl{grid-template-columns:minmax(0,1fr)}.callout dd{margin-bottom:6px}}
.code{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* timeline */
.tl{position:relative;padding-left:40px}
.tl:before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--border2)}
.tl-item{position:relative;padding:8px 0}
.tl-badge{position:absolute;left:-40px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--subtle);border:2px solid var(--bg);display:grid;place-items:center;color:var(--muted)}
.tl-badge.g{background:var(--primary);color:#fff} .tl-badge.y{background:#9e6a03;color:#fff} .tl-badge.r{background:#da3633;color:#fff} .tl-badge.p{background:#8957e5;color:#fff}
.comment{border:1px solid var(--border);border-radius:6px;background:var(--panel);margin:8px 0}
.comment .ch{padding:8px 16px;background:var(--subtle);border-bottom:1px solid var(--border);border-radius:6px 6px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.comment .cb{padding:12px 16px}
.comment.author{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))} .comment.author .ch{background:rgba(56,139,253,.08)}

/* misc */
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty svg.i{width:24px;height:24px;margin-bottom:8px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters .input{flex:1;min-width:200px}
.statbig{display:flex;gap:12px;align-items:center}
.pill-tabs{display:flex;gap:16px} .pill-tabs a{color:var(--muted)} .pill-tabs a.on{color:var(--text);font-weight:600}
.envcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
.livedot.p{background:var(--yellow);box-shadow:0 0 0 3px var(--yellow-bg)} .livedot.c{background:var(--muted);box-shadow:none}
.bar{height:8px;border-radius:4px;background:var(--gray-bg);overflow:hidden} .bar i{display:block;height:100%;background:var(--green)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px} .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.swatch{height:36px;border-radius:6px;border:1px solid var(--border)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.6);display:grid;place-items:start center;padding:72px 16px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-h{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal-b{padding:16px;max-height:calc(100vh - 220px);overflow:auto}
.modal-f{padding:16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 32px)}
.toast{background:var(--panel);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:8px;align-items:center;max-width:420px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.steps{list-style:none;margin:0;padding:0} .steps li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted)} .steps li.done{color:var(--text)} .steps li.done svg{color:var(--green)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none} @keyframes sp{to{transform:rotate(360deg)}}
.runbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--subtle);border:1px solid var(--border);border-radius:6px 6px 0 0}
.stage{height:420px;border:1px solid var(--border);border-top:0;border-radius:0 0 6px 6px;background:#05070b;position:relative;overflow:hidden}
.stage canvas{width:100%;height:100%;display:block}
.dropdown{position:relative} .menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:220px;z-index:40;padding:4px}
.menu a,.menu button{display:flex;gap:8px;align-items:center;width:100%;padding:6px 10px;border-radius:6px;color:var(--text);background:none;border:0;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--hover);text-decoration:none}
.menu hr{border:0;border-top:1px solid var(--border2);margin:4px 0}
footer.foot{border-top:1px solid var(--border2);margin-top:24px;padding:24px;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>

function toast(msg,kind='ok'){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`${ic(kind==='ok'?'check':kind==='err'?'alert':'alert', kind==='ok'?'green':kind==='err'?'red':'yellow')}<span>${msg}</span>`; const b=document.getElementById('toasts'); b.appendChild(t); while(b.children.length>3) b.firstChild.remove(); setTimeout(()=>t.remove(),3800); }
function callout(kind,title,{what,need,fix,code}={},body=''){

function vEnvironments(){

function diffRows(a,b){
  const ids=[...new Set([...Object.keys(a||{}),...Object.keys(b)])];
  return ids.map(id=>{ const o=a?.[id], n=b[id]; const k=!o?'add':!n?'del':o!==n?'chg':'same';
    return `<tr class="diff-${k}"><td><b>${id}</b></td><td><code>${mod(id)?.mount||''}</code></td><td>${o?`<code>${o}</code>`:'<span class="muted">—</span>'}</td><td>${n?`<code>${n}</code>`:'<span class="muted">removed</span>'}</td><td class="muted" style="font-size:12px">${{add:'Added',del:'Removed',chg:'Changed',same:'Unchanged'}[k]}</td></tr>`; }).join('');
}
function vEnv(id, n){
  const e=env(id); if(!e) return vEnvironments();
  const r=D.rollouts[id]; const sel = n? e.versions.find(x=>x.n===+n) : e.versions.at(-1); const prev=e.versions.find(x=>x.n===sel.n-1);
  return `<div class="wrap"><div class="row" style="margin-bottom:4px"><a href="#/p/environments">Environments</a><span class="muted">/</span><h1 style="font-size:20px">${e.id}</h1>${state(r.state)}<span class="spacer"></span>
    <button class="btn" onclick="go('#/p/rollouts')">${ic('rollout')}Manage rollout</button><button class="btn primary" onclick="composeModal('${e.id}')">${ic('plus')}New version</button></div>
  <div class="sub">${esc(e.desc)}</div>
  <div class="cols"><div>
    <div class="box"><div class="box-h"><h3>v${sel.n}</h3>${sel.n===r.live?`<span class="state st-${r.state}">${r.state==='active'?'Live':'Live · paused'}</span>`:''}<span class="muted">${esc(sel.note)}</span><span class="spacer"></span>${fp('env:'+e.id+':'+sel.n)}</div>
      <div class="tbl"><table><tr><th>Module</th><th>Path</th><th>${prev?'v'+prev.n:'Before'}</th><th>v${sel.n}</th><th></th></tr>${diffRows(prev?.mods,sel.mods)}</table></div>
      <div class="box-b muted" style="font-size:12px;border-top:1px solid var(--border2)">${av(sel.by)} ${sel.by} published v${sel.n} on ${sel.at}${prev?` · compared with v${prev.n}`:''}</div></div>
  </div>
  <aside class="side"><section><h3>Versions</h3>${e.versions.slice().reverse().map(x=>`<a href="#/p/environments/${e.id}/${x.n}" style="display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;${x.n===sel.n?'background:var(--hover);':''}color:var(--text)">${ic('layers','muted')}<b>v${x.n}</b><span class="muted" style="font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.note)}</span>${x.n===r.live?'<span class="livedot '+(r.state==='paused'?'p':'')+'"></span>':''}</a>`).join('')}</section>
  <section><h3>Same version, same experience</h3><p class="muted" style="margin:0">Testers can't receive a mix of modules that isn't one of these recorded versions.</p></section></aside></div></div>`;
}
function composeModal(id){
  const e=env(id), cur=e.versions.at(-1);
  const rows = D.modules.map(m=>`<tr><td><b>${m.id}</b><div class="muted" style="font-size:12px"><code>${m.mount}</code></div></td><td><select class="input cm" data-m="${m.id}" aria-label="${m.id} version"><option value="">Not included</option>
    ${m.versions.slice().reverse().map(v=>`<option value="${v.v}" ${cur.mods[m.id]===v.v?'selected':''} ${v.status==='revoked'?'disabled':''}>${v.v}${v.status==='revoked'?' (revoked)':v.status==='deprecated'?' (deprecated)':''}</option>`).join('')}</select></td></tr>`).join('');
  modal(`New version of ${id}`,`<p class="muted" style="margin-top:0">Pick an exact version of each module. Starts from v${cur.n}.</p><div class="box" style="margin:0"><table>${rows}</table></div>
    <label class="f" for="cmNote">What changed?</label><input class="input" id="cmNote" placeholder="e.g. Physics fix for high refresh rates">
    <div id="cmMsg"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="publishEnv('${id}')">Publish v${cur.n+1}</button>`,true);
}
function publishEnv(id){
  const e=env(id), cur=e.versions.at(-1), mods={};
  document.querySelectorAll('.cm').forEach(s=>{ if(s.value) mods[s.dataset.m]=s.value; });
  const msg=document.getElementById('cmMsg');
  if(!Object.keys(mods).length){ msg.innerHTML=callout('err',"Can't publish an empty version",{what:'No modules are selected.',need:'At least one module version.',fix:'Choose a version for one or more modules.',code:'environment.empty'}); return; }
  if(JSON.stringify(Object.entries(mods).sort())===JSON.stringify(Object.entries(cur.mods).sort())){ msg.innerHTML=callout('err','Nothing changed',{what:`This is identical to v${cur.n}.`,need:'At least one different module version.',fix:`Change a module version, or release v${cur.n} instead.`,code:'environment.identical-composition'}); return; }
  const dep = Object.entries(mods).filter(([m,v])=>mod(m).versions.find(x=>x.v===v).status==='deprecated');
  if(dep.length && !msg.dataset.ack){ msg.dataset.ack=1; msg.innerHTML=callout('warn','Includes a deprecated version',{},`${dep.map(([m,v])=>m+' '+v).join(', ')} is deprecated. Click Publish again to continue anyway.`); return; }
  const note=document.getElementById('cmNote').value.trim()||'Updated modules';
  e.versions.push({n:cur.n+1,mods,by:'mara',at:'just now',note}); log('version',`published environment <b>${id} v${cur.n+1}</b>`);
  closeModal(); toast(`${id} v${cur.n+1} published. It isn't live until you release it.`); go(`#/p/environments/${id}/${cur.n+1}`);
}

/* ======================= DEV: ROLLOUTS ======================= */
const EV_TXT = {activate:'released',pause:'paused',resume:'resumed',rollback:'rolled back to',close:'closed'};
const EV_BADGE = {activate:['rollout','g'],pause:['pause','y'],resume:['play','g'],rollback:['undo','r'],close:['stop','']};
function vRollouts(){
  return `<div class="wrap"><h1 style="font-size:20px">Rollouts</h1><div class="sub">Choose which environment version is live and who gets it. Every change is kept in the timeline.</div>
  ${D.envs.map(e=>{ const r=D.rollouts[e.id], g=D.groups.find(x=>x.id===r.group), newest=e.versions.at(-1).n;
    return `<div class="box"><div class="box-h"><span class="livedot ${r.state==='paused'?'p':r.state==='closed'?'c':''}"></span><h3>${e.id}</h3>${state(r.state)}<span class="spacer"></span>
      ${r.state==='active'?`<button class="btn sm" onclick="rolloutAction('${e.id}','pause')">${ic('pause')}Pause</button>`:''}
      ${r.state==='paused'?`<button class="btn sm" onclick="rolloutAction('${e.id}','resume')">${ic('play')}Resume</button>`:''}
      ${r.state!=='closed'&&r.live>1?`<button class="btn sm" onclick="rollbackModal('${e.id}')">${ic('undo')}Roll back</button>`:''}
      ${r.state!=='closed'&&newest>r.live?`<button class="btn sm primary" onclick="releaseModal('${e.id}',${newest})">${ic('rollout')}Release v${newest}</button>`:''}
      ${r.state!=='closed'?`<button class="btn sm danger" onclick="closeRolloutModal('${e.id}')">Close</button>`:''}</div>
      <div class="box-b"><div class="grid3">
        <div><div class="muted" style="font-size:12px">Live version</div><div style="font-size:20px;font-weight:600">v${r.live} ${newest>r.live?`<span class="muted" style="font-size:12px;font-weight:400">· v${newest} ready</span>`:''}</div></div>
        <div><div class="muted" style="font-size:12px">Who gets it</div><div style="font-weight:600">${esc(g.name)}</div><div class="muted" style="font-size:12px">${esc(g.rule)} · ${g.members} people</div></div>
        <div><div class="muted" style="font-size:12px">Fingerprint testers see</div><div>${fp('view:'+e.id+':'+r.live)}</div></div></div>
        <h3 style="margin:20px 0 8px">Timeline</h3>
        <div class="tl">${r.events.slice().reverse().map(ev=>{const [icn,c]=EV_BADGE[ev.a];return `<div class="tl-item"><span class="tl-badge ${c}">${ic(icn)}</span><div style="padding-top:5px">${av(ev.by)} <b>${ev.by}</b> ${EV_TXT[ev.a]} ${ev.a==='close'?'the rollout':'<b>v'+ev.v+'</b>'} <span class="muted">· ${ev.at}</span>${ev.reason?`<div class="muted" style="font-size:13px;margin-top:2px">“${esc(ev.reason)}”</div>`:''}</div></div>`}).join('')}</div>
      </div></div>`}).join('')}</div>`;
}
function rolloutAction(id,a,extra={}){
  const r=D.rollouts[id];
  const v = extra.v ?? r.live;
  r.events.push({a,v,by:'mara',at:'just now',reason:extra.reason});
  if(a==='pause') r.state='paused'; if(a==='resume'||a==='activate'||a==='rollback') r.state='active'; if(a==='close') r.state='closed';
  if(a==='activate'||a==='rollback') r.live=v;
  log('rollout',`${EV_TXT[a]} <b>${id}${a==='close'?'':' v'+v}</b>${extra.reason?` (${esc(extra.reason)})`:''}`);
  toast({pause:`${id} paused. Testers can't open it until you resume.`,resume:`${id} resumed`,activate:`${id} v${v} is live`,rollback:`${id} rolled back to v${v}`,close:`${id} rollout closed`}[a]); closeModal(); render();
}
function releaseModal(id,n){
  const r=D.rollouts[id], g=D.groups.find(x=>x.id===r.group), e=env(id);
  modal(`Release ${id} v${n}?`,`<p style="margin-top:0"><b>${esc(g.name)}</b> (${g.members} people) will get v${n} the next time they open ${id}.</p>
    <div class="box" style="margin:0"><table><tr><th>Module</th><th>Path</th><th>v${r.live} (live)</th><th>v${n}</th><th></th></tr>${diffRows(e.versions.find(x=>x.n===r.live).mods,e.versions.find(x=>x.n===n).mods)}</table></div>
    ${callout('info','People already playing',{},`Testers with v${r.live} open finish their session first, then switch to v${n}.`)}`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="rolloutAction('${id}','activate',{v:${n}})">Release v${n}</button>`,true);
}
function rollbackModal(id){
  const r=D.rollouts[id], e=env(id); const opts=e.versions.filter(x=>x.n<r.live).reverse();
  modal(`Roll back ${id}`,`<label class="f" for="rbV" style="margin-top:0">Go back to</label><select class="input" id="rbV">${opts.map(x=>`<option value="${x.n}">v${x.n}: ${esc(x.note)}</option>`).join('')}</select>
    <label class="f" for="rbR">Reason <span class="muted">(required, shown in the timeline)</span></label><input class="input" id="rbR" placeholder="e.g. Level 4 crashes after reload">
    <div id="rbMsg"></div>
    <h3 style="margin:16px 0 6px">What happens</h3><ul style="padding-left:18px;margin:0"><li>Testers get the earlier version at their next session.</li><li>v${r.live} and everything since stay in history. Nothing is deleted.</li><li>You can release v${r.live} again later.</li></ul>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doRollback('${id}')">${ic('undo')}Roll back</button>`);
}
function doRollback(id){ const reason=document.getElementById('rbR').value.trim(); if(!reason){ document.getElementById('rbMsg').innerHTML=callout('err','A reason is required',{what:'Rollbacks without a reason are refused.',need:'A short reason testers and teammates can read.',fix:'Describe why you are rolling back.',code:'rollout.reason-required'}); return; }
  rolloutAction(id,'rollback',{v:+document.getElementById('rbV').value,reason}); }
function closeRolloutModal(id){
  modal(`Close the ${id} rollout?`,`${callout('warn','Closing is final',{},'')}<ul style="padding-left:18px;margin:0"><li>Nobody can open ${id} after this, including testers mid-session.</li><li>Feedback and history stay readable.</li><li>To test again, start a new rollout.</li></ul>
    <label class="f" for="clC">Type <b>${id}</b> to confirm</label><input class="input" id="clC">`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="if(document.getElementById('clC').value==='${id}')rolloutAction('${id}','close');else toast('Type the environment name to confirm','warn')">Close rollout</button>`);
}

  const m=mod(id); if(m.versions.some(x=>x.v===v)){ out.innerHTML=callout('err','This version already exists',{what:`${id} ${v} was published earlier.`,need:'A version number that hasn\'t been used.',fix:'Published versions never change. Bump the number (for example to '+v.replace(/(\d+)$/,d=>+d+1)+').',code:'module.version-reuse'}); return; }

function startGame(){
  const c=document.getElementById('game'); if(!c) return; const x=c.getContext('2d'); let t=0;
  const draw=()=>{ if(!document.getElementById('game')) return; const w=c.width=c.clientWidth, h=c.height=c.clientHeight; x.fillStyle='#05070b'; x.fillRect(0,0,w,h);
    x.strokeStyle='rgba(47,129,247,.18)'; for(let i=0;i<w;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();} for(let j=0;j<h;j+=40){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke();}
    x.fillStyle='#21262d'; x.fillRect(0,h-60,w,60); [[.2,.55],[.45,.42],[.7,.5]].forEach(([a,b])=>{x.fillStyle='#30363d';x.fillRect(a*w,b*h,120,14);});
    const px=(t*2)%(w+40)-20, py=h-60-28-Math.abs(Math.sin(t/18))*90; x.fillStyle='#3fb950'; x.fillRect(px,py,28,28);
    x.fillStyle='#e6edf3'; x.font='14px ui-monospace,monospace'; x.fillText('LEVEL 4 · score '+(1200+Math.floor(t/3)),16,26);
    t++; anim=requestAnimationFrame(draw); };
  cancelAnimationFrame(anim); if(matchMedia('(prefers-reduced-motion: reduce)').matches){ draw(); cancelAnimationFrame(anim); } else draw();
}

function vDesign(){

  </div>
  <div class="box"><div class="box-h"><h3>Words on screen vs. protocol terms</h3><span class="muted">for the dev handoff</span></div><div class="tbl"><table><tr><th>In the UI</th><th>Protocol term</th><th>Reference</th></tr>${terms.map(([a,b,c])=>`<tr><td><b>${a}</b></td><td>${b}</td><td><code>${c}</code></td></tr>`).join('')}</table></div></div>
  <div class="box"><div class="box-h"><h3>Principles</h3></div><div class="box-b"><ol style="margin:0;padding-left:18px">
    <li>Familiar first: tabs, lists, timelines and labels follow GitHub patterns, so nothing needs explaining.</li>
    <li>The UI never decides access. It shows what the access service decided, including when it can't be reached.</li>
    <li>History is permanent. There are no delete buttons for versions, rollouts or reports, only new entries (deprecate, revoke, roll back, correction).</li>
    <li>Plain words on screen; exact identifiers one click away.</li>
    <li>Keys stay in the signer. No screen asks for a key file or secret.</li></ol></div></div></div>`;
}

/* ======================= MODAL ======================= */
let lastFocus=null;
function modal(title,body,foot,wide){
  lastFocus=document.activeElement;
  document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="modal-h"><h3 id="mt" style="flex:1">${title}</h3><button class="iconbtn" style="border:0" aria-label="Close" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></div></div>`;
  setTimeout(()=>document.querySelector('.modal input, .modal select, .modal textarea, .modal .btn')?.focus(),0);
}
function closeModal(){ document.getElementById('modal').innerHTML=''; lastFocus?.focus?.(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{ const c=e.target.closest('[data-copy]'); if(c){ navigator.clipboard?.writeText(c.dataset.copy).catch(()=>{}); toast('Fingerprint copied'); } });
document.addEventListener('keydown',e=>{ const c=e.target.closest?.('[data-copy]'); if(c&&e.key==='Enter'){ c.click(); } });

/* ======================= RENDER ======================= */
function render(){
  const r=route(); let html=header();
  if(r[0]==='p'){
    const tab=r[1]||'overview'; if(D.role!=='dev'){ D.role='dev'; html=header(); }
    html+=repoHead(tab);
    html+=({overview:vOverview,modules:()=>r[2]?vModule(r[2]):vModules(),environments:()=>r[2]?vEnv(r[2],r[3]):vEnvironments(),rollouts:vRollouts,testers:vTesters,feedback:()=>r[2]?vFeedbackItem(r[2]):vFeedback(),activity:vActivity,settings:vSettings}[tab]||vOverview)();
  } else if(r[0]==='tester'){ if(D.role!=='tester'){ D.role='tester'; html=header(); } html+= r[1]==='run'?vRun():vTesterInbox(); }
  else if(r[0]==='design'){ html+=vDesign(); }
  else { if(D.role==='tester'){ html+=vTesterInbox(); } else html+=vHome(); }
  html+=`<footer class="foot"><span>Remote Env · design prototype</span><a href="#/design">Design system</a><span>Data and actions are mocked</span></footer>`;
  document.getElementById('app').innerHTML=html;
  if(r[0]==='tester'&&r[1]==='run') startGame();
}
render();
</script>
